  #### 关于高目标与摆锤的建议


  ##### 摆锤的干扰与重要性


  > “我的问题是：我给自己设定了极高的目标，但我时刻被挡路的摆锤包围。我无法与任何人谈论我的目标或探讨我的兴趣，甚至亲戚都说我不会成功。当我观察他人时，他们看起来几乎都差不多。请给我一些建议。”


  **摆锤当然会挡你的路**。它们挡的是**每个人的路**。将其反作用降至最低的方法是**将重要性门槛降至最低，即不赋予任何事物过度意义**。这建议可能听起来不同寻常，但**绝大多数问题源于过高的内在与外在重要性**。


  ##### 目标的真实归属与实现


  **“极高目标”本身并不难实现**。是**公认的刻板印象和头脑的虚假思维模式**让它们变得难以实现。**协调意图原则能帮你打破这些刻板印象和思维模式**。


  **如果目标真正是你自己的，你能实现任何目标**。如果目标是别人为你设定的，当你在脑海中演练目标已实现的景象时，你会感到**内心的不适**。


  关于**目标选择及实现方式**，你可以参考他人意见，但**赋予其意义不应超过参考价值**。你应遵循**内心的指引**，而非他人的建议，尤其是那些“只为你好”的亲戚。


  ##### 关于你的困惑


  话虽如此，**从你的来信中我无法判断问题的准确性质**。“当我观察他人，他们看起来都差不多”这句话**尤为模糊**。


  ---


  ##### 补充：关于不被理解的困境


  > “让我解释一下：没人理解我，包括朋友和父母。他们不理解我的欲望，试图施压让我做他们想要的事。他们不明白怎么会有人像我这样思考。我是那种喜欢严格自律的人。我规划一天，积极主动，对目标坚持不懈、锲而不舍；渴望获取新知识等。父母让我忘掉那些，找份工作，过无忧无虑的生活，我认为那是非常平庸的目标。朋友的立场我觉得甚至更糟。他们只想着怎么逃下一节课。他们侮辱老师，讨论我完全不感兴趣的话题。他们还让我无法专心听课。更糟的是，父母总是吵架。”


  （此段为读者补充说明，原文未给出回复建议，此处保留原文语境供参考）






  现在情况清楚多了。你可能不喜欢我的回答，但提出建议是我的事，决定是否采纳则是你的事。我不会把我的观点强加给任何人，但既然你问了我，我就要回答。


  解决你问题的办法是**扮演傻瓜**。我是认真的，字面意义上的。别以为我是在逗你开心。要非常慎重地选择傻瓜的形象，要选一个能让你展现出所有积极品质的形象：一丝不苟、有条有理、专注致志。最好你选来扮傻瓜的东西是个无生命的物体，这样就不会造成任何尴尬。仔细考虑一下你要选什么物体。我建议例如用一只泰迪熊。


  一旦找到了合适的“傻瓜”，就制定一个周密的计划，安排在哪里、何时、如何“捉弄”这个傻瓜。最好拟定一套详细说明其动作的指令，诸如：“要捉弄上述傻瓜，需绕其纵轴旋转。傻瓜应放置在平坦表面上，且摆放位置不得妨碍其旋转。傻瓜的旋转由捉弄傻瓜者双手连续施力完成”等等，如此这般。


  指令和计划应一丝不苟地拟定，极其注重细节，包括安全措施。认真对待这项任务，你最终会得到一个相当令人印象深刻的项目。我建议你以专业的方式排版该项目，并放在一个公文包中呈现。


  一旦项目的这个阶段完成，你就可以着手实施了。做好充分准备，严格按照指令认真执行所有必要动作。你的面部表情应当聪慧且专注。如果你发现自己忍俊不禁、大笑不止，就休息一下，笑个够，等冷静下来再继续。


  你以为我在嘲笑你？问题的关键在于，你问题的根源在于**内在重要性的过度势能**。你写道：“……我是那种喜欢严格自律、规划日程、积极主动、在目标上坚持不懈、锲而不舍的人……但我总是被挡道的摆所包围”。


  你对自己要求过高（可能对别人也一样）。我不知道，但我怀疑你给自己安上了“肩负重任、严肃负责之人”的角色。如果是这样，你总会发现身边围绕着一些表现出相反品质、大惊小怪的人。例如，那些不负责任、无条理、不守纪律、惹是生非的人会让你恼火。基本上，就是各种鸟脑子，专门搞乱你的周密计划。


  生活为什么会这样？因为你内在重要性的过度势能产生了一个强大的极化实例。具有相反特质的人会像铁屑被磁铁吸引一样被你吸引过来。这就是平衡力量为了消除势能而运作的方式。你体验到的世界是你的镜子。但如果你制造了内在或外在重要性的过度势能，镜子就会弯曲，现实的扭曲就会表现为被挡道的摆所包围。


  更准确地说，挡你道的人不那么多是摆本身，而是摆的**傀儡**。摆感应到你势能的能量，让其他人的行为变得让你难以忍受。结果你被激怒了，哈勒昆（内心的小丑/表演者）跳得更高。摆让它摆动，并接收你恼火的能量。


  一旦你降低重要性的势能，外部世界的图景就会逐渐转变。你身边还是那些人，但他们对你的表现会截然不同。极化一消失，镜子就变平了，现实恢复常态。


  那么是什么导致了极化，肯定不是你的积极品质？确实不是。你显然拥有非常积极的品质，这无疑将让你一生受益。极化是**依赖关系**产生的结果。


  只有当你开始拿自己跟别人比较时，你的积极品质才会在外部能量图景中产生变化。例如，你会想：我有纪律，他们是邋遢鬼；他们不专注，我目标明确。进行这类对比正是招致极化的原因。


  通过实施这个仪式，你将消除内在重要性。你可能会觉得这仪式不适合你。那最好就是单纯抵制拿自己跟周围人比较的诱惑。做你自己，允许别人也做他们自己。放松你的掌控。一旦你这么做，极化就会消失，世界其余部分会莫名其妙地变得不同，不再挡你的道。那时你就会明白什么是“Transurfing
  Reality”（摆渡现实/趋避现实）。


  “你建议一位严肃的读者‘扮演傻瓜’。那那些忙着‘胡闹’的人怎么办？怎么让他们去做些更严肃的事？”


  没人想干正经事，并非因为他们本来就严肃，而是因为我们认为严肃的事，并非他们命中注定该做的事。懒惰是灵魂的一种状态。灵魂不想忙别人的闲事，这是非常自然的。或许灵魂来到这个世界不是为了给摆当苦力，而是为了在海边阳光下取暖、去阿尔卑斯山滑雪、旅行，或享受生活中其他诸多乐趣。


  “对，那这儿谁来干活？”愤怒的摆问道，对此可以用一首幽默学生歌里的歌词来回答：“把活儿留给蓬头垢面的熊，它除了在森林里游荡吼叫别无他事”。说得太对了，因为责任感和义务感是摆的发明。


  实际上，我们的世界如此丰富慷慨，财富足够分配，只要每个人都通过自己的门、朝着自己的目标前进。这不太可能发生，但这不妨碍某个特定个体将自己世界层变成一个非常舒适的小角落。


  你必须找到你真正的目标和门。当你朝着自己的目标前进时，不需要说服或强迫自己行动。灵魂会雀跃着通过自己的门奔向目标。在别人眼里你的门可能看起来是个累人的任务，但对你来说却是一种享受。


  只要你在通过别人的门、朝着别人的目标前进，你就是在为摆打工。当你走在这条路上时，灵魂总会说“我不想”，理智却坚持说“你必须”。无论这条路披着多么合理的论点和多么美好的风景，都是通向无处的路。只有一个解决办法——确立自己的目标并为之奋斗。


  在此期间，应对被迫义务的良方可以是**游戏**。还记得小时候你怎么玩过家家、玩商店、玩医院吗？现在想象你在做的只是玩游戏，不是在劳动。


  只有当你的理智沉浸在游戏中时，你才会因被迫义务而受苦。采取**演员兼观众、参与的旁观者**的角色。超然地行动。不要把自己完全交给被迫做的工作。假装那是个游戏。把自己“租”出去。


  #### 现实反转


  现实在时间胶卷上不可阻挡地移动着帧。假期来了又走。只可惜它们结束得太快。海明威说人生是一场流动的盛宴，会伴随你一生，他说得真对，尽管很少有人能那样活着。流动的盛宴在途中意外地遗失了，此后生命的所有色彩都褪去了。空虚和压抑的忧郁填满了灵魂的空间，有时原因显而易见，有时则不然。






  最糟糕的是，世界迅速且心甘情愿地陷入黑暗，而启蒙却在漫长的期盼中缓缓显现。人性中消极的倾向有其晦暗的路径，并导致一种被压抑的状态，在其中心智一致认定生活有多么糟糕。


  当这种情况发生时，外在意图稳定地将现实推移至替代空间中更黑暗的区域。镜子毫不犹豫、毫不延迟地快速响应，而启蒙则迟迟不现，因为当一个人感到沮丧时，他们的态度会用越来越深沉的色调描绘他们世界的层。有时一切看起来都如此可怕，以至于你没有精力去回忆
  Transurfing（空间变换）或其他任何东西。你该如何打破恶性循环并理顺现实？一般来说这很难做到，但确实存在一种可应用的激进方法，称为现实倒置。


  很久以前，而实际上也就在最近，仅仅二十年前，当我们还是物理系学生时，我们在一个极其糟糕的系里学习，那里的老师化身为穴居人的野蛮。大一开学有七十五名学生，但坚持到毕业的不足二十五人。在这样的环境下，生存法则是：如果你想活着出去，学会大笑。


  我们编了一个游戏，事后我把它忘了，很久以后才更透彻地理解它：这个游戏完全遵循 Transurfing 的所有规则。游戏的精髓在于将你对某种情境的关系彻底颠倒，即发起一种倒置。当事情变坏时，摆动规则让你受苦、担忧、在问题的重压下崩溃，总体上失控或彻底放纵。我们的游戏规则要求你做相反的事。我们做得好不好，你自己评判。


  “我欣喜地失望了！”“幸运的是，发生了一件可怕的倒霉事！”


  “发生了一件无法挽回的事，我的事业瞬间起飞了！”


  “一位坐汽车的绅士刚刚迷人地把我泼了一身泥！”


  “所有尝试都白费了，这确保了我的成功！”


  “她不爱我！不，那好得难以置信。她假装得真美！”


  “他甩了我，我像布琼尼的马一样大笑！”


  以此类推，尽是机智的妙语。唯一的麻烦是随我们所有转化厄运尝试而来的歇斯底里的大笑。讲课时不许大笑出声，所以压抑的笑声变成了轰鸣、喷鼻声、咯咯笑和咕噜声，以及其他各种偶蹄目和两栖动物特有的声音。课间休息时，积累的能量宣泄成卡斯塔内达式的狂笑。


  从 Transurfing 的角度来看，发生的事情很清楚。首先，任何关联重要性被降低，从而过剩潜能也随之降低。其次，欣喜的思想能量参数，哪怕是愚蠢的，也远离悲惨的生命线，因此立即发生了向积极方向的转移。镜子响应迅速，因此心智松一口气，结果现实被拉平了。


  曾有一次我们在准备概率论考试。这位老师简直可怕透顶。在第二天考试的阴影下，学生宿舍度过了一个阴森的夜晚。我和朋友绞尽脑汁思考如何拉平局势。


  “谁知道什么是概率以及怎么算？”


  “这是一个笼罩在黑暗中的谜团。”


  “她们像老巫婆坐在那里死记硬背。”


  “这不适合我们。我们是真汉子还是怎么了？”


  “半吊子混蛋。”其中一位“巫婆”听到我们的谈话，把头探进门来：“闭嘴，贱民，我们是绅士！”“混蛋。”


  “青年科学家！”


  “白痴。”


  最后有人提议通宵打扑克，我说道：“不，各位，这太过分了。我去睡觉了。”但那些“绅士”穿上像样的西装打上领带，嘴叼廉价雪茄，桌上摆着几瓶外观可疑的液体，坐下来玩牌。


  第二天早上醒来，发现他们还坐在桌旁。


  “你们这些白痴，”我说，“你们全都要挂科！”


  他们站起来，抖擞了一下，奔赴屠场。


  结果他们的恶作剧导致考得很不好。他们全得了“C”。而我没有。不，我得了“E”。那才是真正的成功！他们多么嫉妒我啊！事后他们全凑过来，用探究的目光诚恳地问我是怎么做到的。


  我昂首挺胸。


  “看吧。我就说嘛。希望你们明白，绅士们，可以把你们可怜的‘C’塞哪儿去了。”


  那天我们庆祝我的胜利，其乐融融。第二天我补考，得了“A”。我没编造。相信我，如果你把倒置做得好，结果不会让你久等。


  如果你的心情低落到根本无法让自己做倒置，那你必须让心情变得更糟，推向极端、怪诞、荒谬。如果你将幻灯片的对比度拉到最大，会有一个临界点让它变成负片。这大致就是我们在做的事。


  有个女孩很抑郁。为了让情况更糟，她穿上黑衣服，让大家知道她在服丧。朋友们上前吊唁，询问她打算怎么自杀、何时自杀。最后大家围住她，发自内心地唱起悲伤凄切的歌，嚎啕大哭、捶胸顿足，简直像野蛮人——全套仪式。渐渐地，原始的歌声变成了长久的哭喊和狼嚎，当他们再也忍不住时，包括那位穿黑衣的女士在内，所有人都爆发出无法控制的大笑。


  当然，如果你有一群风趣的朋友这很容易，但如果没有，你必须独自应对。怎么做因人而异。玩笑归玩笑，将你的状态推向荒谬确实管用。不过应避免使用改变意识的物质，因为服用后果可能更糟。


  就我个人而言，不赞成独自使用对比度法，所以我不是特别推荐，只是提供供参考。低落抑郁的状态表明意图的能量水平极低。最好一开始就尝试保持能量水平在更健康的层面，从而避免抑郁。


  正如你所见，现实倒置类似于意图协调原则。唯一的区别在于，倒置是一种基于幽默的更激进的方法。


