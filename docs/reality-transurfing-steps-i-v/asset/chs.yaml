  #### 我和我的世界去买个玩具


  #### 意图的能量


  在上一章中，你已了解了控制现实的原则。现在我们将探讨具体方法。没有它，Transurfing 根本不可能实现的第一个必要条件是：你必须拥有良好的能量水平。


  能量分两种：生理能量和自由能量。你感受前者为温暖和体力，它是新陈代谢的结果。为了维持生理能量水平，吃得好、休息好、锻炼、呼吸新鲜空气就足够了。


  自由能量源于宇宙，沿着能量通道流动，表现为精力或活力。这种能量就是意图的能量，它让人感到有能力采取果断行动。如果你每天拖沓度日，仅有力气进行例行公事，最重要的是，如果你对生活漠不关心，这表明你的能量水平极低。


  你可以认为自由能量等同于生命力。年轻时意图的能量充沛溢出。想象一位面容憔悴的老太太。她蹒跚而行，呻吟不已，你能看出每一个动作对她都很吃力。再想象她突然奔跑起来，蹦蹦跳跳，跃入空中，发出胜利的呼喊“耶！”，并挥动手臂做出利落的动作。这似乎不可思议，然而如果她的能量水平充分提高，这正是她想做的事。


  为什么一个人最好的创作往往出现在人生的前三分之一或第二个三分之一阶段？一切都归结为意图的能量。然而，如果你将能量维持在适当水平，你可以在任何年龄创作杰作。


  当一个人停止追求时，生命力和创造能量就会萎缩。有些人用冷漠的眼光看世界。他们自以为无所不知，已体验一切，那种饱足感似乎让他们很受用。他们眼中的世界是常去公园里那条踩烂的小径，再没有什么能让他们惊讶。你能听到他们用冷漠懒散的语气说教，证明他们样样精通。这样的人衰老得早。永远保持睁大双眼审视世界的好奇心，你就会拥有更多能量——这就是它的本质。


  当一个人不再允许自己对世界感到惊奇，或不再为新思想而奋斗时，不仅发展停止了，而且退化过程开始了，他们也就老了。生命是一个过程。可以有前进和后退的运动，但中途不能有停顿。在自然界中，停顿和完全静止根本不存在。即使是悬崖也在改变面貌。为了激活意图的能量，你必须用目标去“挂钩”它。


  当你创造动态行动时，能量被点燃。这像是一个反馈回路：动态行动产生意图，意图点燃生命力。如果你保持冷漠，双臂交叉坐在那里什么都不做，试着去做点什么，任何事都行，能量就会来到你身边。有时只需要某种初始的推动力就能让你动起来。


  你可能认为自己能量低落，需要从某处获取一些。然而，事实并非如此。实际上你拥有如山般的能量，因为它来自宇宙，你能拿多少就拿多少。问题是你可能已经拿走了你能拿走的那么多。能量不会消失，所以它很可能已经在被使用了。它所有的巨大力量都花费在维持两种负担上。






  #### 束缚的类型与能量释放


  ##### 自我施加的义务束缚


  首先且最主要的负担，是你自己强加于身的限制与义务。你同意某种义务，就像脖子上挂了一块沉重的铅锤。接着你给自己设定各种条件，又背上了一块铅锤。然后你对自己或他人许下承诺，又多了一块。你的脖子上挂着多少铅锤？数量较少时，人还能撑着走。但总会有那么一天，负重超过了极限，无法再举起。随之而来的是危机。被逼入绝境，人会生病、陷入抑郁，或发生悲剧。他们变得紧绷，以恐惧和不信的眼光看世界。结果，作为思想投射的现实，开始真正呈现出越来越阴郁的色调。人生的一段艰难时光由此开启，可能持续很久。


  ##### 过度潜能的负荷


  第二类负担，是过度潜能的负荷。当你赋予各种事物过度的重要性，便用一座难以驾驭的包袱大山压垮了自己。这些包袱包括：


  - **自卑感**：我必须“酷”，必须维护并巩固我的重要性；

  - **愧疚感与责任感**：我必须履职尽责，完成我的使命；

  - **夸大问题的复杂性**：我有海量工作要做；

  - 以及其他不断拖累你的疑虑与担忧。


  许多人就这样生活，四面八方被各种义务、未了之事、苛刻条件、计划与无数目标压得喘不过气。目标能激活意图能量，但前提是它得实现，而非仅停留在规划阶段。规划工作、设定条件、许下承诺，易如反掌。但请注意：哪怕给自己钉上最微小的义务，也等于脖子上挂了个砝码，会抽走部分意图能量，你不得不带着这份重量前行。


  ##### 毒素积累与能量通道狭窄


  此外，能量水平低下的主要原因之一，是体内毒素的基础性堆积。道理很简单：能量通道如同老旧水管因水垢堆积而变窄，导致能量流趋于涓涓细流。


  这造成了游离能量赤字，引发一系列问题：身体状况差、创造力低下、疾病缠身及一切随之而来的麻烦。


  挤过狭窄能量通道的大部分能量，都被用来维持一整串无用的重量。剩下那可怜的一点能量，就是你的全部活力储备——它赋予你警觉、主动、愉悦、乐观、想要立刻拥有一切的渴望，以及移山填海的感觉。从一个人的状态大致能判断出他剩下多少活力储备。这方面“富有”的人寥寥无几。


  所以，你所有的游离能量，都被用在一大堆未实现的潜在意图（计划）上，它们只会拖累你。要释放资源，你必须要么舍弃一部分潜在意图，要么将它们变为现实。


  ##### 审视与放下


  问问自己：是什么在压迫你？稍加思考，你会发现许多重担可以毫不遗憾地放下。你可能觉得那些沉甸甸的饰品全都不可或缺，绝不能丢。但如果你只能一直背着它们却永远无法实现，又有什么意义呢？例如：


  - 我必须比所有人都强；

  - 我必须时刻保持最佳状态；

  - 我要向他人和自己证明我的价值；

  - 我别无选择，只能继续走我选定的路；

  - 只有赢才是选项，否则我再也无法自重；

  - 我不能犯错；

  - 诸如此类，还有戒烟、学外语、从下周一开始全新的生活，等等。


  事实是，凡是无限期推迟的事，都是无用的累赘。要么从清单中剔除，要么付诸实践，因为它们占用的能量，浪费得实在愚蠢。比如，一个人正在戈戒某种坏习惯时，会花费双倍能量：一方面还要偿还“钟摆”的利息，另一方面还要背负“必须戒掉”这个沉重的义务。


  这种纠缠可能拖上岁月。强迫自己做某事，应替换为坚定的信念。如果你要放弃什么，就要凭信念放弃，而非因为“你觉得出于某种原因你不得不这么做”。如果你用意志力把自己逼入绝境，只会把张力泵得更高，这必然导向危机。因此，更明智的做法是二选一：要么坚决实现你的意图，要么卸下义务重担，将习惯引入更可控的轨道。


  例如，与其捡烟蒂、偷偷抽烟，不如买个像样的烟斗、买上好烟丝。与其去酒吧狂欢或躲在角落偷喝，不如随身带个体面的酒壶。归根结底，这是在与你的“债主”建立伙伴关系。结果，有害的恶习会变得更有节制、更可控。银行更愿给体面的客户优惠条件；更不用说，被释放的习惯，比你痛恨却无能为力的习惯，危害小得多。此时宣示意图只会让事情更糟，当然这也非理想方案。在把有害习惯转化为文明习惯前，你需要好好审视自己，诚实面对自己在做什么。


  ##### 死记硬背的重负


  另一种累人的重量是学习，准确说是死记硬背。当你的意图是往脑子里塞信息，最终制造出的只是巨大的张力。此时意图未获实现，仅被张力鼓胀。虽是老生常谈，仍值得重申：死记硬背毫无意义。它只会变成更死板的行李，“装载”它消耗的能量极不成比例。知识不同于数据，只能在行动中、通过意图实现的具体案例被真正同化。例如，若你习惯辅导孩子功课，试试反向操作：让他们给你讲课，你立刻就会感受到区别。关键在于意图的焦点：意图必须被重导向，将被动意图转化为主动意图。一旦发生，那些需要死记硬背的无用重担会瞬间脱落。


  ##### 最后的释然


  你或许有一块巨大的重量，秘密地想丢很久了，却始终下不了决心。想象一下，丢下它时你会多么轻松、释然。放手吧。给自己更多自由。列出压迫你的事物，把重担从肩上卸下。你将立即释放出意图能量的储备，让你能继续前行。






  #### Energy Levels and the Realization of Intent


  As we said earlier, a goal activates the energy of intent in the process of its
  realization. Of course, it is best to find your own goal deep within yourself. If
  you have found it, the problem of insufficient energy will undoubtedly no longer
  bother you, because the heart and mind will perk up and rush with enthusiasm toward
  their cherished dream. However, if at the present stage you feel unable to take
  action or scale new heights, then trying to determine your goal is pointless. In
  this case, the pendulum will most likely take advantage of your weakness and impose
  its own goals on you. In order to find your own goal, you must first possess a certain
  degree of freedom, especially freedom from obligations to others and to yourself.
  And to succeed, you must be able to free yourself from the latter burden. You must
  allow yourself to temporarily have no personal goal. Finding a goal requires a certain
  amount of free energy, so achieving this should be your primary task.


  ##### Three Ways to Raise Energy Levels


  You can use three methods to raise your energy level: releasing resources, training
  energy channels, and widening meridians.


  ###### Releasing Resources


  When you release resources, you gain a tangible influx of strength. Previously,
  you gave energy to pendulums associated with alcohol or tobacco; now this energy
  is at your disposal. Previously, you spent energy on stress and anxiety. Now this
  energy can be transformed into the determination to act. Previously, you spent energy
  on doubts and hesitations, tormented by the question "Am I doing it right?" Now
  you decide what is "right" for you. Previously, energy was spent on worries and
  obligations related to guilt. Now this energy is free. Previously, you were tormented
  by the need to confirm your own importance. Now you allow yourself to live according
  to your own convictions and feel more at ease. Your former expenses have been converted
  into income, into the energy of intent, which will help you create your own reality.


  ###### Training Energy Channels


  In *Transurfing*, we spoke earlier about how the energy of intent can be improved
  through training. Just as physical exercise develops muscles, the realization of
  new goals raises your energy level. However, when the main peak is conquered and
  life becomes calm and smooth, the energy of intent atrophies. This decline in energy
  level can be compensated by doing energy exercises. As you may recall, the principle
  lies in focusing attention on the ascending and descending currents while doing
  any physical exercise. If you add visualization to this exercise—playing a mental
  slideshow where you see your intent energy reserves increasing with daily practice—the
  exercise will be even more effective. Once induced, the energy of intent will grow
  on its own.


  If you have intensively trained your energy level one day, you can expect consequences
  the next. Did you think you would have more energy? If only! On the contrary, you
  will feel broken. If you resume physical exercise after a long break, all your muscles
  will ache the next day. It is the same with training intent energy, only instead
  of pain, you feel fatigue and despondency the next day. There is nothing to worry
  about. It will pass quickly, and things will return to normal. The important thing
  is to take a systematic approach. Say to yourself every day: "My intent energy increases
  with each passing day." After several sessions, you will feel such a rise that you
  will literally want to jump up and fly.


  ###### Widening Meridians: Body Cleansing and Natural Diet


  Finally, the most direct way to raise your energy level is to cleanse the body and
  switch to eating natural foods that have not undergone heat treatment. Why? This
  is a separate, by no means superficial topic, which we will discuss later. For the
  sake of brevity, I will introduce the following analogy for now. Energy flows through
  the body like water through pipes. When the body is cleansed, it is as if the pipes
  are clean and the water pressure is strong. Cleansing the body and maintaining this
  state is very natural and direct. You can also use another method. You can clean
  the pipes with the help of a high-pressure water source. This method requires meditation
  practices. This method is long and complex, so I recommend the simplest and most
  direct method—physiological cleansing.


  ##### The State Brought by High Energy Levels: Inspiration


  High energy levels bring a person into a state known as inspiration. When you are
  inspired, you are able to generate ideas, come up with innovative solutions, and
  create masterpieces. The Muse is attracted to light like a moth. Skepticism and
  apathy are evidence of a low energy level. When you experience an energy deficit,
  you always view the world pessimistically, which instantly flows into material reality.
  When you have a high level of vitality, you transmit the image of a winner to the
  mirror of the world, and success comes to you without you having to chase it.


  ###### The Difference Between Inspiration and Ecstasy


  One more point to add about inspiration. You may have noticed that inspiration sometimes
  manifests strangely. There are peak moments when the seemingly impossible becomes
  possible, but for some reason enthusiasm quickly fades, replaced by pragmatism.
  The flame of optimism quickly dies out, the former gloom of the gray world reigns
  again, and the ideas that were about to take off seem hopeless once more. What is
  the use of inspiration if it only builds castles in the air?


  The answer is that what we just described is not so much inspiration as ecstasy.
  This state occurs when there is a sharp transition of energy levels from low to
  high. This transition happens when using strong stimulants, or simply when some
  unusual information sparks the imagination. An abnormal burst of energy opens consciousness
  to areas of the alternative space far removed from the sector of current material
  realization. Theoretically, these alternatives can also be realized, only they are
  located further away in the alternative flow, so their materialization requires
  greater energy expenditure. This is also why ideas that seem great in dreams disappear
  upon waking. While dreaming, the soul mostly flies into sectors that have almost
  nothing in common with material reality.


  Truly realizable ideas are born only in stable intent energy. Likewise, they are
  located relatively close to the alternative flow. In order for consciousness to
  transcend the limits of the material world and touch these ideas, one must either
  be gifted by nature or possess a sustained high energy level. Therefore, people
  can easily compensate for a lack of talent in this regard.


  ##### Deep Benefits of Intent Energy


  The benefits of intent energy are not limited to providing a person with a high
  level of vitality, enabling them to act effectively in the material world. What
  is more interesting is that the higher your energy level, the faster your desires
  manifest in material reality. When the energy of the universe passes through the
  human body, it is programmed by their thoughts and acquires an ordered form. This
  is exactly like a radio transmitter converting electrical energy into a signal carrying
  specific information. Once an information structure is received, a person''s energy
  is able to "illuminate" the corresponding sector in the alternative space. As a
  result, the metaphysical potential reality manifests on the material side of the
  dual mirror, and the thought is materialized into reality.





  #### 思想的实体化与现实控制


  ##### 实体化过程的有效性


  显然，发射功率越大，实体化过程就越有效。正如你从前几章所了解的，思想的实现并非瞬间发生，否则我们的生活将如同一款处于完全混乱世界中的电脑游戏。要形成反射，必须有一个由心智合一诞生的清晰形象，或者一段刻意集中注意力的相对较长时期。也许有一天有人会为替代空间发明一台“实体化器”，当然前提是上帝允许。毕竟，人工智能对我们而言仍遥不可及，现状也应如此，因为谁也不知道如果并非如此会以何种结局收场。这里最重要的一点是，我们有能力将梦想转化为现实。


  ##### 高能量水平与合一感


  拥有高能量水平并不一定意味着使用武力。为了有效创造你的世界层，你必须与它产生合一感，甚至认同它。你必须以全新的眼光审视周围的现实：我是现实的主宰，正如我是身体的主宰。你必须进入与现实相同的时间模式，而不期待瞬间的改变。你需要保持冷静、耐心并专注于目标。


  控制身体对你来说很容易，因为这是理所当然的事。然而，某些疾病会导致一些人丧失这种能力。身体可能做出不可控的运动，或陷入瘫痪状态，对意图充耳不闻。当我们尴尬时，也难以完全控制身体。例如，一个拘谨害羞的人，双手常做不受控制的运动。在这种状态下，心智并未合一。


  人与其世界层的关系要困难得多。人们感到自己与周围现实隔绝。他们仿佛觉得这层在自身之外，仿佛它也在做不受控制的运动，而个人对此束手无策。一旦一个人开始感受到与自己世界的合一感，他们就获得了控制它的能力，就像控制身体一样。


  这种能力已经完全萎缩，但可以恢复。为此，你必须时刻关注周围的环境，感受自己是这个世界的一部分，与它处于语境之中，并寻找连接你与它的纽带。换句话说，既要做世界的一个独立粒子，同时又溶解于其中。


  我不会隐瞒，这并非易事。这无法通过教学获得。一个人只能通过日常生活体验来获得与世界合一的感觉。这条路可能长如一生。所以，对于那些不觉得艰苦的精神修炼有吸引力的人，有一些简单、易行的指导。


  ##### 意图焦点与现实反馈


  你并不总能立即得到想要的东西。但无论发生什么，你都会得到你将意图聚焦于其上的东西。例如，如果你需要增加肌肉量，你的注意力应聚焦于描绘肌肉增长的幻灯片。如果你需要减重，所有想法都应关于身体如何变得苗条。如果你的目标是提高意图能量水平，你必须聚焦于你的能量通道和能量体。最后，如果你的意图不指向任何事物，你将一无所获。


  没有具体目的地做练习是浪费时间和精力。当注意力聚焦于努力而非目标时，只会消耗生理能量；因为努力是通往目标的途径，是达到目的的手段。你会发现自己始终在路上，因为镜子只是简单反映形象的内容。


  孩子们精力充沛，但这股能量不可控，通常无用地散发在大气中。同样，如果一个人将活力发展到很高水平，却未给予其具体方向，这股能量也将同样无用。一盏简单的灯只能照亮其周围的小区域，而聚焦狭窄的激光束能照射数公里外的一点。因此，如果你想让能量为你所用，必须将其聚焦于目标的特定方向。


  ##### 目的性、专注力与习惯养成


  目的性将意图能量导向严格确定的方向。专注力至关重要，专注意味着聚焦，而非紧张。思想搅拌机自动运转。想法不受控制地诞生和消逝。思绪从一个主题跳跃到另一个主题。头脑会像小孩一样不安分地“晃腿”。为了控制现实，你必须努力控制自己的思想。起初可能感觉有点别扭，但久而久之会成为习惯。


  为了养成这个习惯，遵循一条简单规则即可：训练自己思考当下正在做的事。不要无所事事地做任何事，在不可控思想的浑浊果汁中游泳。宣告意图宣言。这并不意味着你时刻都要绷紧神经。你可以随心所欲地让思维发散，但要使其成为有意为之，遵循原则：如果我的思维游荡，只是因为我允许它这样做。这样，你就可以在需要时刻意回到专注状态。


  本质上，关键在于让你思想中的形象主要包含你希望在双面镜中看到反射的画面。没有必要时刻保持心智合一的理想状态来达成目标。只需系统性地将注意力聚焦于目标幻灯片。通过控制你的思维列车，你将现实置于你的意志之下。


  你的思绪持续失控并不重要。重要的是养成将它们一次次拉回目标幻灯片流的习惯。当你养成反复将思绪拉回目标的习惯，幻灯片就成为恒久伴侣，其形象将始终在背景中，处于发生在你身上一切事物的语境里。毫无疑问，形象将会形成，世界之镜必然会将其反射在现实中。


  ##### 个体世界层与现实创造


  每个人都有自己的世界层。你可以说双面镜的反射面是多层的。每个生命体从出生那一刻起就拥有一块镜板。个体的思想和意图构建一个形象，该形象被反射为一个独立的现实。所有现实的总体按层排列，创造出我们所观察到的物理现实。


  就人而言，这层是他的栖息地，即包围他的一切。个体现实通过两种方式创造：物理和形而上。换言之，个体通过思想和行动创造其世界层。很难判断这两个方面哪个对现实影响更大。思想形式很可能起主导作用，因为它们创造了一个人花费大量时间对抗的物质问题的很大一部分。正如你现在将理解的，Transurfing（穿越术）专门处理现实的形而上方面。





  每个人都生活在一个特定的环境中，周围环绕着形形色色的人和物质对象。那么，如何在这个错综复杂的环境中划分出一个独立的存在领域呢？这非常简单。如果你暂时将环境的物质层面放在一边，剩下的就是一个我们最感兴趣的本质特质：事情进展得如何，顺遂还是不顺？一个人的环境可能丰富或匮乏，友善或充满敌意，舒适或不那么舒适，但这并不重要。真正有意义的是：此人在这样的条件下有多快乐，是否得到他们所追求的，环境似乎是否在幸運地展开。图层的这种特质，它的色调，对物质现实中发生的一切都有决定性的影响。


  图层可以拥有明亮或昏暗的色调。这全取决于一个人如何组织他们的思维模式。他们的消极思维越多，其特定的现实就会越阴暗。事情越不顺，积累的怨恨就越多，由于反馈链的作用，这会导致图层变得更加黑暗。由此我们得出结论：你的个人现实必须保持纯净，就像身体一样。


  所有的消极念头都必须被果断、敏锐地驱逐出去，以免它们有机会毁了你的世界。把它们赶走！这就像必须倒垃圾或做清洁一样。你必须摆脱陈旧的垃圾，否则，无论你怎么努力，事情总会进展得很糟。


  然而，有一种垃圾并不容易从你的世界中清除。这种垃圾是内疚感、自卑感、怀疑、压力、恐惧、不满、敌意和消极预期。这些就像我们的病痛，我们只盼着能摆脱它们，却不知道如何做到。所以你必须治疗它们。良方是存在的。


  想象这样一个场景：一个人和他们的世界乘坐一辆魔法巴士，前往一个梦想化为现实的地方。“那么，我亲爱的，我们到了，要去给你买个玩具了。”“这世界太棒了！”


  这快乐的旅程似乎前景光明。一切进展得极其顺利。你还能要求什么？然而，焦虑的头脑不习惯这种状态。头脑总是向一旁张望，希望能发现问题。不可能一切都好的！“嘿！停车！看那边，那些审判我的正义之士，我们该捎他们一程，好让我赎罪。”“不，我甜心的。那是胡说八道！”“求你了，我们必须捎他们，否则我没法安心。”巴士停下了，一群长相可疑的家伙爬上车，开始抱怨并提出要求。“我们是你的法官！”他们说。


  对此无能为力，巴士只能继续前行。总体而言，情况不算太糟，但这个人坐立不安。“看！”他对世界说，“看那些可爱的人。让我们带上他们吧。他们会为我们树立好榜样。”“我问你，我们要那些多余的乘客干什么？”


  世界勉强抗议了几句，但被迫同意了，巴士挤满了傲慢自大的人，他们的举止清楚地表明：其他人都比他们低贱。“我们是你的理想！”一路上，恐惧、压力、怀疑和消极预期都搭了顺风车，当然，这个人试图理智地合理化局面：“也许这些是睿智的旅行者，会给我们指明方向，救我们免于迷路？”“随你便，我亲爱的！”世界同意了，并欢迎这吵吵嚷嚷的大众上车。“我们是你的常识！”他们自称，并继续用他们的常识抱怨，把旅程变成了地狱。


  除此之外，道路还被不快、指责和厌恶拦住了。这个人真的不想遇见他们，但世界习惯于带走头脑关注的一切东西。“我们是你的噩梦！”这些讨厌的家伙冲进门尖叫道。


  此时，这个人只盼着能摆脱这些讨厌的同伴，但为时已晚。巴士超载，无法继续前行。操纵者、纸板偶像、歇斯底里者、顾问和其他害虫毁了一切。但怪谁呢？他们为什么非要跟上来呢？


  所有这些垃圾中，破坏性最强的是内疚感，无论个体是否意识到这种感觉。如果你注意到世界在惩罚你，表现得仿佛在嘲弄你或试图破坏你，那你就具备了这种疾病的所有症状。把这感染赶出去。狠狠踢它一脚。内疚感是个不受欢迎且傲慢的客人，它陷在你的扶手椅里，把脚搁在桌上，开始口出狂言。如果你意识到你有能力这样做，完全可以把它扔出去。即使你真有过错，你也只有请求一次原谅的权利。


  内疚感会以最多种形式产生惩罚，从微不足道的不便到巨大的麻烦。你可能只是割破手指，也可能遭遇某种事故。外在意图无疑会在剧本中安插某种惩罚。这就是模板世界观的运作方式：恶行招致报应，内心和头脑对此异口同声。


  此外，内疚感还会给极化带来严重压力。结果，平衡力量给忏悔者的头上带来各种厄运。其中最糟糕的是操纵者，它会像一只纠缠不休的苍蝇一样粘着你。操纵者已将诱导其“客户”产生内疚感炼化为一门精细艺术。如果一个人倾向于吸收内疚并毫不抗拒地背负它，操纵者会竭尽所能向他们倾倒更多的内疚。


  内疚情结早在童年时期就植入我们心中。成年人常用禁忌手段强迫监护人服从。如果一个孩子长期处于典型操纵者的照料下，一种微芯片般的东西就会以无意识的责任感和赎罪义务的形式，牢固地植入他们脆弱的心理深处。


  被成功“编程”后，孩子被迫背负沉重的十字架，只要这颗微芯片留在潜意识里，他们就是操纵者手中的傀儡。那么，如何移除它？你无法压抑内疚，也不能就这样摆脱它，因为它植入太深。内心和头脑这样活了很久，永远亏欠着某人。只有具体的行动方案才能将人从这种状态中拯救出来。


  具体来说，他们必须停止为自己辩解。这是一个治病消因的案例。你不必试图说服自己不欠任何人的。只需对你的行为保持觉知。这需要觉察力。如果以前你习动因微小缘由就道歉，现在试着养成不同的习惯：只有在绝对必要时才解释你的行为。


  真的没必要告诉自己你不欠任何人的。内疚感在你内心存在没关系，但不要将其外露。一旦操纵者意识到无法再从你那里得到同样的反应，他们就会离你而去。与此同时，内心和头脑会逐渐习惯这种新感觉：你不再辩解，意味着你定是对的，因此，你的内疚干脆就不复存在了。结果，你“赎罪”的理由会越来越少。所以，得益于反馈链，外在形式整理了内在内容。内疚感消失了，与之相关的各种问题也随之消失。






  #### Internal Importance and Inferiority Complex


  Inferiority complex is another mental ailment that almost everyone suffers from
  to some degree. This burden makes one feel unworthy and inadequate, projecting onto
  material reality. In the earlier Transurfing materials, we explored inner importance
  in detail, along with the various problems arising when a person actively pursues
  enhancing their significance due to a perceived defect. A paradox exists here: a
  law applies that is extremely similar to the uncertainty principle in quantum physics
  — **importance decreases to the extent it is emphasized**. Conversely: a person
  who does not care about their own significance automatically possesses it.


  Attempting to reinforce one''s stance or emphasize merits is an illusion, a chase
  after a reflection in the mirror world. But how to prove to yourself: you are special,
  no proof needed? There is also a feedback loop where the cause eliminates the effect.
  You must consciously redirect intention: no longer trying to prove yourself or show
  off, but **abandoning all attempts to increase your own importance**. When a person
  manages to stop (we all know almost everyone does this in their own way), people
  around intuitively sense your significance needs no confirmation. Consequently,
  people are more drawn to you and begin to treat you with more respect. As a result,
  the conviction "I do have value" gradually permeates the soul and mind. The moment
  arrives when the mirror world stagnates, reverses, and begins to move towards you.
  Self-esteem rises, as if the inferiority complex never existed.


  #### Doubt, Stress, and Fear


  Doubt, stress, and fear also severely distort the picture of one''s personal world.
  Do not forget that once these thoughts reflect in the mirror, things truly worth
  fearing enter their world layer. But the greatest damage from anxiety falls on the
  intended goal, because as you recall from the previous chapter, anxiety turns **desire**
  into **craving**.


  The brighter the fire of desire burns (like the fear of failure), the stronger the
  outer importance, and the lower the chances of success. Abandon any waiting that
  feels like craving, otherwise you will achieve nothing. **Intention** is the key
  to achieving the goal; intention contains no doubt, it arises from the simple transition
  of "wanting" into "doing".


  To relieve the itch of impatience, you need a safety net, a fallback plan for failure,
  and the thought of accepting failure right from the start. One might ask: if you
  are tormented by a desperate desire to possess what is rightfully yours, how can
  you accept failure in advance? But you will see that when things don''t work out,
  despair or anger makes you wave goodbye to the originally expected result.


  Despair can also help you eliminate inner importance, i.e., painful self-importance.
  If something goes against you and strikes a heavy blow to your ambition, the feeling
  of despair makes you let go completely, discarding self-importance like dead weight.
  You immediately feel better, free, light. Things immediately improve.


  Doubt about whether a project can be successfully completed usually stems from the
  mind trying to calculate the paths and means to the goal. In *Transurfing Reality*,
  we discussed in detail why considering these is meaningless. You cannot know exactly
  how things will develop for the best. Your task is to focus attention on the goal
  **as if it has already been achieved**, at which point outer intention will open
  the right doors at the right time.


  #### Practical Application of the Dual Mirror Principle


  Since you know the rules for using the dual mirror, there is no need to worry. The
  mirror principle is the most effective remedy for doubt and fear. First, direct
  intention towards maintaining the FRAME **"my world takes care of me"**. Second,
  the last three mirror principles must be followed with utmost precision.


  For example, you plan to enter university and want to pass the selection successfully.
  Say to yourself before the exam: if I fail, maybe that''s for the best? Then you
  can take the exam cheerfully and relaxed. This is called **accepting the possibility
  of failure and flowing with the alternative**. You do what needs to be done, while
  remaining indifferent to the outcome, or more precisely, being prepared to regard
  any outcome as success.


  "Pretending" not to want to achieve the goal is pointless. Self-deception doesn''t
  work. You don''t need to think about *how* the goal will be achieved, nor get caught
  up in the script. Your task is to do the work of **visualizing the slides** and
  take steps toward the goal. The mind''s control should focus on following the mirror
  principles, not the script.


  Since success is waiting for you anyway, what''s the use of worrying? You decide
  how to define your relationship with the result — positive or negative. We are all
  used to treating setbacks negatively, so we are all forced to play by the default
  rules where success is hard. Conversely, when you take a misstep, call the failure
  a success. Thus you stand out, and victory is in hand.


  The feedback loop operates here just as with guilt and self-importance. Shift attention
  from the mirror to the image, stop chasing the reflection, and the mirror world
  stops. Then you don''t need to believe in success or convince yourself of anything.
  Just refocus intention on **observing adherence to the mirror principles**. Once
  their effect kicks in, you will notice reality changing significantly. The mind
  becomes convinced the mirror really works. Then you finally understand: the path
  to success is completely different from what you previously imagined. As a result,
  the mind calms; fear and doubt disappear; the mirror world moves towards you.


  #### Cleaning the Rest of the World''s Garbage


  The rest of the garbage that must be cleaned from your world includes: **accusations,
  resentment, disgust, and negative expectations**. Regarding the former, you must
  be clear: criticism in any form (even if justified) is extremely detrimental. Criticism
  is an extremely thankless task. To restore the balance of good and evil, balancing
  forces will strive to put the **accuser** in the dock. Reasons and pretexts are
  never in short supply. It is advised to regard any form of criticism as **taboo**.


  As for all other negative reactions, there is only one thing to say: by acting out
  the play "my world doesn''t suit me, I don''t like my life," you are shaping and
  maintaining **that** reality. Repeatedly remind yourself: you stand before the mirror,
  the **FRAME and the last three mirror principles** can turn your world layer into
  a comfortable little corner. There is no other way.


  #### Opening Move in a Dead End


  Finally, if you currently feel terrible, so terrible you have no strength to follow
  any principle, where to start? How to clear your head and get reality back on track?





  #### 现实的层面与镜子原则


  有时生活确实会变得难以忍受。这就像酒鬼醒酒后，发现自己的生活凄凉而残酷。我们以一个典型的例子为例：前一晚参加完一场盛大的聚会，第二天阴郁的清晨来临，你不得不拖着疲惫的身躯去上班。聚会后会出现各种问题。人们发现很难重新回到工作节奏中，这是显而易见的，但奇怪的是，技术设备也会发生类似的情况。统计显示，周一汽车、电脑和其他电器的故障率比一周中的任何其他一天都要高。那么，现实究竟发生了什么？


  现实的这层面是由人们在其层面重叠之时创造出来的。在宿醉期间，人们必须向摆锤偿还“贷款利息”。当自由能量亏缺时，思维形式包含大量负面成分。这在工作场所产生了一种集体紧张感，万事不顺。镜子随之做出反应，现实发生扭曲。如果家用电器出现故障，这种感觉不太明显，但在公司里，综合扭曲效应会导致更显著的后果：事故发生，机器损坏，复杂且精密的技术设备运行不稳。


  关键在于，如果一个人陷入抑郁或处于改变的觉知状态，其世界层面就会被卷入变体空间的浑浊区域。现实似乎笼罩在一层迷雾中。周围环境的一切依然原地不动；条件与先前相同；天气甚至可能很好，但空气中却弥漫着某种压抑感。如果你以前未曾留意过这类日子现实的色调，以后不妨观察一下。你会感觉仿佛物质世界正用冷漠的敌意盯着你。其层面的质量发生了变化：“今天万事不顺”。这种质量便是阴霾，它对包括技术设备在内的一切都有着切实的影响。


  生活低谷期的来临，要么源于自由能量亏缺引发的身体不适，要么源于期望落空时产生的负面情绪。为避免阴霾区域进入你的现实，提升能量水平至关重要。当你的活力达到必要水平，你便不再感到烦躁。你还必须做前文提到的一切，保持你世界层面的清洁。


  但就目前而言，如果你陷入抑郁，必须先整顿你的现实，引领你世界的层面走出阴霾，进入变体空间的清澈区域。该如何做到？


  对此只有一个秘诀，且如同所有天才之举一般，极其简单。孩子哭闹时你会怎么做？如何安抚它？言语不起作用。你得抱着它走走，给予关怀和关注。当你心情低落时，是你内心的孩子在哭泣。照顾好它。尽管你们许多人看起来严肃、体面、威严或酷炫等，但我们本质上仍是孩子。“推自己上旋转木马”，意为做一点你最喜欢做的事。抽出专门的时间放松，不去想那些令你痛苦的问题。“我的世界，我们去散步吧”。这时间花得值，因为清洁你的层面至关重要。许多事都取决于此。买你最爱的甜点：“吃吧，吃吧，我的爱，好起来吧”。将整天献给自己和自己的快乐。照顾好自己，轻轻将自己哄睡：“睡吧，我亲爱的。你的世界会照顾一切”。


  就是这样。第二天，如果你勤勉并遵循镜子原则，你会感觉到周围的现实开始呈现出更温暖、更柔和的色调。你的层面正走出迷雾。


  如果你善于观察，会惊叹于这一切是多么真实。原本看似静止的物质世界，将开始在你眼前实实在在地发生转变。压抑的氛围将消散，停摆的时钟将重新滴答作响，人们会更亲近你。巨大的双面镜运作之方式，简直令人惊叹。现实在变体空间中不易察觉地移动，宛如腕表上的分针，但这并不意味着它静止不动！


  这就是你如何“装饰”你的现实。但这还不是全部。你想来一场彻底的“翻新”吗？回想一下童年时代的情景。所有色彩都明亮鲜活，生活美好且充满希望。你很快乐，快乐因为你世界的层面如同你的身体一样清新洁净。世界照顾着你。诚然，你或许未曾对此万分珍视，但也没有什么特别的怨言。随着时间的推移，你思想意象中的怨言与负面情绪日益增多。结果，你层面的色调黯淡下来，生活进入了一个人们开始感叹“昔日美好……”的时期。


  这一效应在早期的《趋势冲浪》资料中被称为代际更替。时光飞逝。过去仿佛只是昨天，却又似乎已是很久以前。年龄顽强而不可避免地收取着代价。希望消退，世界开始衰败。难道派对真的就要结束了吗？


  不。仍有时间将一切找回：往昔的色彩、全新的感受、希望的欣喜。如果你遵循镜子原则，你将遇见一个惊人的现象。你世界层面往昔的清新将被恢复。当你成功为自己修正代际更替时，你将切实感受到何为真正掌控自己的现实。


  #### 修正镜子


  贯穿历史，人类创造了各种受控现实模型，从岩画到复杂的仪器机械。所有这些模型共有的一个特征是：它们都服从于人的内在意图。作为纯粹理性的产物，内在意图依据“我拐向何处，便去向何处”的原则线性地发挥作用。


  人只能有意控制那些已成为游戏属性的现实部分。例如，你可以将一段河流作为发电手段加以控制，但作为一个整体，河流将仍是不可控现实的独立组成部分。


  你可以施加力量，用内在意图让驴移动，但无法强迫驴做任何它不愿做的事。独立现实只服从于外在意图，后者源于心智的合一。


  人有两种控制现实的手段。第一是将周围世界的对象变为属性。这些对象随后服从于内在意图。第二种手段是运用外在意图，与自然和谐共处。这两种手段代表了人类文明发展的两条根本对立的路径。


  当代社会正沿着第一种、也是效果最差的模式发展。这是一条将对星球和人类证明为灾难性的道路。人永远无法完全驯服自然，于是我们发现自己在与自然环境持续交战。一天我们污染环境，第二天我们又试图保护它。简而言之，一切皆依照同一原则进行：将一切转化为属性，以使其服从内在意图的意志。


  未被驯服的现实独立存在，并如镜子般运作，因它反映着人类与物质现实的关系。但这并非寻常之镜。






  #### 《现实变现》片段：极化与镜子世界的矫正


  ##### 极化的机制


  假设一个人想让镜子里的倒影向右转。在内在意图的限制内，这个人试图直接转动倒影本身。结果产生了过剩势能，平衡力使倒影向相反的方向转动。世界没有响应，因为镜子已经变形了。


  世界之镜被极化现象扭曲。正如你所回忆的，极化发生有两个原因。


  第一个原因是基于比较、并置或规定条件的依赖关系。例如："我好所以你必须坏"，或者"如果你承认我的优越性，你就会变好"。


  第二个原因可以定义为"拧紧螺丝"。当一个人试图用内在意图向倒影施加压力时，什么也不会发生。这让人认为需要施加更大的压力，于是他们蛮力继续推进想要的东西。平衡力通过对立面的碰撞消除极化。因此，结果恰好与人的内在意图相反。


  ##### 矫正镜子


  如果消除极化，镜子就能矫正过来。这非常简单，就像校直自行车轮子。车轮在辐条过紧的地方弯曲。如果世界不服从，似乎故意与你作对，必须确定导致极化的原因，然后放松相应的势能。


  ##### 靛蓝儿童的启示


  靛蓝儿童将帮助我们理解这些过程，因为他们对过剩势能极其敏感。靛蓝儿童典型地独立且直觉敏锐，有强烈的个体意识和高度的觉察力。这些品质是作为对他人试图强迫他们顺从、适应僵化社会结构的反应而发展出来的。


  包括家庭单位在内的大结构中的每个细胞，都力求控制儿童的行为，使其尽可能有序。在一定程度上这是必要的。但不能过度到让儿童成为游戏的附属品，而游戏的主要规则是："你将做我叫你做的事"。


  显然，这种原始方法只能制造极化，让儿童像被平衡力之风卷起的落叶一样不可控。愚蠢且不满的成年人通常会竭尽所能拧紧纪律的螺丝。作为回应，孩子要么变得更加狂野，要么精神破碎，允许自己被转化为属性——结构的元素，对他们而言"生活中一切都正确但不对劲"。


  自然没有父母希望孩子成为社会弃儿。然而普通螺丝的命运也不值得羡慕。许多成年人会承认他们的一生"做了一切正确的事但没有好结果"或"做了许多错事却没有什么是对的"。每个父母都希望自己的孩子不一样，于是他们在努力中越发强烈地制造极化，顽固地无视自己实际上在创造什么。


  任何无知导师的内在意图都可归结为一个愚蠢的公式："我全心全意（用我所有错位的力量）为你着想，所以你将做我叫你做的事"。


  ##### 解决之道


  与抚养孩子相关的任何问题，都可以通过放弃短视的内在意图、沉思什么导致镜子变形来解决。


  首先，必须确定极化的对立极在哪里显现。如果车轮一侧的辐条太紧，则应在另一侧稍微放松。靛蓝儿童追求独立、拒绝接受纪律的努力可被视为"松动的辐条"。是什么让另一侧的辐条过紧？张力来自于要求靛蓝儿童服从周围成年人意志的压力。


  原来秩序感能产生巨大的混乱。如果你持续拧紧螺丝会怎样？别处的辐条会变得更松，最终某样东西会断裂。


  显然，为了减弱极化效应，过紧的辐条必须放松。怎么做？秩序感需要混合适量的合理无序。方法有很多。你可以跳上床、用枕头互相拍打、嚎叫或发出奇怪的声音、推推搡搡、四肢着地爬行，或想出其他淘气的办法。


  你也可以在家里埋伏某人然后跳上去。在餐桌上，如果没有蛋糕，抹果酱互相涂抹也有帮助。或者夏天在水边玩耍时发现泥坑，那就是宝藏，你知道该怎么做。


  一般来说，这种"明智"的愚蠢越多，孩子就越顺从。悖论背后的原因现在对你应该很清楚了。


  ##### 幽默与秩序的打破


  秩序感同样可以用英式幽默成功打破，其中严肃被推向荒谬。快乐像无聊一样，是灵魂状态的反映。我们已经提到，无聊本身不存在，只是控制现实的永恒需求。这种需求代表了灵魂的内在品质。


  灵魂为什么需要快乐？也许因为当你快乐时感觉良好。为什么感觉良好？因为幽默和快乐降低了重要性。当过剩势能存在、阻断意图能量并扭曲世界之镜时，无法塑造现实。


  如果你让某人弯腰驼背并捆绑他们，他们的身体难道不会感到不适？当灵魂被挤在过剩势能的虎钳里时，它感受到完全相同的不适，而这在一定程度上总是存在的。躁动的心智总在拧着灵魂的胳膊。


  当快乐减轻张力时，灵魂被释放。这就是为什么快乐是好的。我们体验到一种内在舒适感，它就像任何物理感觉一样真实。


  原则上，镜子可以在不使用幽默的情况下矫正。如果你天性不倾向于快乐和恶作剧，只需沉思在哪里可以稍微放松车轮。


  ##### 选择自由与信任


  任何不可避免的强制都应稀释选择自由。例如："你想洗碗还是去商店跑一趟？"即使是纪律，如果基于自觉的必要性，也可以转化为意志的自由展现。


  当成年人以"你不可以且不许顶嘴"为规则进行独断，并用"因为……"作为论据支持时，他们根本不是成年人，而是被赋予权力的傻瓜。平等地讨论事情、按照"如果……会怎样？"的原则建模情境，难道不更好吗？


  强制扭曲镜子，从而产生相反的结果。为了减弱极化效应，你必须重新考虑你的立场，从展示权力转向赢得尊重的尝试，用信任关系取代威权主义。


  ##### 尊重与重要性


  最好让孩子渴望做被要求的事，而不是使用强制。必要的方法是想办法将对孩子而言繁重的义务转化为增加其重要性的事物。肯定和巩固个人意义是所有人的基本激励因素，尤其是儿童。与儿童互动的最适当方法在《现实变现》早先阐述的"弗莱宁原则"中有描述。






  直觉是另一种应该作为首要任务发展的品质。在靛蓝儿童中，大脑的右半球占主导地位。然而，教育系统却利用左半球的方法，其目标远离发展技能和能力。该系统迫使孩子们学习课程内容，然后定期反馈。


  在这种方法中，虽然大脑的状态是被动的，但主要是大脑的左半球在工作。填充思想信息的欲望会产生一个明确的回应：“我不想！”通过这种方式获得的知识是无用的。它仅仅以被动形式存储在记忆中，就像仓库里存放的货物一样，很快就会失去价值并被遗忘。


  教育系统的现状很容易被纠正。只需将学生的注意力引导到不同的方向即可。


  首先，教学方法的根本必须从死记硬背转向实践学习。那么大脑将按照其作为创造者而非存储仓库的本质运作。


  其次，教学的目标必须从汇报转向教导他人。没错，正是如此。已有特殊学校建立，在这些学校中，孩子们字面意义地互相教授，也就是说，他们轮流扮演老师和学生的角色。参加此类学校的孩子能够在创纪录的时间内完美地掌握复杂的课程，这一切都归因于意图被设定为主动。正如您所知道的，这样的学校寥寥无几，且难以进入。您可能会认为这种创新方法可以在全球范围内推广，因为它已被证明有效达百分之百。但事实并非如此！


  原因在于这与体制的利益相悖。体制不需要天才、伟大的个体或古怪的性格。它需要的是可靠运作的部件。这就是为什么一切都很好，教育系统本身就是完美的！该系统生产可用的部件，并按照体制——钟摆世界的要求进行。


  然而，正如我们所知，树木也能在岩石上生长，而天才有时会从常规秩序的恶习中成长。如果你不希望你的孩子成为一个突出的例外，就按照体制的所有规范施加压力。但如果你真诚地希望你的孩子得到最好，那么在你不断与他们互动时，请始终观察极化程度的变化，这种变化会扭曲镜子并使孩子变得难以控制。


  靛蓝儿童（现在是年轻一代的多数）展现出许多美好的品质，其中最重要的是个性。在钟摆的世界中，孩子们很难保持这种品质。因此，时刻铭记冲浪的主要法则至关重要：“做自己，并允许他人也做自己”。


  车辐也不应松得过多；一切都要适度。那么，黄金比例在哪里可以找到？这是一个通过观察、弄清事务并应用校正镜子的原则，而不是盲目遵循你通常的方法来实现的问题。你有能力帮助孩子成为杰出的个体。他们将能够自己思考如何融入体制。


  ###### 现实创造者


  到目前为止，我们已经讨论了如何将你的生活转化为有意识的梦境，以及如何将你世界的某一层转化为温馨的角落。镜子的原则对现实有着切实却微妙的影响。现在，你将了解到更强大的方法。


  目标幻灯片是冲浪的核心工具，通过可视化一个目标已经实现的画面来发挥作用。我不会在这里重复之前在书中已经详细描述过的所有想法。我只会提醒你几个关键要素。


  幻灯片不应被视为一个外部移动的画面。你必须置身于你想象中的事件之中：你在做什么，目标何时实现，你感到什么，你的直接环境以及其他正在发生的一切。当你将自己置于幻灯片的中心时，你可以想象自己拥有你所追求的一切。这不是一种技巧。没有必须遵循的严格规则。以你自己的方式练习幻灯片的方法。只需牢记一个原则：你正站在世界的镜子前，你正在你的思想中塑造一个你希望流入物理现实的形象。


  目标幻灯片决定了替代流动的方向。如果你在思想中有条不紊地转动幻灯片，你所遇到的事件和环境的流动将朝着目标方向发展。你不需要有一个精确的计划，也不需要知道它可能如何实现。无需思考手段。正确的门将在适当时机打开——具体的路径和机会，而你将把握它们。你不应对目标应该如何达到设定严格的条件。你的任务是专注于最终结果。


  除了目标幻灯片，早期章节中还描述了过程的可视化。一旦你踏上通往目标的道路，已经弄清楚它将如何实现，并且正在物质世界中做所有必要的事情，那么过程可以通过可视化来加速。其原则是：一切进展非常顺利，今天我做得比昨天更好，明天将比今天更好。你可以说这就像用桨顺畅地与替代流动配合。只要你在脑海中保持目标幻灯片，你就可以确信环境正在朝着实现目标的方向发展，即使这并不明显。


  你可以在脑海中尽情播放幻灯片，只要你真心想实现目标，每天至少播放半小时。有几种方法可以巩固可视化的效果。


  第一种是能量流。替代空间的某个部分通过能量实现，这种能量穿过人体时被思想编程并转化为意图的能量。能量传输越强大，效果越显著。可以通过将注意力集中在能量流上来增强力量。这包括想象从身体中心（
  somewhere 在胃部或太阳神经丛区域）发出两个相反的箭头，长度约为一米。同时在脑海中转动这两个箭头，使前箭头指向上方，后箭头指向下方。以这种方式“转动钥匙”会激活下降和上升的能量流。想象它们沿着脊柱以相反方向流动，一股通向天空，另一股通向大地，而无需付出太多努力。将注意力部分放在能量流上会启动幻灯片，并让你尽情播放。当你在一个安静的地方行走且周围人很少时，进行此练习效果最佳。





  #### 可视化与目标达成技巧


  ##### 框架


  想一想当你的目标实现时，你希望正在做什么，以及什么能代表目标幻灯片不可或缺的一部分——其必不可少的属性。你可能正坐在壁炉旁的摇椅上，站在私人游艇的舵位上，在花园里种植玫瑰，或是与商业伙伴握手，敲定了一笔成功的交易。想象幻灯片中任何具有特征的片段。在脑海中多次转动这幅画面。它应该创造出一种整体印象，一个包含闪现图像和伴随感觉的目标幻灯片瞬间模具。这就是框架。


  为了方便起见，你可以给它起一个简短的标题。不时地在记忆中瞬间“打开”它，就像打开一盏灯。每当你自然地想起这样做时，就去做，同样，不要用力过猛。框架代表了另一条将你与替代空间目标区段相连的线索。借助所谓的**爆炸波**，可以修饰框架的有效性。


  在脑海中构建一个你希望变为现实的框架或单纯的画面。紧接着想象一个球体从你的身体向四面八方膨胀，仿佛你的能量场突然爆炸了一样。爆炸波可以延伸至你所能想象的任意远处。你可以重复这个练习几次，直到你对它感到厌倦。那么，这里发生了什么？你创造了一个心理意象并将其发送到宇宙中。你可以确信，你的思想不会无痕迹地消失。你只需记住，镜子是有延迟作用的。


  ##### 外部球体


  你可能从未体验过你的能量膜，或感受过它在受你的想象支配时的膨胀。这是因为你的行动是由*内在意图*驱动的。现在想象一个不属于你的球体包围着你。想象这个球体在吸引你。你能感觉到有某种东西在你体外试图伸展你的身体。在半径五到七米的范围内某处存在着一条看不见的前沿。如果你试图稍微拉伸它或压缩它，它会表现出弹性的阻力。


  现在你会更清晰地感受到这个球体。这是连接你与外部世界的边界线。球体内的是你的，球体外的、外部的，不是你的。同时，你可以说这个球体在你能感觉到它拉扯你的程度上属于你。*意图已被重定向。*
  主动的本质现在位于你的外部，而非内部。


  打个比方，如果你试图用内在意图的力量控制一个物体——比如用意志力移动一支铅笔——这是行不通的。相反，试着想象那支铅笔用无形的线吸引着你。正是通过这种连接纽带，你才能移动铅笔。同样，如果你试图升入空中，你不会腾空飞起。相反，想象相反的事情发生，仿佛世界本身正将你托举向空中。如果你设法将内在意图转化为外在意图，你可能会有一些成功。关键在于尝试超越“你的意志试图让世界服从它”这一点，达到“允许世界自行其是”的境界。


  这一切都相当复杂，但就我们的目的而言，它不必如此。只要感受到外部膜的存在就足够了。一旦你感知到它，就不要失去那种感觉。将部分注意力集中在它上面，然后开始在脑海中播放目标幻灯片。球体将充当一种思想能量传输的天线，这将大幅增强幻灯片的效力。


  ##### 景象还原


  尝试将进入你脑海的所有思绪还原为你目标的共同分母。通常，即使是随意的思绪也会按逻辑顺序排列，每一个都与前一个相连。用你目标幻灯片的一个片段来完成这条逻辑链。不时提醒自己你在追求什么。无论你发现自己在想什么，无论你在做什么，都将注意力带回目标上。使你的幻灯片成为一幅背景图像。每一个事件、每一块信息都应在这幅图像设定的总体背景下被感知。那样你将更有效地塑造你的世界层，你的意图将显化于现实。


  你周围的环境也可以与你对目标的预期保持一致。你可能正在公园散步，脑海中反复推敲着目标幻灯片——其中你正在自家房前的花园里劳作。透过你幻灯片的棱镜去看那些树木和草地。你会感觉到场景在转变，获得了新的色调。你可能会有一种感觉，在虚拟意义上，你已经身处那个花园中。这种效应是幻灯片投射在场景上产生的结果。你的注意力部分聚焦于替代空间中你未来花园所在的区段，而你的眼睛感知着当下时刻的物质现实。发生的是一种按代表你目标的区段方式对当前现实的转化。在这些时刻，涉及你心理意象物质化的过程获得了更强的强度。


  你可能还记得童年时那种轻松舒适、世界照顾你的感觉。那时你没有意识到这一点。事情就是好好的，仅此而已。然而随着时间的推移，你变得越来越苛求，更倾向于表达不满，这导致世界对你失去了兴趣。你将童年经历的这种平静和舒适感与什么联系在一起？你可以将这种联想作为你的**景象还原**关键，围绕它你会感到安全和安心。不时回忆那无忧无虑、快乐的环境，你的世界将再次逐渐变得友好和舒适。


  ##### 目标混合体


  最后一种技巧，专门为**懒人**准备，是目标混合体。可视化成功的最重要条件是你不强迫自己去练习它。如果你发现自己在施压于自己，强迫自己在脑海中转动目标幻灯片，因为你从中得不到任何享受，你将产生*过剩势能*。平衡力会将你的努力化为乌有。在这种情况下，最好放弃这个负担沉重的任务，把它交给你世界的肩膀。请求你的世界“背负你”。让你的世界负责实现你的选择。


  对自己说：虽然“如何做”对我而言未知，但一切都会自行解决。通过宣示这个意图，你将你的世界编程为让事件自发地以一种方式展开，从而让你更接近目标。结果是你放松了控制，允许外在意图实现目标。现在你可以放松下来，允许自己单纯地享受目标幻灯片。你不再有义务为它工作。世界正在为你做这件事。在世界的怀抱中放松时，不要不时地提醒世界你期望从它那里得到什么。当然，也不要好高骛远。在物理层面上完成目标达成所需的一切行动。





  #### 现实塑造技术指南


  ##### 核心原则：意图的力量


  无论你使用何种技术，请始终记住：你表达的不是愿望，而是坚定的意图，将目标视为必然的结局。如果你无法说出“我已拥有”，至少要说“我计划拥有”。为了真正意图接收你的订单，你必须采取一些具体行动来确认意图的严肃性。例如，如果你想在早晨特定时间起床，可能会有睡过头的风险。但如果你设置了闹钟，你很可能会在闹钟响起前几分钟醒来。


  关键在于聚焦你的意图。这正是你每次“敲木头”或“向左肩撒盐”所做的事情。任何预设某种仪式的民间习俗都基于此原则。例如，在古代，为了留住胆小的幸福之鸟，人们使用三叶草来帮助自己。在好运时刻，人们会握住装饰有三叶草图案的物品，在危险时刻亦然。三叶草也被视为抵御邪恶力量的护身符。


  重点不在于某个物体被赋予了特殊品质从而成为护身符。任何物体的魔力在于你与它的关系。当一个人充分相信护身符或仪式能产生某种魔法效果时，他们就在聚焦自己的意图。你可以创造类似的“钩子”，舒适地挂上你的意图。不过这种方法正如俗话所说，“是后天养成的口味”。你不必非要编造魔法仪式，但你确实需要采取具体步骤，证明你是认真的。例如，如果你想拥有自己的房子，表现得好像随时都要搬进去一样：浏览广告和目录，在商店挑选家具和家用设备。现在就调查一切与搬家相关的事宜。聚焦你的意图是一件非常有力的事。


  ##### 技术选择与实践


  可用于强化生命轨迹的技术种类繁多，但这并不意味着某一种必然比另一种更有效。你可以选择同时尝试多种技术，也可以坚持只用一种。选择标准：对你个人而言，首选技术应该是你最喜欢、且认为效果最好的那一个。


  在实际应用这些技术时，避免走极端，无论是过度勤奋还是马虎敷衍。一些可视化方法建议以热情和激情进行可视化，而另一些则建议塑造一个念头，然后让它自由飞翔，甚至当时就把它忘掉，从而不阻碍订单的实现。正如你所知，最优方法永远是中庸之道。与其绞尽脑汁寻找它，不如采纳以下原则作为规则：结果如何，就是应该如何。


  你完全有能力为自己开发正确的方法论并成功实践。最重要的是心智合一，认同你正在采取适当的行动。你像镜子里的倒影一样创造自己的现实。你如何站在镜子前，只有你自己能决定。以适合你的方式创造你的世界层。这是什么意思？


  练习可视化技术时，你绝不能感到任何内心不适。外在意图只有在心智合一时才会显现。如果你强迫自己执行强制性任务，就无法达到这种合一。这不会让你有任何进展，纯粹是浪费时间。


  ##### 可视化实操指南


  目标幻灯片的可视化应以最适合你、让你感到舒适愉快的方式进行，唯一的限制是：你不能像看静态图像那样从外部审视幻灯片；要在虚拟意义上“活”在里面。想象你生活在幻灯片内部，而非外部。其他一切都按最吸引你的方式进行。


  有一件事你绝对不能做：过度用力。定期从目标已实现的思想中获得愉悦。你肯定会享受思考成功的各种后果，对吧？所以对自己好一点。别把它变成苦差事。当你思考让你愉悦的事物时，你正直接朝目标迈进；而知道自己正在接近目标的认知也会带来愉悦。你可以非常确定：如果你能建立起这个愉悦的良性循环，目标必然会达成。


  成功最爱规律性。你可能觉得不太可能，仅凭思想的力量就能如此轻松地塑造自己的现实。但你是否曾尝试过，哪怕只是一个月，系统且有意识地将思想聚焦于某个目标？大概率没有。你习惯让思绪自由流动。它们在大气中扩散成无形的团块，因此不会产生可见结果。只有我们最坏的预期、那些让我们担忧并占据我们所有思绪的事物，才会真正成真。


  想象这样一个荒谬的场景：你种下一棵苹果树，却严肃地指望它立刻结果。因为苹果没如愿出现，你失去耐心，绝望地挥手离去，而苹果树想大喊：“再等等，拜托！”我们设定的目标也是如此。现实无法凭一句愿望就被塑造。


  ##### 现象与原理


  这些是主动影响现实的主要技术。如果你实践它们，会遇到一个非常好奇的现象。假设今天你受到启发，怀着强烈热情练习可视化。第二天你会发现，你的现实发生了一些不同寻常的事。例如，一整天你遇到几个长相极不寻常的人。他们要么过高、穿着奇怪或长相丑陋。你可能会注意到人们莫名其妙地易怒，在不该冲突的地方产生冲突，或者这一天有种奇怪的感觉，仿佛身处梦境。


  这一现象可作如下解释。在普通意识状态下，你的世界层随备选流流动，即沿能量消耗最小的流向流动。强烈的可视化使流向变直，使其沿最直接路线通往你的目标。聚焦狭窄的思想能量将你的个体现实带入备选空间的中间区域，这些区域位于正常流向一侧，那里一切都在最优水平运作。这些是我们通常在梦中遇到的过渡地带，但在现实中很少实现，因为它们涉及非自然的脚本和场景，需要更高的能量消耗。


  你思想的能量对现实产生更强烈的影响，导致其像受到干扰的静水表面一样发生变形。你不再对水面的涟漪感到惊讶。现在你可以期待看到惊人的事情——现实中的涟漪。这并不意味着你观察到的异常纯属巧合，也不意味着人们在这些日子更易怒与磁暴有关，或者你只是碰巧看到长相奇怪的人物。当你的世界层通过过渡地带时，非寻常的现实闯入其中。涟漪专门出现在强烈的可视化练习之后。当你观察到它时，你就会理解。这印象相当深刻。





  #### 协调梦境


  因此，根据你使用的技术，你可以用不同程度的力量影响你的现实。原则上，这种混合体足以将你世界的层面转变为一个舒适的角落。但如果你将制造者意图与上述其他技术一同启动，你可以取得更多成果。


  为了便于比较，想象这样一个场景：两个幼儿相遇，一个被世界推着婴儿车走，另一个则牵着自己的世界散步。孩子们总爱争强好胜，第一个骄傲地宣布：“我的世界照顾我！”另一个反驳道：“嗯，我的世界和我要去散步了！”你看出区别了吗？


  最后，我想分享的一点是，我曾收到一位读者的来信，她在信中无意间表达了修行的核心思想：“我并不真正理解透视冲浪技巧，但当我开始改变与生活的关系时，我开始强烈地感觉到一切都很美好，而且会变得更好；一切只是按应有的方式展开。”


  如果你能维持这种整体感受，那么你甚至可以忘记各种技巧，因为这已足够。将“一切都很美好且按应有方式展开”这种意图整合在一起，会创造出一个成功的整体形象，而这将反映在现实中。


  所以，你的潜力仅受限于你的意图。创造你自己的现实！


  ---


  每个人都在特定的环境中开始他们的一生。我出生在贫穷中，无法摆脱它；我必须充分利用我能得到的；我必须做别人期望我做的事。这种情境催眠了人，紧紧抓住人，使他们陷入发生在他们身上的白日梦的影响之下。只要一个人从梦境内部审视局势，这局势就在世界之镜中被巩固得更加牢固。一个被现实力量捕获的人同时也在维持着这现实。穷人越来越穷，富人越来越富。


  你可能记得在前一章我们谈到了二元之镜的幻觉。是将注意力集中在倒影上，将生活变成了一场潜意识的白日梦，在其中你完全处于环境的摆布之下。只要你被迷住并焦虑地注视着镜中发生的一切，现实就会主宰你。这与你在屏幕上看电影时注意力沉浸其中的方式完全相同，只是在生活中沉浸得深得多。你被倒影催眠了，它字面意义上地将你拉入镜圈之后。你如何将你的存在从潜意识之梦转变为可控的清醒之梦？


  你需要理解一件简单的事。在这个世界上，有你，也有镜子。当你的注意力集中在倒影上时，你就在镜子里面。镜子里发生的一切都独立于你而发生。你的生活就像一场电脑游戏，由别人制定规则。当然，你被允许尝试影响那里发生的事情，但你被剥夺了最本质的东西：你无法离开这场游戏。


  只有一样东西将你锁在里面，那就是你的注意力。你有能力退出镜子。镜子里面是非清醒梦。镜子外面是清醒梦。镜子两边是同一个现实，因为它是一面二元之镜。但在那里，在镜中世界，你不控制现实；现实控制你。在镜子里，你掌握在幻觉手中，以为触摸倒影就能改变它；但这只有从镜子的这一边才可能，在这里内在意图变成外在意图。要从镜子内部逃到外部，你必须将注意力从倒影转移到形象上。一旦你意识到自己站在镜子前，你就获得了按心智形象塑造现实的能力。


  摆脱幻觉后，你必须遵守第五原则，将你的思维链从“不想要”转向“想要”；从“不喜欢”转向“喜欢”，从疾病转向健康，从手段转向最终目标。如果你观察你的生活一段时间，你很快就会注意到，几乎每一步你最终都不得不接受环境，服从你假定为不可避免的事物。你习惯于被动地感知梦境，原样照单全收。充其量，你试图抵抗事件，坚持自己的剧本，与备选流变对抗。你真正要做的只是改变你的关系，即镜子前的形象。此时你将不再是游戏的囚徒。游戏将开始在你外部展开，并遵循你的意志。你将不再是筹码，而成为掷骰子的人。


  然而现在一条新规则生效了：如果你面对自认为是不幸的组合，你必须接受它并宣告它成功。如果你不想留在镜子里面，别无选择，只能遵循这条规则。仅仅转向你的思维列车是不够的。你必须将心智的控制从剧本开发切换到动态的、持续的调整。只要你遵守第六和第七原则，你就是你世界的主宰。


  通常，如果即将发生的事件不符合心智关于接下来应发生什么的想法，心智就会反对。现在必须反过来。每当心智对偏离剧本表示不满时，你必须迅速清醒过来并欣然接受变化：一切都在按应有的方式进行。


  心智真的很难接受这样一个想法：在路的开始，当一切仍不清楚时，根本不需要为手段担忧。心智会不断发现自己在思考旅程将如何发生，并挑拣各种负面场景。多想告诉心智：“搞懂了吧，蠢货！这不关你的事！你的任务是将注意力集中在最终目标上！”


  人们阻止了他们自己的计划实现。当你许愿时，心智总是预先制定一个粗略计划，设想事件将如何发展。这是心智的本性。当事件不符合场景时，我们感觉事情行不通，而事实上一切都在按应有的方式进行！因为心智习惯于用陈词滥调和固有思维模式思考，不愿改变剧本，这个人便继续按原计划行事，搞砸了一切。


  悖论在于，没有人能知道事件应如何发展以实现他们的订单。如果一个人坚持认为他们知道，什么也行不通。你的梦想似乎难以实现，是因为你被某些标准束缚， simply will
  not let these dreams be realised（原文此处为英文，译为： simply will not let these dreams be
  realised -> 简直不肯让这些梦想成真）。你的门被刻板印象的锁锁死了。


  在心中创造期望的形象——目标，然后只是朝着目标的方向迈开一只脚，再迈开另一只脚。发生在你身上的一切都是为了达到目标。采纳制造者的意图：一切都在按应有的方式进行，因为这是我决定的。我以我認為合適的方式管理我的世界。我不再任由环境摆布，但也不试图控制一切。通过在心眼中播放目标幻灯片，我塑造的不是环境，而是我打算居住的世界的终极图景。试图影响事件是心智内在意图的工作，它试图推行自己的场景。心智无法知道通往目标的路上有什么在等着它。环境由外在意图和备选流变创造。我的任务是确定流变的矢量，但它走哪个渠道与我无关。





  想象一下，你被从白日梦中唤醒，因为某些事情正在发生。事件和景色本应如常，但你却以不同的方式看待它们，仿佛你已经逃脱了事件的流动，在一个巨大的球形镜子中央恢复了理智。一个巨大的万花筒环绕着你旋转，闪烁着现实的众多面向。你是这个现实的一部分，同时又与之分离、独立。你体验到的这种“分离感”的领悟，与人在做梦时醒来、意识到梦境现在取决于自己而非相反的感受相同。在白日梦中，一切保持不变，唯一的细微差别在于现实的反应变得更慢。一旦你适应了它的缓慢节奏，你就会发现某些奇妙的事情。现实相当可塑，会根据你思想中的形象而变化和适应。这意味着什么？你身处何处？


  你现在已经脱离了这个世界。你已经走出了镜子。


  **制造者的裁决**


  亲爱的读者，现在你已经掌握了创造自身现实所需要知道的一切。你无法改变整个世界，但你的个人现实掌握在自己手中。当你摆脱双重反射的幻觉，站在世界之镜之外时，永恒就在你面前，蕴藏着无限可能。这些话语中本不应有半点人为的悲情。替代空间蕴藏着三份真正无价的礼物：你能够物质化的未来；能将你转化为天才的神圣知识；以及另一样会令你屏息的东西。


  这个最后的东西是什么，你稍后就会了解。首先，我们来谈谈知识。你可能认为只有某些杰出的思想家才拥有你问题的答案，于是你四处寻找信息，试图从他人那里学习。这个过程可能会永无止境。你可能会一生都在与所谓的启蒙者互动，他们
  *prétend* 知道你该做什么以及怎么做。但他们是如何知道这些事情的？也许他们通过阅读大量书籍变得博学，或者，与你不同，他们拥有某种特殊天赋？事实并非如此。


  想象你从遥远的星球飞抵地球。一切都不同、陌生、令人困惑。你的团队成员分散开来，各自向不同方向出发。每个人都有自己的发现。结果显示，你可以在森林中采摘蘑菇，可以在海里游泳捕鱼，在山间滑雪。地球上栖息着各种各样的生物，有些无害，有些则乐意吞噬你。


  同样，人类一直在不断发现新事物。知识的流动是取之不尽的。然而，真正进行发明和创造的人寥寥无几；其余的人只是惊讶地旁观。他们是怎么想到的？他们必然是被选中的人。那么，什么让一个人成为“被选中”的人？


  他们的目标和机遇是独特的，内在于他们独特的道路。当你走自己的路时，世界的宝藏将向你揭晓。随后，其他人会惊讶地看着你，疑惑你是如何做到的。其实道理很简单。


  悖论在于：尽管这一原则表面上显而易见，但对它的认识却依然模糊。每个人都能看到，要想达到以前未曾达到的成功高度，就必须跳出老鼠赛跑，走自己的路；然而他们仍然循规蹈矩，追随他人的脚步，试图复制他人的经历。


  我记得小时候，父母第一次带我去森林。母亲和父亲发现了一些野生蘑菇，欢快地向整个森林宣布他们的发现。而我却一个也没有找到，在他们之间绝望地徘徊，天真地认为，只要跟在大人身后，好运就会降临——因为他们找到了蘑菇，显然知道它们生长的地方。但我的努力白费了。只有当我独立地朝另一个方向出发时，我终于发现了一颗巨大的蘑菇。父母羡慕得脸都绿了，而我则因自豪而胸脯挺直，像个伟大的探险家。


  在那一刻，我悟到了一些东西，但尚未完全将其融入我的意识。后来，有许多时候，世界向我展示：如果我离开常规路径，走自己的路，我就会发现宝藏；然而，我一次次又被拉回主流，屈从于从众心理。


  这就是有意识的知识与融合意识之间的区别。你可能怀疑某件事是正确的，但这并不会有所帮助。怀疑某事为真与拥有清晰表达的知识之间存在着巨大的鸿沟。前者不能作为行动的指南，因此没有实际价值。在这方面，**特兰瑟冲浪（Transurfing）**
  彻底践行了这一点，它将直觉转化为清晰的知识表达，明确告诉你该怎么做以及如何去做。


  具体来说，在某个时刻，你必须停止研究旧事物，开始创造新事物——或者更准确地说，不是去创造，而是从所有发现和杰作所在的地方获取——即从永恒中汲取。为了获取替代空间中存储的信息，你需要先为你感兴趣的领域打下基础性知识。没有一定的初始基础，你就无法调谐到替代空间对应的扇区。换句话说，就是调入数据库。一旦你掌握了初步阶段的内容，你可以放下曾被灌输的一切。此时，你将准备好进行自己的发现并创作出新的杰作。


  任何书籍、图像或旋律都是“从”替代空间中“拉出”的。你只需“挂钩”进入对应的扇区。对旋律而言，挂钩可能是两三个基本和弦；对图像而言，可能是一种情绪；对书籍而言，可能是一种情境。你不一定需要先构思情节就能写出一本书。情节会在之后自然浮现——如果你能平息自负的心思，让角色自行从场景中脱离。无需编造；一切本来就在
  *ahí*。你只需顺着替代空间的流动平静地前行。所有天才出乎意料地简单。替代空间的流动遵循着出人意料简单的路径——而这条路径，人们一般也猜不到。


