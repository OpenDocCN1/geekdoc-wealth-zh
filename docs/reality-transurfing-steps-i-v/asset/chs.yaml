- "## Chapter 13 Coordination\n\n![74147.jpg](img/00027.jpeg)\n\nI don't want, I don't\
  \ hope — I intend.\n\n### The Labyrinth of Insecurity\n\nOnce you have walked the\
  \ path to the right door, no one and nothing can stop you from reaching your goal\
  \ — except yourself. In other words, only a lack of faith and a lack of confidence\
  \ can hinder your progress. Lack of faith and lack of confidence are essentially\
  \ the same thing. Both weaken the effectiveness of internal intention and make external\
  \ intention almost impossible to realize.\n\nWhen you lack confidence, nothing you\
  \ do turns out well. The more pressure you feel because you *must* do things well,\
  \ the worse the result. Lack of confidence, combined with a tendency to exaggerate\
  \ the complexity of the challenge, leads to a state of extreme tension or complete\
  \ overwhelm. The feeling of extreme overwhelm is caused by the initial tension squeezing\
  \ itself inward. The outer importance attached to the goal makes the desire to reach\
  \ it painful or exhausting, while inner importance makes you doubt your abilities.\
  \ All this together leads to insecurity.\n\nInsecurity tries its utmost to tighten\
  \ the grip of internal intention to achieve the goal. Not even considering the influence\
  \ of balancing forces, the effect of this tight grip is always contrary to the original\
  \ intention. The effort required to sustain multiple excess potentials simultaneously\
  \ exhausts all your personal energy. You can see how many potentials are involved:\
  \ inner and outer importance, frustration, and the effort needed to control yourself\
  \ and the situation. There is simply not enough free energy to go around. No wonder\
  \ people end up feeling inhibited and tense, which makes them clumsy and awkward,\
  \ which in turn causes them to tighten their grip on control even further.\n\nThis\
  \ is why people end up feeling overwhelmed, unable to move or say anything coherent.\
  \ When a person is in this state, it seems as if their intention is clamped in a\
  \ vise, but in reality, once it reaches this stage, intention disappears completely.\
  \ All the energy that should fuel the intention is spent on sustaining excess potentials.\
  \ Insecurity, in the form of anxiety and panic, is pure fodder for the pendulums.\
  \ Panic generates prognoses beginning with \"But what if...?\" When a person feels\
  \ insecure, the prognoses are usually pessimistic. In this case, energy is directed\
  \ toward mentally replaying negative scenarios and worrying about them. This also\
  \ consumes the energy of intention. It is bad enough that energy is consumed, but\
  \ worse is where it is directed. Stress, panic, and fear are powerful generators\
  \ of our worst expectations, and as you know, these expectations come true.\n\n\n\
  \n\n#### 内疚感与不安全感\n\n内疚感是导致不安全感的另一个丰富来源，它会开出一束由自卑、无能、软弱和无价值感组成的花束。带着这一系列感受，还谈得上什么自信呢？内疚及其相关事物会导致经络收窄。与此同时，意图能量仅足以驱动微弱、优柔寡断和平庸的行动。如果你有沉溺于内疚感的倾向，身边总会围绕着操纵者，如同飞蛾扑火。他们敏锐地感知到你的弱点，乐于在你毫无防备的能量上肆意吞噬，并借助你的内疚感大做文章；而你却在无休止地解释和为自己的行为辩护，进一步加深了不安全感。\n\
  \n##### 不安全感的恶性循环\n\n不安全感制造了一个恶性循环。重要性和欲望越强，不安全感就越深。你对自己和局势的控制欲越强，紧张感就越强烈。你越感到恐慌和焦虑，它们成为现实的可能性就越大。内疚最终将生活变成了失败者悲惨的生存状态。\n\
  \n##### 获取自信的错误尝试\n\n###### 1. 正面进攻世界\n\n为了走出迷宫，人们拼命试图获取自信。一种方式是对世界发起彻底的进攻。在一种先发制人的策略中，他们试图展示力量并掩饰缺乏自信。人们试图通过正面强硬果断地冲击世界来建立一道自信的墙。这种方法消耗大量能量，但这道自信之墙将不断崩塌。强力冲击背后的能量耗费在创造过剩势能和抗衡选择流上。无论如何，这种方法注定失败，建立自信之墙的战役将再次重演。\n\
  \n###### 2. 孤注一掷\n\n另一种获取自信的方式是不费心建立自信基础，而只是孤注一掷。这种自信只不过是怯懦态度的反面。它是制造一种并不真实存在的印象。如果自信没有任何基础，就会产生过剩势能，但过剩势能并非唯一问题。当你以自鸣得意或过度自信的方式行事时，通常会损害他人的利益。一个站在沙漠中央大喊“世界是我的牡蛎”的人可以随意喊叫。只要他不打扰别人，平衡力就会放过他。然而，当毫无根据的自信开始与他人的能力比较时，依赖关系就产生了。建立在与他人比较基础上的自信纯属过剩势能，尤其是当这种自信建立在对他人嘲讽或轻蔑的态度上时。虚假的自信迟早会受到惩罚，或者用俗话说，会吃个“闭门羹”。\n\
  \n###### 3. 狂喜式自信\n\n还有一种自信是害羞者突然体验到一丝自信时感到的狂喜。这也是虚假的自信，因为它建立在很快就会消退的暂时情绪高涨之上。\n\
  \n#### 如何获得真正的自信？\n\n与不安全感作斗争是徒劳的，也无法在虚假勇气的屏障后隐藏不安全感。无论如何你都无法隐藏不安全感，试图创造它所花费的能量将反噬你。试图强迫自信也是毫无意义的。当勇气和决心本不存在时，任何试图人为激发它们的努力也将白费。强迫自己在实际上崩溃时保持镇定是完全不可能的。正如我们上面所说，意图能量无法被抓取或紧握；它最终耗费在维持控制欲上，不剩下任何东西来激励行动。\n\
  \n以任何方式试图建立自信都是荒谬的。你可能认为自信源于果断行动，但现实是当一个人停止斗争并开始行动时，意图能量释放了控制欲，从过剩势能转向行动的实施。最终“手做眼睛害怕做的事”，一切都会变好。自信不是通过行动培养的——它是意图能量的释放。你无法培养自信。自信就像能量——要么存在，要么不存在。\n\
  \n自信如同自我信念，无法通过自我暗示获得。你可以重复关于自己多么自信的肯定语，直到面部发青，但这仍将是一个幼稚且徒劳的练习。这无异于在不治疗病因的情况下对抗疾病症状。无论你如何对待你的不安全感，它都不会消失。无论你在哪里寻找自信，都找不到。你也无法维持持续自信波段所需的相应思维传递。你可能在早晨对自己说：“就这样了。我很自信。没有什么能动摇我的自信。我坚如磐石。”试试看，你就会看到之后发生什么。有一会儿你确实会感觉更自信，这会让你感到极度快乐，甚至更自信。但很快摆锤会安排一些恶意挑衅，你甚至不会注意到自己是如何从自信的浪尖跌落下来的。你又会感到烦躁和沮丧，问题凭空出现，某事让你沮丧，你又有理由像以前一样恐惧和仇视世界。你以为看到了隧道尽头的光，却走进了死胡同。\n\
  \n#### 走出迷宫的秘密\n\n那么，如何从这个错综复杂的迷宫中解脱出来？你其实无法做到，因为根本没有出口。迷宫的秘密在于：当你放弃寻找出口并抛弃重要性时，它的墙壁就会崩塌。\n\
  \n不安全感的原因可分为两类：\n1.  **内在原因**：如对个人品质的执着关注。这会引发不满足于自身缺点和缺乏特定优势、与他人比较的自卑感、害羞、害怕失败、害怕出丑等感受。\n\
  2.  **外在因素**：与对外部因素不切实际的高估有关。结果是由于个人微薄的内在品质与外部世界的高要求之间的差距，产生毫无根据的恐惧；感觉在大城市中渺小；最后是对现实的恐惧。\n\
  \n#### 自信的悖论\n\n悖论在于：要获得自信，你必须放弃想要获得它的愿望。迷宫的墙壁由重要性构成。你在迷宫中徘徊，试图摆脱不安全感并获得自信。自信是一场空忙，另一个摆锤的发明，一个欺骗性的幻影，一个给重要性设下的陷阱。自信是摆锤的游戏，它们总是赢家。哪里有信念，哪里就有怀疑的空间。同样，哪里有自信，哪里就有犹豫和优柔寡断的空间。自信是一种对成功的信念。任何场景都可以做负面调整，一个微小的调整就足以推倒自信的墙壁。\n\
  \n自信的概念建立在过剩势能和依赖关系之上。任何关于自信主题的变奏大致采取以下格式：“我下定决心。我坚定不移。我比其他人都强。没有什么能阻挡我。我克服所有障碍。我比其他人更强壮、更勇敢”，并以此类推。\n\
  \n\n\n\n\n#### 自信与协调\n\n自信不过是暂时的过剩势能。无论你用什么包装将其包裹，它终究仍是过剩势能。甚至自控也不过是暂时的紧张集中；因为自信仅仅是不安全感的相反价值。二者都需要输出能量，且前者必然会被平衡力量摧毁。因此，追求自信正如追逐未来某处悬浮的虚幻幸福般徒劳无功。\n\
  \n于是，我们成功打破了另一个虚假信念，但我们该如何在没有自信的情况下行事？Transurfing（趋势冲浪）提供了一种替代方案——协调。协调代表什么，你将在下一节很快了解到。\n\
  \n##### 协调重要性\n\n我们为什么需要自信？为了大胆且坚定地争取我们在阳光下的一席之地。摆动器强加了一个神圣不可侵犯的公设，其内容是：天下没有免费的午餐；如果你想成就某事，就必须为之奋斗、坚持、要求、超越对手并挤出一条路，但为了大胆果断地行动，你必须拥有自信。\n\
  \n正如你所知，战斗与竞争之路并非唯一出路。如果你拒绝摆动器的剧本，你可以心平气和地获得属于你的东西，无需施压、无需争斗，只需找到“拥有”的意愿。选择自由对摆动器构成了毁灭性的威胁。如果每个人都不争斗、不耗费精力制造障碍再克服障碍，而是直接主张应得之物，摆动器将一无所有。尽管很难想象一个没有摆动器的世界，但它们制造的虚假刻板印象和信念，并不像运动定律那样坚不可摧。觉知与意图让你能够无视摆动器的游戏，在无需争斗的情况下主张应得之物。当自由无需挣扎时，便不再需要自信。\n\
  \n自信仅有一个源头——重要性。自信代表的势能与不安全感相同。它只是同一特质的相反极性，且两极皆植根于对外部因素与环境的依赖。以下隐喻描述了这种依赖的本质。摆动器像牵着木偶绳线般牵着人前行。此人不信自己能选择自己的路，甚至不信能独立行走。若绳线保持均匀，此人便如牵着母亲手的孩童般自信地行走；但一旦绳线松弛、松动或猛烈抽动，此人便会感到不安，并试图收紧绳线。\n\
  \n并非摆动器紧紧抓住了此人，而是此人不愿放开重要性的绳线。他们不敢放手，因为他们处于依赖的力量之下，这制造了一种支持与自信的幻觉。最终，孩子会松开母亲的手独自行走，母亲也会鼓励孩子这么做。而摆动器却会试图说服此人：没有绳线的支持，他们无法独自选择道路或行走。若此人能摆脱妄念，放开重要性的绳线，便会发现自己能自由行走于任何想去之处，并能简单地选择目标，而无需为之奋斗。\n\
  \n一旦一个人获得了自由，便不再需要自信及其制造的支持幻觉。他们真正需要的仅是协调，以防跌倒。当然，他们已习惯在摆动器的控制下、紧握重要性绳线时所获得的稳定与支持。然而，当他们将能量付予摆动器时，会不断破坏平衡，最终无助地悬挂在伪安全绳的末端。若一个人能放开绳线，维持平衡所需的仅是避免制造重要性与过剩势能。\n\
  \n自信作为支撑将不再必要，因为在没有重要性的地方，无物可守、无物可征服。无所畏惧，无所焦虑。只要我不赋予任何事物过度的意义，我的世界层面就不会因过剩势能而扭曲。反之，我放弃斗争，随波逐流。我是空的，所以无物可钩住，尽管这不意味着我悬浮于真空中。最终，若我愿，选择权在我。不再需要挣扎。我只是平静地走我的路，取我所得。不同于动摇的自信，这是一种全新的有意识、镇定的协调状态。\n\
  \n宁静感从何而来？内心平静的感觉源于不制造内在重要性，因而无需证明任何事。当你抱有“我是重要人物”的信念时，向他人证明这一点的欲望便会产生，进而制造过剩势能。接着，平衡力量会竭尽所能揭开你重要性的神话，反复制造条件将你的自信推向极限。\n\
  \n slightest 的自卑感都会驱使一个人奋斗，以提升并彰显自己的价值感。放弃向自己或他人证明任何事物的需求，只需将你需要证明的事物视为根本真理并接纳。你可以毕生奋战以证明自己的价值，可当你放下斗争的那一刻，你便已拥有它。\n\
  \n不安全感本质上与低自尊同源，那么如何提升自尊？你或许以为我现在将试图让你相信：你比你自己认为的要优秀得多。许多心理学家不假思索地就是这么做的。确实，只要不接近傲慢，他人对你的评价与你对自己的评价成正比。当你承认自己的真实价值，且不带任何自欺欺人时，他人会同意你的看法。唯一的问题是，要让自己相信自己的真实价值并非易事。试试看。若你深受低自尊之苦，你将无法说服自己相信相反的观点。无论你如何努力说服自己拥有真实价值，你永远无法真正相信自己与众不同。念头会悄悄冒出来：“那么，我那些特殊品质在哪呢？我只看得到缺点。它们显而易见。”\n\
  \n所以我不会敦促你相信自己的特殊品质并提升自尊，因为我知道那只会让你变得自满且过度自信，或将你推向更深的绝望。我的建议是彻底放弃对价值的争夺。不要试图相信或说服自己拥有价值。只需放下斗争，观察会发生什么：周围的人会开始更尊重地对待你，仿佛他们更看重你。当你体会到他们态度这一事实时，说服自己或试图相信某事的需求便会消失，你将仅仅是知道。\n\
  \n这是一个悖论，但屡试不爽。为自我价值而战会耗尽你的自由能量，将其引入与备选流的斗争，并制造过剩势能，从而招致平衡力量的狂风。所有这些境况交织成一团乱麻般的问题，充满各种负面后果。你无法理清这团乱麻。只需放弃为自我价值而战，你便会对结果感到惊喜。你的自我价值感将在你眼前增长，自尊随之提升，而周围的人也会随之肯定你这新生的自我感。\n\
  \n\n\n\n#### 协调力：超越内在重要性与外在恐惧\n\n试图否认或消除愧疚感，正如人为抬高自尊一样徒劳。如果你天生容易产生愧疚感，便永远无法抑制或驱散这些体验。那么该怎么办？与应对低自尊一样：停止向他人辩解。仅在绝对必要、需要解释行动时才进行辩解。请记住，无论你做了什么，只要未伤害他人，任何人都无权评判你。不要公开承担责备，也不要为自己的行为辩解。让操纵者落入空虚之中。抵制摔门而去的冲动，默默离开那个人们聚集并从他人愧疚感中获利的法庭。不要给他们任何东西。如果你有深重的愧疚情结，起初暂时封存良知未尝不可。不要邀请他人评判你的自我价值。只有采取这种态度，而非通过内心斗争，你才能从愧疚感中解脱良知。你会看到愧疚感如何化为乌有。\n\
  \n放弃自我价值之争、不再为自己辩解，你便清算掉了内在重要性的很大一部分，因为愧疚感和低自我价值感是内在重要性的主要表现。所有其他类型的过剩势能均衍生于此。你将不再感到需要保护，因为已无东西可守护。也不再需要抢先攻击他人以预判其进攻。谚语云：“不惊吓他人，便无所畏惧”。\n\
  \n同理，若你降低外在因素的重要性，它们将不再凭借优势统治你。最压迫的两种外在重要性是对未知的恐惧和面对挑战时的不堪重负。两者均产生恐慌与压力的阴郁势能。每个人总担心着什么。不安全感强者倾向于在问题重压下屈服，拖着负担前行。强势人格则试图以力量和果断克服困难，凭借显性自信的过剩势能强攻堡垒。\n\
  \n不安全感与自信同樁需要能量。不安全感下能量主要耗于恐慌与焦虑；自信下则耗于克服障碍。这些都是与外部世界互动的精细手段。现实远比表象简单。一旦你有意识地降低外在重要性、放弃对抗选择流，感知到的障碍便会从路径上清除。你真以为需要自信吗？不，现在只需良好的协调，随流而动，有意识地控制的不是脚本，而是你的重要性水平。原本维持各类过剩势能的能量，如今用于维持平衡，并以纯净意图之桨略助一臂之力。\n\
  \n当然，无论多么努力，你永远无法完全停止赋予生命意义，所以不要对抗以消除重要性；只需松开手，将焦虑能量转化为行动能量。以任何可行方式开始行动，无执着、无压力。过剩势能的能量将在行动中耗散，释放意图能量，复杂问题随之转化为微小问题。\n\
  \n关于对未知的恐惧，盲目信仰、自我暗示、虚假自信均无法有效应对。你或许记得我建议过不思考实现目标的手段。你永远无法强迫自己相信遥远目标或百分百成功的可能性，故放弃这些徒劳尝试，因信仰将归于虚无，自信的短暂爆发也迅速消退。\n\
  \n你不需要自信或信仰。你需要协调。协调意味着：愉悦地思考目标，仿佛已达成；放开对脚本的控制，随选择流而动，以纯净意图之桨助其前行。这与盲目相信成功截然不同。有信仰处（尤其是盲目信仰），便有怀疑空间。正是被强迫的重要性势能致盲。当你在清醒觉知中随流而动，万事万物无需过度努力便归位。\n\
  \n当你依协调行事，你先前想相信却因未知而恐惧的事物，很快将从水流转弯处显现。事实面前，疑虑消失。信仰转化为认知，对未知的恐惧化为对自主力量的满足。最重要的是降低重要性、放弃控制脚本。同样重要的是记住：挑战的复杂程度由你决定；若你允许，脚本调整将向有利于你的方向演变。\n\
  \n最终，绝对协调源于心智与内心的和谐。若意识层面你确知所求，而潜意识里藏着疑虑的蠕虫或抑郁的微光，协调仍属可望不可即。心智和谐通过聆听内心低语、忠于个人信条达成。关于如何及为何聆听心声，已有诸多论述。此处仅补充：遵循个人信条即爱己、纳己、不受良知或愧疚折磨、坚定遵循心智与内心的指引。\n\
  \n当自尊受损、心智与内心产生冲突，忠于个人信条的努力便会瓦解。按真实价值观与信念生活固然美好。更美好的是知晓：你无需创造、改变或斗争信条，虽许多人对此凿刻雕琢，仿佛信条真是大理石雕像。修饰信条只会带来徒劳的寻魂、灵性煎熬与自我怀疑。个人信条无法通过斗争或刻意努力塑造、鼓舞。你早已拥有信条，只是它如心般被封印在重要性的盒中。一旦放下内在与外在重要性，你立即会感知到信条已被释放。重要性归零时，你无需守护、无需征服。你只按信条生活，从容取走属于你的一切。\n\
  \n放弃自我价值之争、不邀请他人评判你的价值、降低外在重要性，你终将获得通常所谓的真正自信。这非建立在过剩势能之上的脆弱自信，而是平静的内在力量——协调。\n\n\
  \n\n\n#### 真正的协调与内在平衡\n\n真正平静的协调与外部事物毫无关联，因此它既不需要确认，也不需要证明。毫无疑问，你在电影中见过那种自信无可置疑的角色。真正平静的自信只能源于内在的自给自足与完整的统一。你不将自己与任何人相比；你只是处于一种完全平衡的状态。这种平衡在心智与内心合一时实现；当没有愧疚感、依赖感、优越感、义务感、恐惧或压力时实现；换言之，当你不打破自身内部或周围世界的平衡时实现。与外部世界、你自己以及你的信条和谐共处。这是我们应努力追求的理想，以拥有完全的自信，即协调。通过其他任何手段获得的自信只能是虚假的。\n\
  \n协调赋予你摆脱摆动的自由，让你能朝任何你渴望的方向独立前行，以获得你想要的一切。如果当下你必须履行枯燥的义务，请抽离自身，想象自己正在为一部电影拍摄。坚持住，因为你必须把角色演到最后，至少要演到当前这季结束，直到你走过那扇正确的门。练习形象化你的目标幻灯片，而不去思考手段，并等待外在意图为你打开大门。\n\
  \n#### 与泥塑傀儡的战斗\n\n终于，我摆脱了多余势能这一不必要的负担。内在重要性与外在重要性不复存在。我无需彰显优越，也无需掩饰劣等。我不再畏惧过去与未来。我无物可护，亦无物可征。我终于摆脱了摆动的影响，可以照顾好自己了。要是这都是真的就好了……\n\
  \n摆动拥有巨大的力量，其力量部分源于人们并不怀疑它们的存在。将摆动描述成密谋对抗人类的外星秘密组织是不恰当的，因为摆动是我们世界不可或缺的一部分。它们通过信息能量对人们产生真实影响并施加控制。其影响作用于三个层面：心智、情绪与能量。摆动通过重要性之弦从人身上抽取自由能量。向来如此，只是近来纯信息层面的冲击大幅加速了。\n\
  \n人类文明演化了数千年，但仅在过去十年里，由于信息技术领域的发展，局势才发生了根本性变化。存储在各类服务器上的海量累积数据正呈指数级增长。威胁不那么在于存储的数据量，而在于其分发的方法与手段。我们陷入了一个电信网络，它随着每一天的流逝变得更加危险。然而我们并未察觉危险，因为信息产业的增长发生在新型娱乐方式和好用有趣的便捷工具所带来的愉悦麻醉之下。\n\
  \n显而易见，摆动的目的不是娱乐其追随者，而是将他们置于其权力之下。信息网络的扩张与精密构建，使摆动能同时吸引数量惊人的追随者。观看同一节目的人口比例越高，摆动收割的能量就越多。摆动变得越强，其影响力越大，追随者就越容易被说服遵循“照我做”的规则。\n\
  \n摆动的规则行之有效，成功地将人们从其内在目标中拉离。该过程正逼近最终阶段，届时人将彻底丧失选择自由。总有一天，人们会发现自己身处一种境地：他们不再是别的什么，只是一个庞大的信息能量矩阵中的元素。个体将被禁锢在条件反射的盒子里，沦为大机器的一个零件。矩阵网格将决定每个元素该如何运作、该渴望什么。正如你所知，科幻小说在其时代往往会变为现实。\n\
  \n这一过程正稳步且不易察觉地发生着。对此无能为力。臣服不一定非要靠武力强加。只需塑造个体的世界观，使其对自由毫无概念即可。这正是当下正在发生的事。在这些条件下保持自由感相对困难，因此我们将更仔细地审视摆动防护方法的具体层面。\n\
  \n正如你所知，重要性是摆动唯一能利用的“钩子”。摆动甚至能钩住你“将重要性维持在零”这件事被你赋予的极大重要性。关于摆动的一切论述都很严肃，但此处存在一个悖论：如果你现在当真向摆动宣战，你注定会失败。与摆动战斗最重要的原则是拒绝战斗。\n\
  \n你必须明白，这不是与有形物体的搏斗，而是一场与泥塑傀儡的较量，一场游戏，所以这场战斗是什么样，取决于你。如果你将过程视为战斗，无论发生什么你都会输，因为你无法在战斗中战胜摆动。如果你向傀儡发起挑战，哪怕只是按这种思路：“现在我知道它只是个泥塑傀儡了，我要给它点颜色看看！”，你就可以认为自己失败了。如果你将其视为游戏，最坏不过输掉一局，而非输掉整场战斗。\n\
  \n只要你看清了游戏的本质并拒绝遵守其规则，摆动只是个傀儡。每当摆动感到有把握时，它们就会伺机等待猎物。做好准备：它们会竭尽所能试图让你失去平衡。这是游戏的本质。你上钩了，失去平衡感，变得极度不安，将能量喂给摆动。\n\
  \n你起初平静、快乐、平衡，但没过多久摆动就挑衅你。你卷入棘手局面或收到坏消息。按剧本，你本该紧张、恐惧、绝望、沮丧，表达愤怒或不满。此时你只需醒悟，记起游戏的本质，随即降低重要性。若你带着清醒觉知这么做，摆动就会落入空无。\n\
  \n只要你不在做白日梦，就能打破游戏规则。在非清醒梦中，梦者总是环境的受害者。梦境自行发生，你无能为力。在清醒生活中，人们早已习惯对任何负面影响做出同样自动化的反应，后果我不必多说。然而，你不是牡蛎，完全有能力做出“不恰当”的反应。如果你刻意表现得古怪，摆动的计划就会落空。你只需及时清醒过来，打破游戏规则。\n\
  \n你会亲自体会到，当你意识到摆动拼命想激怒你却未上钩时，那种感觉有多美妙。这份愉悦不仅源于因自己坚强而自豪，还有另一原因。当你把能量给摆动时，你会变弱；但当摆动试图挑衅你而你抵抗住了，你就成了摆动注入挑衅中的那份能量的接收者，从而变得更强。这额外的力量体验为愉悦感。现在你能想像摆动以你的能量为食时有多爽了。别给它机会。它会一次次追逐你，但不要动摇。让它在你身上耗尽能量。\n\
  \n\n\n\n\n#### 打破游戏规则\n\n在你打破规则进行游戏时，不要被诱惑而对游戏感到愤怒或沮丧。当你始终保持有意识的觉察进行游戏时，你就在享受乐趣，手持糖剑与魔像战斗，它将无法触及你。如果你打破规则并设法保持内心平衡的状态，魔像将粉碎。然而，一旦你开始发脾气，钟摆的糖剑就会变成危险的利刃。那时游戏可能演变成战斗，并以被迫的转变告终。\n\
  \n不要抗拒被激怒时的反应。从不同角度审视它。你体验到的情绪是结果，其原因在于你与发生之事的关系。你必须有意识地改变对负面因素的反应。展示不恰当的态度并不难，因为你知道这只是场游戏。让小丑跳跃吧。这就像你在镜子房间里与隐形对手战斗。钟摆似乎就在你身边，但现实中你看到的既不是钟摆，也不是钟摆的倒影。镜中的倒影是你的**重要性**。只要某事物被赋予了夸大的重要意义，你就会在镜子中拥有一个时刻逼近的对手。当重要性保持为零时，便无所畏惧、无需保护、无人可攻击。那时重要性的镜子将碎裂，你将看到魔像已经崩塌。\n\
  \n你不需要在与钟摆的较量中表现强硬。**空性**要有效得多。“刀枪不入、钢铁神经、铁一般的意志、坚定不移、忍耐和自控”等词汇暗示了保护、紧张和反击的准备。维持这种保护场需要消耗巨大能量。正如你所知，所有这些能量都是钟摆的粮食。然而，如果我是空的，就无需维持保护场。能量不被浪费，魔像落入空性而崩塌。你只需持续提醒自己游戏规则，保持觉察，将重要性维持在零点。\n\
  \n将重要性维持在零的需求，不应升级为永久的防御战备状态。你不应赋予游戏本身过度的意义。放松，允许自己偶尔失败。没有必要不惜一切代价追求胜利。只要你保持控制的执念，钟摆就能摆布你。它会像狗死咬一根不愿松口的棍子一样拖着你走。如果游戏不再好玩，就通过失败并彻底不在意来展现最大程度的冷漠。\n\
  \n如果钟摆赢了一局，不要固执；接受你输了这局游戏。失去内心平衡、感到不安并没有错。不要因此苛责自己；下一局将属于你。也不要发誓这是最后一次，或设下最终通牒和陷阱让自己掉进去。你以为在为自己设定最终通牒，实则是为钟摆设定，这正是它等待的。最终通牒无非是强大的保护墙。筑起保护墙将游戏变为战斗，你必将在其中失败。\n\
  \n做好准备，钟摆会温柔而柔和地挑衅你。许多人在问题重压下喘息时，会在烟草、酒精和毒品中寻找拐杖。下次你放弃恶习并告诉自己“到此为止，这是最后一次”时，说话的不是你。钟摆能捕获你的思想波，字面意义上将思想强加于你。每当你发誓“就最后一次”，醒来甩掉幻觉吧。这是钟摆在说话。有意识地觉察这一事实，将帮助你冷漠地与坏习惯“分手”；不是果决地，而是冷漠地。\n\
  \n钟摆为吸引追随者无所不用其极。它们已将一切神圣事物——从伦理原则到宗教——完全磨损殆尽。世界是**独一灵**的显化，是合一中多样性的肯定。神圣本质渗透一切有生无生之物。神住在我们每个人心中。我们之前将人类灵魂比作大海中的一滴水时触及过这一点。神一旦通过在地球上的显化向人类宣告其存在，钟摆瞬间便将宗教纳入控制。你若观察最初的《十诫》便可亲见。\n\
  \n**第一诫**虽有多种解读，实质是：“除我以外，你不可有别的神。”这要求人信奉统御万物的唯一神，但人们随即违背诫命创造了众多宗教——即钟摆。更准确地说，他们甘愿屈服于宗教钟摆之下。宗教钟摆藏在主的名号背后。灵性牧师真心尝试传播主的道与工，但作为追随者自身，他们被钟摆掌控，其行动几乎无足轻重。宗教战争和冲突真能取悦神吗？\n\
  \n**第二诫**：“不可为自己雕刻偶像，也不可作什么形像，仿佛上天、下地、地底下、水中的百物。不可跪拜那些像，也不可事奉它们。”这同样指向钟摆。钟摆使追随者服从其意志，迫使他们为其利益行事，无论环境如何，无论隐藏其真实目的的善意如何。\n\
  \n所有诫命基本可归结为两条。耶稣回答“老师，律法中的诫命哪一条是最大的呢？”时说：“你要尽心、尽性、尽意爱主你的神。这是最大的，也是第一条诫命。第二条也相仿，就是要爱人如己。这一切律法和先知的道理，都系于这两条诫命。”爱自己与他人中的神，而不崇拜钟摆。这就是诫命劝诫你的全部。\n\
  \n大众传媒对人类心理的负面影响，要求个体保持高度的有意识觉察。不要让负面信息影响你。无论你看向何处，总有人试图诱惑你、抓住你的注意力、或强加什么于你。任何群体都有其钟摆。追随者执行钟摆意志时，往往不自知其真实目标，所以你应始终自问：谁需要这个，为什么？我需要吗？同时，主动寻找与你目标相关的任何信息。“是的，是的，”你的头脑不耐烦地回应，“我早都知道了。”可头脑已知又如何？尽管头脑知晓一切，每当钟摆开启游戏，它仍会粗心大意地打瞌睡。不要让钟摆牵着你的手把你带走。\n\
  \n总的来说，你的任务归结为有意识地打破规则。这有两种方式。要么放下重要性，在冷漠的空性中让钟摆沉没；要么以不恰当的反应平息其摇摆。若你难以降低重要性，始终可以坚持第二种方法。对挑衅的任何不恰当反应，都是对游戏规则的粗暴违背。\n\
  \n##### 结束战斗\n\n\n\n\n#### 选择的自由\n\n选择的自由在于一个极其简单的事实。无需为达成目标而战。你所需要的只是**拥有**的意愿。一旦你允许自己拥有，就可以开始平静地朝着目标的方向，迈出一步又一步。摆锤会强加不同的剧本，迫使你为目标而战，向世界和你自己宣战。摆锤建议从你自己开始。它们让你相信你不完美，因此在你改变之前无法达成目标。一旦你改变了，接着就必须加入争夺阳光下一席之地的战斗。这种剧本背后只有一个动机：榨干受害者的能量。通过与自己战斗，你把能量给了摆锤；当你加入与外部世界的战斗时，也是如此。\n\
  \n在这个语境下，“战斗”一词预设了持续的紧张、挣扎和自律。你必须时刻准备好战斗，就像那些隐约明白世界上某处有自由的战士一样。战士的错误在于他们认为必须为自由而战。他们一生都在战争中度过，总是把主要的战斗推迟到以后。战士不相信你可以直接走过去拿走你的自由。他们告诉自己和他人，这是一项极具挑战性的任务，需要多年的辛勤工作和汗水。\n\
  \nTransurfing（现实趋避）朝圣者不会卷入为自由而战的斗争，因为他们知道自由早已属于他们。没人能强迫你战斗，但如果你充满内在和外在的重要性，你确实别无选择。在\
  \ Transurfing 中，最接近“战斗”的是**行动无瑕的意图**，但这不需要战术效率和自律，而需要**有意识的觉察**。\n\n如果你发现很难直接主张并允许自己拥有“拥有”的想法，你可能会把它推迟到以后再处理。但要推迟多久？推迟的纱线可以延续你的一生。推迟到下一次，会让当下的生活变成为某个更美好未来而进行的彩排。人们总是对当下不满意，并用事情很快会好转的希望来安慰自己。有了这种态度，更美好的未来永远不会到来。它将永远悬在你面前供你追逐，就像试图追上落日一样。\n\
  \n你还有大把时间的想法是一种幻觉。你可以在对更美好未来的期待中度过一生。有句谚语：“没有什么比暂时的更永久了。”实际上没有时间等待。不要等待未来，而是将它插入当下这一刻。允许自己拥有，就在此时此地。这并不意味着你的目标会瞬间实现。我们谈论的是意志，即拥有的意图，这与与自我的持续战斗形成对比。**拥有的意志**比**行动的意志**强大无限倍。\n\
  \n如果你一生都在参与争夺阳光下一席之地的战斗，这让你走多远了？你是否不得不像苦役犯一样拖着自己去枯燥的工作或上大学，而别人却在滑雪胜地放松或在海边沐浴阳光？也许他们赢了战斗，现在能享受生活了？\n\
  \n参加战斗的大多数人，即使存一辈子钱也去不起滑雪胜地；如果你能一年给自己几天享受，那已经是成就了。但常发生的情况是：你到了那里，天气不好，或者缆车坏了，又或是要处理其他无法预见的问题。即使一切顺利，你脑海里仍会想着要节俭，会记得你为这几天假期辛苦工作赚钱，而假期却转眼即逝。原则上你玩得不错，但接着得回到灰暗的工作日子，再次像奴隶一样干活。\n\
  \n你赢了战斗，赚到了假期，但黑暗的阴影不时爬进你的思绪。你确信必须长久努力工作，才能换来短暂的快乐。你还没准备好完全给自己许可去拥有。\n\n那些给自己许可去拥有的人不参与战斗。他们忙得没空。例如，一对幸运的情侣上周在瑞士的滑雪胜地度假。他们玩得很尽兴。所有的欢愉终将结束，但对不同的人结束方式不同。现在这对情侣在争论下一站去哪。他想去澳大利亚阿尔卑斯山，她更想去法国阿尔卑斯山。整个场景可能让你想起某部肤浅的肥皂剧，但对这对情侣来说，这不仅仅是严肃的事。感知的差异源于**拥有的意愿**层级不同。你将再跋涉一年才能有个假期，而这对情侣期望一周后就有下一个假期。\n\
  \n理性的头脑可能会抗议：“但这怎么可能？毕竟他们生来就有百万财富，而我得赚钱！我从哪弄钱？”我们已经说过多少次，**你不必考虑钱**。当你结束战斗并给自己许可去拥有时，**外在意图**会为你铺平获得所需事物的道路。我无法在此刻向你证明这一点，但你可以亲自测试这个原则，别尝试，直接去做，不是明天，而是今天。从这一刻起，无条件、毫无保留地允许自己拥有，不是偶尔，而是一直。如果你不期待即时结果，继续允许自己拥有，美好的一天某事会发生，别人会想称之为奇迹。生来拥有百万财富的人已经浸润在**拥有的意志**中。他们甚至不必思考，而你将不得不与幻灯片打交道。头脑会担心目标有多现实以及实现的手段，但这是通向无处的战斗之路。如果你走这条路，永远赚不够钱。**赚取拥有的意志，而非金钱。**\n\
  \n如果你专注于目标，就像已经实现了一样，你的门就会打开，手段会自行解决。这一切的自由足以让你头晕目眩。你可以选择不接受这份自由。这是你的选择。没有什么比说这全是废话并继续度过余生更容易的了。每个人都做出自己的选择，并得到他们愿意拥有的东西。你的选择是不可改变的法则，有了它，你塑造自己的现实。\n\
  \n\n\n#### 备选空间中的选择\n\n备选空间中的选择大致按以下方式进行：人们闯入一家超市，售货员问道：“您想要什么？”\n\n一位顾客回答：“我想成为演艺界的明星。”\n\
  \n售货员回应道：“没问题。这儿有个特制版本，专为您准备。世界级名声、财富、光芒！您要不要？”\n\n顾客惊讶地说：“这个嘛……怎么说呢……没那么容易。只有极少数人真能出人头地，那少数被选中的人拥有独特天赋，而我只是个普通人。”\n\
  \n售货员耸耸肩：“天赋跟这有什么关系。这是您的商品。拿去吧！”\n\n顾客又说：“进演艺圈真的很难。有点像丛林，充满鲨鱼的世界……”\n\n售货员反驳道：“行，那这儿有一条巨型鲨鱼帮您闯出名堂。拿去吧，您不会后悔的。”\n\
  \n顾客回应道：“演艺明星拥有如此豪华的豪宅、名车、上流社会……这一切真的能属于我吗？我简直不敢相信。”此时售货员说：“噢，那真遗憾。我想我们帮不了您了”，说着把商品放回了货架。\n\
  \n##### 抗拒的荒谬性\n\n就像有人可能会小心翼翼地问另一个人：“你知道怎么乘坐民航客机飞行吗？”\n\n“当然知道，”另一人回答，“我只是坐在座位上，系好安全带，飞机就升空了。”\n\
  \n一旦你允许“达成目标只是选择的问题”这一想法进入，你就会开始意识到，在备选空间超市里，顾客的那些担忧是多么荒谬。这只是愿不愿意“拥有”的问题。仅此而已。\n\
  \n##### 强求的陷阱\n\n你可能会陷入为了“拥有”的意愿而与自己斗争的陷阱。无论你做什么，**不要**强迫自己允许自己拥有。**不要**强迫自己描绘目标幻灯片。你不应该需要逼迫自己。不要给自己施加压力或因此紧张，那只会让它再次变成一场战斗。单纯享受拥有激动人心念头的乐趣。放下重要性，结束战斗。战斗一无所获。你之所以继续战斗，是因为你周围的一切都被拔高了重要性。你无法在为你的“日照之地”激烈奋斗的同时，允许自己拥有。\n\
  \n你可能坚定自信，认为你会得到属于你的东西，并热情地说服自己一切取决于个人选择。然而，强行行动意味着制造过剩势能。真正需要的是一种无忧无虑、轻松愉快的决心。\n\
  \n##### 放松掌控\n\n放松，松开控制的死死抓握，仅仅觉知你正在拿取属于你的东西。你不需要鼓起干劲和热情去买份报纸。如果这儿没有你想要的报纸，你就走到别的报摊。松开你的死亡之握。\n\
  \n试图松开抓握反而会让它更紧。任何勤奋或努力只会加剧过剩势能。重要性是努力和强迫性抓握的根本原因。如果你在与抓握对抗，就无法放松它。放弃重要性，抓握自然会松开。\n\
  \n##### 内在意图与外在意图\n\n降低重要性，会将指示意图方向的箭头，从内在意图区移向外在意图区。施加的任何压力都是重要性的结果。当你试图给局势施加压力时，你的行动由内在意图驱动。意志力对于克服障碍至关重要，但正如我们现在知道的，障碍源于重要性。当你降低重要性的那一刻，障碍就会瓦解，意志力也不再被需要。当重要性消失，为达成目标而推一把的需求，就会转化为“拥有”的意愿，随后外在意图便会启动。\n\
  \n##### 选择的权利\n\n你不必赢得选择权。你早已拥有它。如果你觉得自己充满了赢得选择权的果断，准备好失望吧。如果你充满果断和干劲，你依然保持着死亡之握。平衡力会迅速熄灭你闷烧的余炭。而摆动体，一旦感知到你的重要性，会立即试图挑衅你。你亲眼会看到，事情就是这么运作的。\n\
  \n##### 果断与意志\n\n不要让获取超然意志的失败尝试让你担忧或心烦。人们习惯于将能量引导，与其说是朝向目标，不如说是喂养摆动体。最终，你将学会区分果断与意志。拥有的意志，是超然的、无情绪的、要拿取毫无疑问属于你之物的意图。如果说：“我充满果断要从信箱取信”，听起来难道不怪吗？你行使选择权，必须就像从信箱取信那样，冷静、不强求。\n\
  \n生活中人们总要经历考试、测验、比赛、各种个人评估，但拥有的意志只取决于你自己。你是你自己的考官。你给自己的任何分数，通常都反映了要么你认为自己无能、不配，要么目标不切实际。人们出于习惯会自动这么做。你要做的只是允许自己拥有，无论发生别的什么。这当然陌生，但为什么不敢尝试一下，允许自己拥有呢。牛顿和别人的苹果可能落地，但让你的苹果落向天空。你可能拼命想获得拥有的意志，但尽管如此，放弃渴望。别再渴望了；反正你都会得到你需要的。只想着拿取已经属于你的东西。冷静地拿取，不要求、不坚持，心想：“我想要有什么问题？我会拥有它的。”\n\
  \n#### 释放\n\n拥有的意志，由意图的自由能量创造。有两样东西阻碍允许自己拥有。第一是心与理智的冲突。第二是内在与外在重要性的过剩势能，它们消耗自由能量。\n\
  \n认为拥有的意志等同于“我想要、我就能”这种平庸想法，那是错的。实际上，此类想法必须充满意图的能量，否则它们只是理智的喃喃自语，别无其他。念头必须源自心与理智的合一。否则，意图能量的编程就不会纯粹。如果大部分自由能量被过剩势能消耗，意图将毫无力量。\n\
  \n我们在获得意志时经历的困难，类似于一个人第一次骑没有辅助轮的自行车时的顾虑。这个人原则上知道这是可能的，但也知道第一次尝试不会成功。他们怀疑自己的能力，却又充满学习的渴望。他们试图控制学习过程，却不明白该怎么做。三种过剩势能瞬间产生——怀疑、渴望和控制，这三者全都耗尽了意图的能量。\n\
  \n\n\n大脑试图以此方式或彼方式保持平衡，但自行车不断倒下，因为心智与理智之间缺乏足够的统一，也缺乏自由能量。随后会到达一个节点，大脑放松了对控制的把持，那种对维持平衡至关重要的心智与理智的统一随之显现。结果，你突然就能骑行了，尽管大脑根本不知道怎么做到的。但这正是关键所在！大脑总是思考手段，思考应当如何行动。它接管控制权并尝试各种选项。相比之下，理智不思考。它只是毫无保留地愿意拥有。大脑也愿意拥有，但仅限于事情清晰合理的条件下。心智与理智之间的冲突产生于大脑怀疑目标能否现实地达成。只要控制的把持一松开，大脑的限制性条件就会消融，显现出心智与理智的统一。\n\
  \n大脑惊讶地发现：它的控制并非必要，万事万物自行其是地运作着。然而，这一事实足以让大脑接受，哪怕它并不完全理解发生了什么。骑行者能保持平衡，所以大脑接受了这一点。大脑放弃强行实施控制，因为它现在确信这没有必要。经过一点练习，其他的过剩潜能也随之消失，意图的能量随之释放，骑自行车便从一项挑战变成了一种乐趣。\n\
  \n为了获得“愿意拥有”的意志，你必须实现心智与理智的统一，并释放意图的能量。当你通过正确的门踏上通往目标的道路时，心智与理智的统一就达成了。剩下的只是确定你内心深处的渴望是什么，然后踏上道路。通过卸下内在意图与外在意图这无用的重担，你释放了意图的能量，即替代空间中转移的动力。当你拖着内在重要性与外在重要性四处游荡时，你会浪费百分之九十九的能量来维持过剩潜能。如果所有能量都被困在潜能里，你怎能获取自由能量？\n\
  \n为了放下重要性，你需要有意识地采取行动。你需要觉察到你正在给什么赋予过剩的意义，以及这样做的后果。遗憾的是，我们试图在理智层面有意识地放弃重要性，并不总是成功。答案在于采取行动，因为过剩潜能背后的力量会在行动的过程中消散。你采取的行动可以是在脑海中翻转目标幻灯片；想象这个过程，并平静地朝着目标的方向迈出一步又一步。\n\
  \n如何不恐惧？——获取一张安全网。最难克服的过剩潜能是恐惧。你无法强迫自己不害怕。如果生活中某件具有过度重要意义的事物受到威胁，某件你无法割舍的事物，比如你的生命、事业或家园，停止为这个潜能供油的唯一办法，就是寻找掩护、备选方案或替代路径。\n\
  \n如何不担忧或焦虑？——行动。焦虑和恐慌的潜能通过行动得以消散。无谓的担忧会持续困扰你，直到你采取主动行动。你转向的活动类型不一定非要与压力的成因有关。只要你做点什么，你的焦虑就会减轻。\n\
  \n如何不渴望？——接受失败的可能性并行动。消除渴望的潜能与消除恐惧的潜能同样困难，因为完全放弃达到目标的渴望几乎是不可能的。然而，如果你预先接受失败的可能性并寻找替代出路，渴望的潜能至少会变得更平衡。渴望总能转化为行动。渴望是在意图之前的东西。当渴望转化为行动的决心时，注入潜能的能量就会消散。渴望的能量随之流向塑造你的意图。\n\
  \n如何不等待？——行动。根据定义，等待的潜能通过行动得以消散。在行动中消融渴望与期待。\n\n如何放下自我价值感？如果你读懂了这本书迄今为止的内容，这个问题听起来应该有点与之前所说的格格不入。当然，Transurfing（穿越现实/趋势冲浪）鼓励你站起来，接受自己的价值作为一条公理，而不是屈服于个人毫无价值的感觉。难点在于，大脑只有在别人相应地对待你时，才能感知到自己的价值。考虑到这一点，提升你地位的秘诀既简单又奏效。它只要求你放弃那种旨在增强自我价值感的行动倾向。\n\
  \n审视你的行为。当你感到需要维护自我价值感时，你如何反应？无论你的膝跳反应是什么——无论是要求关注和尊重，觉得必须证明自己是对的，感到受辱，表现得防御性强并为自己的行为辩解，陷入冲突，表现得高高在上和傲慢自大，坚持要做领导者，贬低别人并指出他们的短处，还是炫耀自己的优势；无论是什么，其他人都会在潜意识层面捕捉到。\n\
  \n如果你不再自动冲动地去维护自尊，这表明你拥有健康的自我价值感。人们会开始以不同的方式对待你。当大脑看到自己受到更多尊重时，它开始承认自己的价值。当你开始意识到自己的价值时，你周围的人无一例外也会看到它。通过放手，你得到了你原本放弃的东西。\n\
  \n如何不那么容易被激怒？玩摆锤的游戏并打破规则。这是摆脱对不愉快信息做出负面反应这一习惯的唯一途径。你已经知道该怎么做了；你只需要足够快地记起，这只是个游戏，然后以幽默的方式通过做出不恰当的反应来打破规则。当你听到一条好消息时，不要反应冷淡，而要以公开的热情快乐地回应，从而以好运之波的振动频率辐射能量。摆锤会给你制造麻烦，让你失去内在平衡并产生负面能量。通过以不恰当的方式反应，你打乱了摆锤的节奏，让它一无所获。试着这样玩这个游戏。这很有趣。\n\
  \n如何摆脱愧疚感？停止试图为自己辩护。正如我已经说过的，只有你自己把自己留在法庭上受审。你独自扮演着检察官、律师和被告的所有角色，而操纵者利用了这一点。离开法庭。没人能拘留你。那些聚集来旁听的人会坐一会儿，一旦意识到没有被告，就会各自散去。随着时间的推移，你的案子就会结案。这是你摆脱愧疚感的唯一办法。\n\
  \n如何应对怨恨和愤慨？如果你摆脱了愧疚并承认了自己的价值，你就不会体验到这些愤怒情绪。结束战斗，随波逐流。你可能有时会发现，自己正平静地随波逐流，突然有人抓住你，把你逆流拉扯。你该怎么办？\n\
  \n\n\n\n#### 拥有技能的人\n\n拥有技能的人通常能够找到解决其问题的方法，但也存在另一类人，他们只知道寻找问题。他们四处寻找问题，然后得意洋洋地将其呈现出来，仿佛那是某种巨大的成就。他们似乎真心认为别人有义务作为回应提出解决方案。如果你开始尝试为他们寻找解决方案，很快就会被一整群闲散的废人包围。有人会批评，其他人会发现新问题、提出建议，或者掌权并提出要求。无论你多么努力地试图随波逐流，总会有其他人让事情变得更困难。这自然会激起怨恨和愤慨。\n\
  \n##### 应对怨恨与愤慨\n\n如果你无法应对内心产生的怨恨和愤慨，该怎么办？只需允许自己无法应对它。过分强调将重要性降至最低的必要性只会让事情变得更糟。你到底为谁工作？为某个“老板”吗？如果是，你必然会定期体验到怨恨和愤慨的感觉。走上通往你目标的道路，随着时间的推移，当你工作时，你将只为自己工作。在那天到来之前，允许自己偶尔爆发并创造过剩势能。不要给自己施加必须时刻获胜的压力。\n\
  \n##### 纯净意图与行动\n\n与其与你创造的各种过剩势能对抗，不如怀着纯净的意图行动，而意图在行动的过程中、通过运动而得到净化。正如你所见，实现“拥有之意”需要的不仅仅是思辨练习。它需要具体的行动。开始朝着你的目标迈步，以任何你能做到的方式将一只脚放在另一只脚前面。你的行动将在实践过程中变得更有效。\n\
  \n##### “拥有之意”的三个阶段\n\n“拥有之意”有三个阶段。\n\n###### 第一阶段：抑制\n\n第一阶段是由陌生情境引起的抑制：“这一切肯定不可能都是属于我的吧？”当你在脑海中播放目标幻灯片时，你不太能接受这一切都有可能实现这一事实。\n\
  \n###### 第二阶段：欣喜\n\n第二阶段是欣喜，一种接近失重的感觉。会有一个时刻，你将目标接纳进你的舒适区，感觉到束缚感消失。意识到目标其实相当现实，会唤起一种欣喜若狂的感觉。失重感也非常真实，这是由意图的能量从过剩势能中释放出来引起的。这就是你将会感受到的。\n\
  \n###### 第三阶段：平常心\n\n随着时间的推移，“拥有之意”转入其第三阶段：平常心。因为你不断在脑海中反复推演目标幻灯片，你将自己思考进了其内容中，逐渐地，幻灯片中的一切开始变得平常。幻灯片基于重要性的胶卷。只要你还在渴望、怀疑、苦思冥想手段，“拥有之意”就建立在动摇的基础上。一旦重要性消融，“拥有之意”便获得力量。同时，重要的是不要放弃行动之意，即朝着你的目标将一只脚放在另一只脚前面的意图。如果你已经经历了“拥有之意”的所有三个阶段，你无疑走在正确的道路上。\n\
  \n#### 协调意图\n\n最后，如何不在问题的重压下屈服？总会有某种东西让我们或多或少地感到沮丧。要彻底放下所有重要性极其困难，但在“Transurfing”（现实趋避/穿越现实）中有一个非常有趣且强大的方法可以提供帮助——协调意图。\n\
  \n人们通常感觉自己受制于环境，无力改变现状。有时他们走运，在幸运之浪上冲浪一小段时间。有时甚至看起来成功触手可及。你只需果断行动、奋力一搏，然而尽管你竭尽全力，失败却紧随胜利之后。\n\
  \n仿佛人们正走在一条两旁是高山深坑的路上。那些自信且坚定的人偏离平坦大道，莫名其妙地开始攀爬山坡，去追逐摆钟留在那里、诱人闪光的奖品。有时，某人付出难以置信的努力，设法拿到了奖品，但更多时候，尝试是不成功的。一旦发现自己登上山顶，那人就会被平衡力之风吹离双脚，翻滚着跌落回山脚，再次感到无力改变任何事。\n\
  \n然后是虚无主义者，他们相信自己完全无力改变任何事，因此更愿意无力地沉溺于最坏预期的坑洞中。自然，他们最坏的预期会瞬间实现。虚无主义者不仅遭受自身无力的痛苦。在他们幼稚的心态中，他们还以“上帝的旨意成全”的方式将命运交托他人。他们既不随替代空间流动，也不逆流而行；他们只是沉溺于自己的不满中，毒害周围的氛围。他们唯一做得好的事就是实现自己最坏的预期，并从至少在某事上是正确的这一事实中获得快感。他们已将证实自己消极态度的技巧炉火纯青。\n\
  \n这样的人从消极中获得一种施虐受虐式的快感。他们能把极小的土堆说成大山。他们的座右铭是：“生活可憎，且随每一天的流逝而变得更糟”，做出这一选择后，他们在万物中找到了其确证。他们是天生的受难者，因此不断被指责和惩罚；这是殉道者苦涩的命运。他们简直游泳在消极的大海中。为什么？因为消极是他们拥有的、唯一能让世界赞同并与之妥协的东西。他们在最坏预期将得到确证这一保证中找到了力量。\n\
  \n有时虚无主义者会意外地发现自己身处幸运之浪上。一会儿，他们可能真的感到快乐和满足，但这持续不了多久，因为他们无法抗拒四处张望，焦急地寻找他们如此习惯的厄运魔咒。干嘛不呢，毕竟美好终将结束，好运嘛，根本就不正常。这不自然！虚无主义者着手抓住一缕厄运的尾巴，以便回到他们熟悉的沟渠里，那里一切都很糟糕但可预测。他们寻找可以挂靠不满的东西，倾听新闻中的灾难，抱怨、指责、并普遍提出要求。如果提要求不管用，他们就爬进受害者的角色，等着所有人来安抚和抚慰。\n\
  \n要让虚无主义者戒掉在自我折磨中寻找安慰的习惯极其困难。这是一个极端案例。悲剧在于，消极不仅毒害一条生命；通过消极地转化他们自身世界层，虚无主义者将那些与他们最近、层面相交的人拖入他们可怜的地狱。悖论在于，尽管虚无主义者看似无力，实际上，他们拥有一种并将其发挥到极致的力量。虚无主义者的力量在于坚定地信念：生活很糟糕，且随每一天的流逝而变得更糟。坚定的信念无非就是“拥有之意”，这也是为什么虚无主义者的选择能成功转化为物理现实。虚无主义者做出选择，世界便与之相遇。\n\
  \n\n\n\n\n#### 现实的力量与消极心态的根源\n\n在现实中，我们并非无能为力，我们拥有改变生活的力量。消极主义者最坏的预期成真，恰恰证明了每个人都能影响事件的进程，都能决定人生的剧本，不仅是在梦中，在清醒时也是如此。也许只需将消极态度替换为积极态度：“生活美好，且随时光流逝日益精进”。然而，若你采纳此座右铭，便踏上了一段云端之旅。倘若你哪怕片刻动摇，或因恐惧向下窥视，你将瞬间停滞，并从高处坠落。\n\
  \n##### 消极心态的根深蒂固\n\n消极观点之所以根深蒂固，是因为从出生起，一个人就习惯于认为世界在针对他们。出生后不久，巨大的攻击浪潮便向幼小的生命袭来。他们原在母体子宫中安逸、温暖、平静地躺着，突然之间，可怜的孩子被粗暴地挤出舒适的家，听到母亲的尖叫，或许还意识到自己是她痛苦的根源。于是，内疚感的基础便由此奠定。强光刺眼，孩子皱起小脸保护双眼。温润的暖意被刺骨的干冷取代。孩子只想蜷缩成一团，躲避眼前的恐怖，却在此刻脐带被粗鲁切断，与生命之源的唯一联系被无情切断。孩子已历经致命的休克。他们窒息着，尚不知必须呼吸。随之而来的是拍打背部的创伤。空气如刀刃般锐利地切入肺部。呼吸虽痛，孩子别无选择。环境残酷：要么为生存而战，要么走向死亡。纯真无瑕的心灵被迫接受人生第一课：生存之战是生活的一体部分。孩子惊恐、疼痛，更甚者被带离母亲，关入无菌的箱子。精疲力竭的孩子试图在梦境的安全中躲避生活。\n\
  \n这就是我们与外界的初次相遇，充满恐惧、孤独、绝望、怨恨、愤怒与彻底的无力感。这些初识的人生课程，被严厉而不可磨灭地印刻在心灵的白纸上。摆锤入侵心灵的必经之路已然铺就。当下这种令人震惊的分娩方式依然普遍且被视为文明惯例，绝非巧合。鲜少有人意识到，此类出生方式对孩子而言是可怕的休克，在潜意识留下毕生难愈的创伤。动物界没有任何生物在出生时经历过哪怕类似的遭遇。仅在极少数昂贵的诊所，才能确保相对“人性化”的分娩。\n\
  \n##### 其一生的强化\n\n摆锤世界的第一堂严厉课程被充分吸收，并在一生中进一步巩固。总会有时刻，孩子松开母亲的手，怀着快乐、纯真的勇气奔向生活。但摆锤世界让孩子看到生活并非那么安全。突然，“砰”地一声，孩子跌倒了。母亲担心孩子是否被车撞倒。我这么说，只是为了说明消极倾向在我们意识中扎根有多深，而积极主义的美好初衷，往往最终将你带入云端筑起空中楼阁，或耗尽全力去强攻地面的堡垒。\n\
  \n##### 协调的原则：化消极为积极\n\n那么，如何确保自己保持协调，脚踏实地，不陷入坑洼，不攀爬障碍？降低重要性，顺应潮流？正是如此。但这并不容易，因为无法完全摆脱重要性，而白日做梦、渴望控制一切的焦虑心智，阻碍了你顺应潮流。\n\
  \n尽管如此，有一个简单而巧妙的解决方案。你可以利用心智控制一切的倾向，给它一个新游戏。游戏规则是：每当坏事发生，心智必须唤醒，有意识地评估所赋予的重要性程度，继而改变与问题的关系。你的心智定会喜爱这游戏。我们已探讨过游戏原则，它们同幽默地与魔像战斗的原则一致；但这尚非全部。这里我们触及协调的核心原则。**若你遵循此原则，你在实现积极面上的成功程度，将等同于消极主义者实现其最坏预期的程度。**\
  \ 原则如下：**若你选择将剧本中看似消极的变化视为积极，其结果便将是积极的。**\n\n这听起来哪怕不荒谬，也稍显缺乏说服力，不是吗？显而易见的挫折有何积极面？厄运中能寻得何善？然而，这原则每次都奏效，虽听起来怪异。我再次向你保证，我不要求你相信我所描述的原则。只需亲自实验，付诸实践。对于心智，也有合乎逻辑的解释。\n\
  \n##### 二元论与人生分支\n\n你知道，世界建立在二元论原则之上。万物皆有对立面：光与暗、黑与白、积极与消极、满与空等。当你在独木桥上行走向一侧跌落时，身体另一侧的手臂会自动抬起以补偿动作。同样，生命线上的每个事件都有两条潜在实现分支：一条有利，一条不利。每当你面对某个事件，你都在选择与该事件的关系。若你选择将事件视为积极事物，你便站在了生命线的有利分支上。然而，消极倾向导致人表达不满，选择生命线上不利的分支。\n\
  \n从清晨起，人们因微不足道的小事而恼火，随后一件接一件，直到满天阴霾，整天变成持续不断的麻烦轨迹。显然，甚至在小事上，一旦你失去内心平衡，消极场景便演变成戏剧。一件事让你沮丧，下一件随之而来。这就是为何我们说“祸不单行”。麻烦轨迹的延续，不那么源于最初的恼火，而更多源于你对它的态度。模式如何形成，取决于你在岔路口的选择。可能只是微小的恼火让你失态，但无论恼火大小，你已在生命线的不利分支频率上辐射能量。此外，消极态度制造张力势能，耗尽你的意图能量。你的行动变得无效，你绊倒在下一个更大的恼火上。若你持续遵循负面分支的地图，你可想象人生将通向何方。从根本上说，这正是代际更替的推手。\n\
  \n##### 另一种剧本：与魔像共舞\n\n现在设想另一场景。某事激起你的恼火。在冲动地以消极态度、以牡蛎般原始的方式反应前，请稍作停留。对自己说：“停！这只是与魔像的游戏。好啦，魔像，咱们玩！”无论发生何事，保持积极，假装你很高兴。我们拥有“因祸得福”、“否极泰来”这类成语，绝非偶然。\n\
  \n\n\n\n#### 寻找积极面\n\n试着在任何困难或烦人的处境中寻找积极的一面。即使你没能找到任何值得抓住的积极面，也要感到高兴。养成在挫折中欢欣的“愚蠢”习惯。这比对每一个小麻烦感到恼火和抱怨要有趣得多。你会发现，在大多数情况下，你的不便实际上会对你有利。即使不是这种情况，你也可以确信，你的积极态度已经保护你免受其他厄运的侵害，并将你带到了人生轨迹上有利的一个分支。\n\
  \n##### 烦恼的本质\n\n通常而言，烦恼是对常态的偏离。它们之所以让你不悦，仅仅是因为它们代表了对平衡的强烈偏离，并且需要额外的能量消耗。是你自己在制造障碍时提供了能量来源，随后又花费更多的能量去克服它们。相比之下，好运和快乐才是常态。我们通常只有在遭遇剧本偏离时才会感到不满。每当头脑发现偏离了它所接受的剧本，它就会自动以负面的方式感知这种变化，并表达出相应的态度。随后头脑会努力在它的理解中将局势重新纳入掌控。\n\
  \n##### 重写头脑的游戏规则\n\n现在，向你的头脑解释游戏的新规则。告诉头脑它仍然掌握着控制权，但控制的功能现在在于将所有事件感知为积极的。在表演一开始、一天开始时，就开启你的**守护者**。通常你大致知道当天事件该如何展开。当你看到剧本发生变化的那一刻，你必须接受并同意这种变化。你之所以感知某事件为负面，仅仅是因为它不符合你的剧本。假装该事件正是所需要的。\n\
  \n这样你就获得了对剧本变化的一种滑动的、动态的控制要素。不要急于表达不满，也不要仅仅因为剧本引入了持续的变化就试图对抗局势。通过放弃对剧本的控制，控制权会回到你手中——只是这一次，控制旨在顺应备选流而非对抗它。\n\
  \n##### 协调的秘诀\n\n协调的秘诀在于，在放松控制之手的同时，将局势掌握在自己手中。当头脑紧紧攥住控制权不放时，局势就无法与备选流和谐发展。然而，当你把剧本的变化视为常态，你就放下了强加于人的控制感。当你放下控制的需求，你实际上才能够控制自己的态度，进而控制局势本身。\n\
  \n##### 协调原则的威力\n\n归根结底，每个人都想避免麻烦，希望生活万事顺遂。如果你开始实践协调原则，这正是会发生的事情。协调原则甚至比试图用外在意图的力量影响事件更有效。头脑无法完美预判未来的每一步；正如我们已经说过的，你并不孤单于世。你自己的世界层与无数他人的世界层相交，他们不断地向画面中添加自己的东西。然而，头脑不必预先推演未来将发生什么。它只需运行你的目标幻灯片，并遵循协调原则。随后外在意图会成功地将你带向目标。\n\
  \n##### 修习协调\n\n协调是通过练习发展的。仅在智力层面理解协调原则是不够的。你必须不断地发展和完善这种能力。你的**守护者**也必须持续运作。你绝不能对被卷入负面游戏的那一刻视而不见。\n\
  \n协调是在备选空间中移动的最有效手段。你将每个事件都感知为积极的，因此总是移向人生轨迹上有利的分支，并更频繁地遇到好运之波。**切记不可好高骛远**。你不是要漂浮在空中，而是采取有意识的、有目的的行动，使你在乘风破浪时能保持平衡。这正是**Transurfing**的精髓。\n\
  \n#### 苹果落向天空\n\n正如《圣典》所写：“照你的信心，给你成全吧”。这句话蕴含着如此多的真理。你只能得到你愿意接纳的那样多。无论那是何物，外在意图都会无可挑剔地执行你的命令。你拥有你所拥有的，因为它符合你的世界观模板和你对自己在世界中位置的设想。现在你已熟悉**Transurfing**的所有主要原则，你可以根据自己的自由意志来管理命运。你的命运将被塑造为反映你的个人选择和信念。\n\
  \n##### 如何建立真正的信念\n\n你知道如何选择。剩下的只是如何相信这一切的问题。正如我之前所说，在头脑面对事实之前，你无法说服它相信任何事情。然而，头脑擅长假装。它也能产生盲目的、狂热的信念，但这通常是一种基于强烈过剩势能的虚假信念——当夸大的意义被赋予信念时，就会产生这种势能。当头脑沉溺于虚假信念时，它会被自己的狂热震得耳聋，从而无法看见或听见其他任何东西。当头脑钻进它塞入心脏的盒子里时，信念就变成了盲目的。\n\
  \n虚假信念的帆永远不会被外在意图的风鼓满。虚假信念是**摆锤**在不安全感的迷宫中设下的陷阱。当你买入一种虚假信念时，你可能以为自己逃离了迷宫，但这只是幻觉。深处你会被疑虑折磨，但你不会承认它们，因为你筑起了一道信仰的保护墙将它们挡在外面。\n\
  \n###### 辨别真伪信念\n\n如何区分虚假信念与真正的信念？真正的信念不仅仅是信念；它是**知识**。如果你必须说服或劝导自己相信某事，无论你采取何种方式——热情还是强迫——那种信念就是虚假的。知识是由事实塑造的，而非信念。当头脑面对事实时，它只是知道；而虚假信念则由头脑的控制来维持。头脑绝对确保没有一丝疑虑能溜进迷宫里它虚幻的房间。当头脑想要抱有希望时，它拒绝倾听。\n\
  \n当你试图说服自己、试图相信某事时，你就冒着采纳虚假信念的风险。然而，当你开始倾听晨星沙沙作响的声音时，幻象就会显露。放松头脑的控制，将注意力转向对内心哪怕最细微不适迹象的觉察。如果你察觉到一丝不适，就退后一步，停止试图说服自己接受那个想要采纳的想法。当你达到心灵合一的状态时，你将不必说服自己相信任何东西。\n\
  \n###### 肯定语的局限\n\n试图用积极的肯定语来说服自己也是毫无意义的。你感受到的任何疑虑，不会因为对自己重复“我将如愿以偿！”而消失。相反，这只会为疑虑滋长创造肥沃的土壤。无论你怎么努力，心都不会被说服，因为心不懂逻辑，也不懂头脑的语言。它也不用半调子的语气交流。如果你问心：“我能达到目标吗？”，它会回答“能”或“不能”，从不回答“也许”或“大概”。如果心感受到丝毫疑虑的阴影，答案也将是“不能”。\n\
  \n\n\n\n\n#### 当心怀疑虑时，无言可劝\n\n当内心产生怀疑，世上绝无仅有的语言能说服它改变。那该怎么办？答案就藏在上述陈述中：内心不接受“半音调”。怀疑是你对某事“有几分信却不彻底信”时的体验。内心会把“并非完全如此”转化为“绝对不”。它既不相信，也不怀疑；它只单纯地知晓将会发生何事，以及答案是“是”还是“否”。\n\
  \n你必须采取激进的一步：从你的世界观模板中移除“相信”一词，并将其替换为“知道”。如果理智知道某事必将发生，内心会毫无保留地同意。你相信你正拿着这本书吗？不，因为“相信”根本介入不了。你就是**知道**你在拿着它。哪里有“相信”，哪里就永远留有怀疑的空间。\n\
  \n既然你已从心智中移除了“相信”的观念，就允许自己拥有“愿望将达成”的**知晓**；因为法则注定：若有“想要”的意志，且有“行动”的意志去走过正确的门，目标必将触达。这是你的选择。你掌控一切。若决定真正出自你自己，诸如“万一不成怎么办”这类念头将变得无关紧要。\n\
  \n任何事件都只有两种发展路径：要么成，要么不成。试图说服自己“定能成”毫无意义，但当你拥有内心的**知晓**，你就能决定结果。**知识**是自信建立的基石。\n\
  \n仅剩一小步，即如何获得这种**知晓**。要妥善获得**知晓**，你必须习惯它、接纳它。随着时间推移，人们会习惯各种不可思议之事：电话、电视、飞机……我们难道没见过许多曾被认为“绝对不可能”的例子吗？运用**滑行技巧**。在心中怀揣**知识**并守护它，直到外在意图将其化为事实。记住，任务不是说服自己，而是提醒自己：你将达成目标。\n\
  \n每当你思考目标，都会不由自主地被拉回怀疑，关于“如何达成”的念头必然卷土重来。怀疑自然会滋生，但你必须立刻将其从心中钓出，安放到合适位置，用这样的念头取代：“我知道成败取决于我的选择，我已做出选择，为何犹豫？”若能如此，怀疑将逐渐消退。有**知识**而无“相信”，怀疑便无处安身。无需着手消除它们，也无需与其对抗——那必是失败的保证。不过，你可以用这个知识安慰自己：怀疑不一定导致失败，只是路途或许偶尔会颠簸些许。\n\
  \n我想强调，最重要的是时刻铭记：**唯有你自己决定能否达成目标**。每当怀疑升起，就用这个事实提醒自己。我还要再次提醒你注意“遗忘”与“半意识生存”的习惯。新知易忘，旧习深扎。切勿忘记：你掌控自己的命运。\n\
  \n我想耶稣水上行走时，绝不会特别惊讶。对他而言，那定如我们走在地面上般自然。若他人能摆脱与此相关的怀疑、焦虑与情绪，也能水上行走。听起来不可能？可人类整部史，就是一部不断惊世骇俗的链条。譬如曾有人说“铁船绝不会浮在水上，更别提飞上天”。可一旦人们亲见铁船渡海、重型飞机翱翔，便不再纠结这些事“不可能”的概率。\n\
  \n拖着怀疑前行，定会降低成功几率。变量空间中有两条生命线：一条通往目标达成，一条通往失败。当你沉溺怀疑，你便在失败那条生命线的频率上辐射能量，然后几难指望成功。若遭遇失败，将是由你自有念头直接招致的环境所造成。\n\
  \n问题的提法需改变：“会不会发生？”应替换为“我选成功，还是选失败？”习惯这样提问可能很难。你一生都深信苹果落地、而非落天。然而，若你能常在陷入怀疑的瞬间捕捉自己，并提醒自己“成功只是选择问题”，你很快就会习惯。想象从今天起，苹果开始往天上落。初感怪异，继而习惯并接纳。你能说什么？这就是苹果的所为。气球飞向天空，谁会惊讶？\n\
  \n现在醒来，以清醒觉察审视我刚才试图说服你的一切。你是否感觉我将你引入了寻找“相信”的迷宫？若你“相信”了我，便掉入陷阱。别介意，亲爱的读者。我只是想演示心智如何轻易在毫无意义的“相信”迷宫中游荡。我们的漫步始于“你必须迈出关键一步……”接着我们试图用尚未获得的**知识**替代“相信”。然而，这并未改变信仰本质。**摆锤**在争取你的信仰与信任时，做的正是同样的事。\n\
  \n别担心；**Transurfing** 不是心智的陷阱，本书分享的一切远非臆测产物。甚至我们这趟漫步，若你从“希冀获得自由”而非“召唤你相信”的角度思考，也就不再是陷阱。唯有**摆锤**需要他人的信仰。在\
  \ **Transurfing** 语境下，争取他人持有某种信仰，毫无目的。\n\n我的目标不是说服你。我的目标是打破常规世界观的刻板印象与虚假思维模式，助你冲破条件反射的盒子，在“醒着的梦”中醒来。当你醒来，你会意识到：你能主导自己的梦，且无需依赖“相信”。**去行动，你将见证结果。别相信；去验证、去证明。**\
  \ 当你看见 **Transurfing** 真正奏效，你便会单纯地**知道**。\n\n你或许听过：若你对自身力量与胜利抱有坚不可摧的信心，便能成就一切。说“照你的信心成全你吧”容易，但你不禁会想：这信心与坚定信念从何而来？疑虑又如何根除？现实中，你无法避免怀疑，试图获得“相信”徒劳无功。若一丝怀疑潜入内心，任何说服都无法驱逐它。你只能欺骗理智。理智会假装忘记先前的怀疑，但它们仍如旧般活在心底。\n\
  \n\n\n\n#### 放弃绝对的信念，拥抱外在意图\n\n##### 质疑与目标的再调谐\n\n放弃试图获得绝对信念的徒劳尝试。处理疑虑还有一种更现实的方法。不要考虑手段；在脑海中运行目标幻灯片，并朝着目标的方向迈开脚步。这项练习不仅仅是另一种形式的抽象幻想。它包含着对你所传递能量进行调谐的真实工作。毕竟，你最坏的预期都实现了，不是吗？所以要把它变成一项具体的任务：有意识且刻意地将你的能量重新调谐到实现你最好的预期上来。\n\
  \n如果你有目标，但怀疑事情是否会对你有利，你的疑虑就会阻碍你的进步。你无法完全摆脱它们，但也没有必要这样做。头脑寻找信念来帮助它确认目标是现实的。尽管如此，不要考虑手段。把信念扔到一边。活出那幅描绘你生活的幻灯片，仿佛目标已经实现。通过练习这项练习，你在不以信念为燃料的情况下提升能量的质量。从任务中获得快乐，那么外在意图就会发挥作用，苹果将落向天空。\n\
  \n##### 外在意图的运作机制\n\n当头脑面对事实时，苹果落向天空；头脑放弃了控制，允许事实变成现实。局势的发展是否清晰可见并不重要。重要的是目标在头脑中显得现实。我们生活在一个人们骑自行车的世界里。如果我们生在一个人人会飞的世界里，我们也会学会飞。\n\
  \n我已经解释过，当一个人将他们辐射的能量调谐到目标生命线上时，他们就激活了外在意图的运作。你在脑海中翻转目标幻灯片并练习可视化这个过程。当你忙于这些练习时，外在意图的风缓慢而稳定地推动着你世界物质实现的快艇穿越变体空间。机会开始以你从未怀疑过的方式出现。此外，外在意图开始以一种让你更接近目标的方式指导你的行动。\n\
  \n请注意，有时看起来环境似乎以一种怪异的方式展开。然而，你怎么知道哪条路具体通向你的目标？你会指望教一位顶级大厨如何在自己的餐厅里做菜吗？永远记住，头脑无法预见前方的所有举动，因此不可能知道如何实现目标。毕竟，它不可能通过普通手段实现，对吧？我们又在试图钻入普罗克拉斯提斯的刻板印象和错误思维模式的床铺中！把手段和方法的事情留给外在意图。信任变体流。你将以一种让你到达目标的方式行动，而不管你自己的意愿如何。\n\
  \n这就是外在意图的工作方式。如果你现在正穿过泥泞和雨水走向一份你讨厌的工作，但心中却充满对生命的庆祝感，你所经历的所有困难很快就会消失。简单地说，你能量的质量将不再与那个场景的频率相对应。\n\
  \n##### 希望与意识的力量\n\n我用这些话不是要说服你，因为信念的迷宫没有出路。我只是想激发希望。必须有希望，当外在意图向你展示苹果落向天空时，迷宫的墙壁会崩塌。没有这种希望就不可能练习\
  \ Transurfing，如果你没有希望，你也不会开始。当有希望时，头脑感到脚下有坚实的地面，心变得充满活力。\n\n当人们遇到厄运和失望，或面对一个棘手的问题时，他们将能量给了摆锤，结果感到焦虑、精疲力竭和沮丧。人们倾向于要么全神贯注准备与局势抗争，要么完全放弃。这两种立场都不太积极，都会导致压力和抑郁。这些状态里没有平静。内在自信的核心被破坏，人们转向香烟、酒精和毒品等作为出路，却发现自己陷入了新摆锤的束缚中。\n\
  \n如果你醒来并意识到情况最初是如何被创造出来的，你总能在自己内心找到力量。问题是由摆锤创造的，这本身并没有错。危险不在于问题本身，而在于你与它的关系。如果你接受问题的重要性，你就是在把能量给摆锤。重要的是要意识到，在任何困难的情况下，摆锤都要求你要么紧绷并战斗，要么灰心丧气并屈服于绝望。你两者都不能做，但当没有支持、内在自信的力量已失去时，你能做什么？支持在于这种觉知：你知道摆锤正试图让你屈从于它的意志并以你的能量为食。\n\
  \n你可能想知道如此简单的知识如何能提供帮助、鼓舞人心并给予勇气，但它确实可以。希望也是一种知识，即并非一切都失去了，且存在解决方案。理解问题情境如何运作与希望具有同等分量；因为它让你超越了木偶和小纸船的角色。你现在明白了真正发生的事情，你可以有意识地对自己微笑并说：“不，摆锤，你别想染指我的能量。我知道你在追求什么，也知道你如何试图把爪子伸向我。这行不通。你别想让我买账，认定这问题很重要。我有选择的权利，我选择摆脱你”。\n\
  \n##### 过往错误与新目标\n\n每个人在生活中都会犯错，后来会为此后悔。你可能认为你现在离最初的目标太远了，无法使其成真，但没有什么是永远失去的。Transurfing\
  \ 可以帮助把事情拉回正轨。即使你之前的目标从客观上讲现在对你已关闭，你也可以找到一个新目标。每个人都不止一个目标，因此在任何年龄都有设定新目标的机会，且必须抓住这个机会。\n\
  \n过往的错误是你的资本。如果你采取这个立场，你将取得辉煌的成功。每一个取得成功的人都穿过过一整片挫折和失败的森林。“一倒一榜，两倒两榜”以及“失败是成功之母”这种说法里有一粒真理的种子。所有处于成功巅峰的杰出人物都不得不经历生活中的许多困难。只是这方面的生活并没有被特别宣传。所以，如果你犯了大错并遭遇失败，要高兴，因为你已踏上通往成功的必经之路。如果你自责、抱怨和发牢骚，失败就会一次又一次地重复。你认为毫无价值的所有生活经验无疑都将在你的目标生命线上造福你。\n\
  \n当新的希望出现时，冷漠就会消散。无论是动物还是人类，当他们走在沙漠中精疲力竭时，一旦在远处发现绿洲，就会忘记疲惫。想象那只苍蝇在开着的窗户旁撞击窗玻璃。它的一生都被灌输这样的观念：当你看到目标时，应直接飞向它。然而苍蝇看到了目标，却徒劳地撞击着窗玻璃。人们也是一样，当他们不理解如何实现目标时，被剥夺了选择，被迫接受那微不足道的拥有。现在你知道开着的窗户就存在，而且就在附近，即使你还看不见它，你也会有希望，而在有希望的地方，意图的能量被释放出来。\n\
  \n\n\n#### 心灵掌控：通往过去的未来\n\n我们需要希望才能开始行动。开始行动，你就会看到苹果掉向天空。当希望完成了它的使命，你就会意识到选择的自由。那时你会对自己说：我不想要，也不希望。我意图。\n\
