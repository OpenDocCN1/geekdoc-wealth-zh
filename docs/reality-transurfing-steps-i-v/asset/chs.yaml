  #### 能量管理与外在意向


  ##### 能量身体的局限性


  你应该明白，能量身体本身无法保护你免受吸血鬼和钟摆的侵害，因为这些寄生虫通过调整自身频率与你的频率共振来抽取能量。当钟摆试图钩住猎物时，受害者的平衡状态就会被破坏。在此刻，你必须觉醒并降低重要性，才能战胜钟摆。随后，肌肉会放松，你的能量水平将恢复平衡状态，而钟摆将落入虚空。如果你不摇摆，摇摆的钟摆就无法夺取你的能量。有意识的觉知至关重要，它能让你在无意中失去内在平衡的时刻掌握控制权。


  ##### 提升你的能量水平


  提升能量水平并不涉及积累大量的能量储备。这听起来可能有点奇怪，因为我们习惯了诸如“精力不够用”或“精力充沛”之类的常用语。只有生理能量可以被储存。你只需饮食健康、休息充足，能量就会以卡路里的形式储存起来。然而，人体无法储存从宇宙中获取的自由能量。如果一个人的经络足够宽阔，自由能量就会流通；如果经络狭窄，能量流动就会受阻。因此，高能量水平首先取决于经络的宽度。


  自由能量以无限的数量永久存在于场的每一点上。你实际上可以随取随用，取多少由你承受多少决定。你必须学会吸引自由能量，并体验自己作为宇宙一部分的状态；而且这不应只是一次性的行为，而应致力于在能量层面上建立一种与周围世界合一的持续感受。


  人们认为积累巨大的能量储备会让他们变得强大和成功。他们试图积累能量，以此准备用内在意向去影响外部世界。正如你所知，试图用武力改变或征服世界是一项艰难、徒劳、无效的任务，需要耗费巨大的能量。任何在与世界互动时仅依赖内在意向的人都过高估计了自己，因为实际上，我们在茫茫大海中不过是一滴水。


  外在意向不试图改变世界，也不与世界对抗。外在意向只是从生活中选择它所需要的东西。在“变体空间商店”里，外在意向不需要为商品讨价还价，也不需要从店员手中硬夺商品。你不需要积累能量来运用外在意向，因为它极其丰富且无处不在。我们实际上正游泳其中。专注于刻意积累能量，就像在湖中游泳却鼓起腮帮子储存一些水，以防湖水干涸。不要试图积累能量；只需允许它以两股逆向电流的形式自由通过你。想象这两股电流汇聚成逆向喷泉可能会有帮助，但你只需做到这一点即可。


  不要努力成为一个能量团；相反，想象自己是大海中的一滴水。让你的意识感受到它是宇宙不可分割的一部分，与之合一，于是宇宙的全部能量将任你支配。与其在身体里积累能量，不如融入宇宙的能量。扩展你的能量场并将其溶解于周围空间，同时保持觉知：在形式上你是一个独立的粒子。然后，仅用你的小指触碰外在意向，你就能在短时间内实现那些仅凭内在意向的力量永远无法实现的事情。当然我说的是实现你的个人目标，而不是重塑别人面孔的意图；因为眼前的需求只能真正靠内在意向的力量来满足。


  ##### 经络健康与衰老


  如果经络没有受到限制，一个人应该拥有充沛的自由能量。经络面临两大主要限制：身体堵塞和持续压力。如果身体充满毒素，能量就无法自由流动；压力会导致经络进一步变窄。当经络受损时，短暂的能量爆发通常会伴随漫长的恢复期。这使得一个人难以过上充实活跃的生活，只能勉强维持一种按部就班的生存。


  随着年龄增长，人不再发展；生活节奏变缓。经络的运作几乎停止，经络逐渐萎缩。只有当生活要求你将意向驱动到最高强度时，经络才会被激活。当我们为重要目标努力时，我们会刺激意向，从而激活经络；但一旦主要高峰被攻克，意向的门槛就会逐渐降低。时候一到，你晚上（甚至白天）只想瘫在扶手椅上看电视。经络变窄，意向的能量消退，生活变成了负担而非快乐。


  幸运的是，这一切都可以轻松纠正，且不需要强迫意向去征服新的高峰。通过做能量练习可以开发经络。你越能调入中央能量流和微妙身体的感受，积极效果就会越叠加。这种状态有诸多优势。它有助于诱发一种与世界平衡和谐的感觉；它增强你对环境变化的敏感度，让你能轻松随波逐流；它让你接入信息场——一个无限的创造力源泉；它赋予你获取宇宙能量的通道；你辐射和谐的能量，在你周围创造出一个繁荣成功的绿洲。最重要的是，它让你保持在心智交汇的节点上运作，使你更接近外在意向。你驾驭外在意向的能力得到发展，意味着你的愿望能更快、更容易地实现。


