  如果你将注意力集中在下降流上，你的能量中心会下移；反之，如果你集中在上升流上，能量会聚集在身体上部。此外，你的物理重心也会随能量中心移动。你可以在运动中利用这一特性。如果你需要良好的腿部稳定性（如滑雪），可以加强下降流；如果你需要高高跃起，可以练习加强上升流。武术大师对体内能量电流的特性有很好的理解。还有其他类型的能量大师，当他们专注于下降流时，能牢牢固定在某个位置，无法被移动。同样，也有能量大师能专注于上升流，跳到难以想象的高度。




