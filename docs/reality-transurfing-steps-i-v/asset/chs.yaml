  ##### 意图的阶梯


  想象一个普通的新生儿被带入一个衰老缓慢、寿命约三百岁的社会。你认为这个孩子能活多久？我想说的是，从出生起，人们就被灌输标准剧本：健康随年龄恶化，身体枯萎，最终我们都会死，这无疑可以用标准的生理学原因来解释。




  然而，如果你从通航（Transurfing）的视角来看待衰老过程，它实际上不过是另一种诱导的转变。甚至可以说，衰老是我们所经历的最漫长的诱导转变，它缓慢但非常肯定地发生。衰老的剧本如此熟悉和显而易见，以至于没有人会去怀疑它。所有试图改变这个剧本的尝试都被简化为发现各种灵药的过程。即便是当代药理学和遗传学的成果也未能带来切实可见的结果。


  我们只能得出这样的结论：生理因素仅占衰老过程的一部分。诱导转变到底占多少比例无法确定，但这并不重要。关键在于要意识到这种转变的存在。


  从童年起，我们就被说服衰老过程是不可避免的。在人的一生中，他们不断从自身经历和他人经历中获得衰老过程的确认。在每一次生日庆典上，都会以戏剧化的方式表达美好祝愿，呼吁健康与长寿，但大家都知道这些祝愿毫无意义，对剧本没有任何影响。相反，将这些善意的话翻译成事实的语言，它们实际上是在说：你的健康远不如从前，岁月在流逝。这是一种破坏性钟摆的轻微振荡或
  **flirtation（调情）**。


  迟早，你会感觉到十年前你拥有 **far more** 的力量和精力。你会想与他人分享这些想法。那个人会立刻出现，热情地发展谈话话题。如今，疾病话题在礼貌性闲聊中的受欢迎程度毫不逊色于天气。参与此类对话意味着你以与破坏性钟摆相同的频率辐射能量，即你同意参与这个游戏。


  钟摆可能以疲惫或不适的形式向你发出“冲击”。你的状况会让你深感担忧，你会告诉自己：“我肯定生病了。”这是你对钟摆摆动的反应。在获得一阵能量后，钟摆又会再次冲击你，使伤痛加剧。你去看医生，医生确认了你的疾病，而过程仍在继续。钟摆获得能量并摆动得更厉害。当危机爆发时，钟摆已经夺走了它所能夺走的一切，只留下你独自开始康复——当然，前提是诱导转变没有把“受害者”推到一条无效的人生线路上。


  这意味着你应该不去看医生、不吃药、拒绝所有帮助来应对疾病吗？不。拒绝一种已发展到晚期疾病的可能治愈方法是 **irresponsible（不负责任的）** 和
  **reckless（鲁莽的）**，当然也不是摆脱游戏的途径。问题在于如何首先避免被这个游戏吸引。


  你可能会对同事说：“好久不见，你最近怎么没来上班？”，而同事肯定会回答：“我生病了。”注意，他们不会说自己是在康复，而是说自己生病了。当被问到“什么地方不对？”时，回答会是：“我生病了。”当然，用“我（曾经）在康复”来回答这些问题会显得非常不自然。人们已经如此习惯于玩“疾病游戏”，以至于康复被视为游戏的一个属性或副作用，而不是一个独立的目标。


  钟摆的游戏始于你 **willingly accepting（自愿接受）** 疾病的症状，换句话说，就是紧抓着诱导转变螺旋的一端不放。如果你不认真对待症状，悄然转身并立刻忘记它们，钟摆的第一次推动就可以被击败。如果这不起作用，你仍然可以通过采取基本的预防措施来平息钟摆的
  **sway（摆动）**。如果你确实生病了，请玩“治疗游戏”，而不是“疾病游戏”。


  玩“疾病游戏”意味着被动地受苦，参与各种疾病的讨论，唠叨、抱怨、任性地索取周围人的关怀和同情；将你的不适视为不可或缺的属性；像一个必须不断被呵护的孩子一样炫耀你的健康状况不佳；以及热衷于搜集与各种疾病相关的信息。


  玩“治愈游戏”意味着积极关注可能的治疗方法，努力过健康的生活方式，用幽默对待你的疾病，并将注意力集中在改善你的感觉上，努力朝着健康迈进，并与志同道合的人交流。


  你可以看到，这两种游戏完全不同。在疾病游戏中，你以被动受害者的角色参与，以破坏性钟摆的频率辐射能量。诱导转变的漩涡不断将你拉向其中心。而在治愈游戏中，你作为自己生活的主动创造者和主人参与，主宰自己的命运，从而转向健康的人生线路。


  如果你已经在尝试玩“治愈游戏”，请问自己：你是否真的足够诚恳地在玩它？问题在于，太容易自我欺骗了。你可能在脑海中知道自己应该过健康的生活方式，戒掉坏习惯，增加身体锻炼，多吃健康食物等，但实际上，旧习惯很难改。你试图遵循健康生活方式的规则，因为你知道这对你有好处，但最终，懒惰介入，你只是提不起劲。


  这就不是一个纯净的游戏。这就是“我生病了，他们会让我好起来”的游戏。在能量层面上，这个游戏与“疾病游戏”没有区别，因为你是在被迫的状态下进行治疗，而不是出于个人信念。当意图既不纯粹也不真诚时，结果必然相同。


  较弱性别代表者（通常指女性）为减肥所做的尝试，是一个被玷污游戏的完美说明。她们通过节食折磨自己，强迫自己做不愿意做的事情来减重（“我生病了，但他们会让我好起来”）。她们厌恶自己的体重和体型——而正如你所知，这正是让你以某种频率辐射能量的完美条件，在这种频率下，她们的体重和体型将恰好符合她们当前的感觉。女性实际上并不喜欢自己的节食。她们宁愿吃自己平时吃的食物。如果你正在玩这个游戏，请放弃自我胁迫。最好的情况下，它只会带来暂时的、微小的效果。自我胁迫会吓到潜意识，使其产生抵抗。最终，潜意识会按自己的方式行事，所以你可以预期：放弃节食，反而增重比之前更多。


  唯一值得得出的结论是：如果你想要健康和美丽，你必须改变自己的生活方式。这意味着摆脱旧习惯，培养新习惯——不是出于必要，而是出于信念。你必须拥有强烈的动机和意图，并且你的意图必须纯粹。如果你仍然照旧，你就无法以健康人生线路的频率辐射能量，也无法转向这些人生线路。改变生活方式并不像看起来那么困难。改变旧习惯是意图和时间的问题，而且不需要太多时间。选择权在于你。


  ###### 疾病钟摆


  每个人在生命中的某个阶段都经历过疾病。生病通常会带来一堆问题和焦虑，使人容易产生消极思想和情绪。这种能量随后会通过你的个人空间散发出去，为与钟摆相关的疾病提供滋生土壤——这些疾病能够高效地吸收负能量。





  ##### Pendulums Generated by Illness


  Pendulums generated by illness belong to the most powerful category of all pendulums.
  They are primarily the illnesses and epidemics themselves, as well as the various
  pendulums of the medical field opposing them. One can imagine the sheer number of
  influential structures these encompass: entire clinics, sanatoriums, research institutes,
  factories, pharmacies, educational institutions...


  Medical pendulums proclaim their goal to be the fight against illness. In practice,
  this struggle generates a multitude of negative phenomena characteristic of destructive
  pendulums, because their core idea remains retaining existing followers and attracting
  new ones.


  For example, classical medicine maintains a hostile attitude toward all traditional
  therapies (i.e., any methods not belonging to its system). Any criticism from followers
  of alternative medicine regarding outdated or erroneous views is automatically dismissed
  as "unscientific." Any new-age therapy encounters extreme cynicism. Conversely,
  followers of alternative medicine, given the chance, are never stingy about throwing
  a stone into the garden of orthodox medicine.


  Anyone controlled by the lever of an illness pendulum or a medical pendulum cannot
  reclaim the feeling of youth, or that period in life when health issues were entirely
  out of consideration. If your health isn''t causing you trouble, you simply don''t
  think about it, and therefore your energy lacks the frequency characteristic of
  the illness pendulum.


  To varying degrees, everyone becomes more susceptible to pendulum influence with
  age. Once you begin radiating energy at the pendulum''s frequency, you lose energy
  and develop a dependency, which drives you to transition to a life line saturated
  with illness. To restore your original state of health, you must sever ties with
  all pendulums. The method of severing ties is: block out any information generated
  by the illness pendulum and refuse to participate in their game, i.e., employ the
  **defeating the pendulum** method. If you are severely ill, you should play the
  **healing game**, take care of your whole body, i.e., employ the **stilling the
  pendulum''s swing** method.


  Every day, pharmaceutical advertisements display happy people maintaining their
  health through a certain drug, achieving extreme success in all areas of life thanks
  to their health. This is a tempting carrot that works infallibly because, as we
  have discussed, most people live in a semi-conscious state. Your brain is programmed:
  "Go to the pharmacy, take the pill, get the reward: everything is in perfect order."
  But that is only the mildest part. An even deeper, more insidious program is implanted
  in the advertising.


  Think about it: the people in the ads are usually normal, charming, thoroughly successful.
  (Are they really better than you?) These people all have health problems, but they
  recover quickly thanks to the pills they take. (Just like you!) Our conscious and
  subconscious minds are instilled with the idea: we are either prone to illness,
  or already ill, or will fall ill soon; most people accept these rules of the game.
  This is the true face of the destructive pendulum, not the proclaimed one. Its true
  task is not to heal the individual, but to claim them as a follower, successfully
  instilling the notion that "they are sick, therefore they must take pills."


  Another peculiar method of attracting followers is the adverse weather forecast.
  The core of the forecast consists of information on unfavorable factors such as
  magnetic storms and atmospheric pressure fluctuations. (Note: these phenomena actually
  occur to some degree almost every day.) Based on this data, a prognosis is formed,
  detailing which health problems will be most affected by the weather, who will suffer
  particularly on the current or following day. At first, it seems almost comical
  to hear the pendulum list diseases and their inevitable consequences for patients
  with a kind of choking enthusiasm; then one realizes with eerie unease what a terrible
  destructive thought pattern is being implanted into the minds of both the sick and
  the healthy. Hearing such a negative prognosis, one might feel it''s best not to
  leave the house, to simply prepare to crawl into one''s grave. While the influence
  of adverse factors on health is natural, why create the expectation of it from the
  outset? Many people, especially the elderly, believing the pendulum''s outpouring,
  pre-program themselves for pain and exacerbation, as if already sentenced to suffer.
  The weather forecast and its health prognosis perfectly illustrate the pendulum''s
  brazen and cynical attempt to subjugate people to its will.


  A most classic topic is the idle chatter about health with relatives and friends.
  Usually, the conversation focuses not on strengthening the body, but revolves around
  illnesses and medications. One person enthusiastically describes various ailments,
  another chimes in agreeably, "It''s all just a matter of age." Participants in such
  conversations actively radiate energy at the frequency of the illness pendulum;
  their energy is contagious like a pathogen. Avoid such socializing, or the frequency
  of illness will arrive unexpectedly.


  Recognizing the illness pendulum is easy. It lures you with information about various
  diseases and their treatments. If you decide to ignore the information and let it
  pass by without taking it seriously, the pendulum gets discouraged and leaves. That
  is its **defeat**. If you respond with healthy laughter and mock it a couple of
  times, the pendulum flees in terror in the opposite direction. That is **stilling
  the pendulum''s swing**.


  Breaking away from the illness pendulum makes you completely free, but the freedom
  will not last long. Human nature tends to become a follower of some pendulum; sooner
  or later you will again face the risk of falling under its illness influence. To
  protect yourself, you must escape the intermediate state you might fall into after
  aligning with the rehabilitation pendulum (which governs all matters of strengthening
  body and mind). Become a follower of a healthy lifestyle, and you will find it far
  more joyful and exciting than the tedious, heavy struggle with illness.


  Obviously, if a person consistently takes good care of themselves, they will radiate
  energy at the frequency of the healthy life line, too busy to even bother with illness.
  We see two diametrically opposed ways of life: one based on curing illness, one
  based on cultivating health. Obviously, regarding poor health, the former concerns
  internal intention, the latter external intention. Which life you will live is entirely
  your own choice.


