- '## 前言


  现实趋避法是一种管理现实的强大技术。应用它——生活将开始在**你的**掌控下发生改变。使用趋避法时，目标不是去“达到”，而是在很大程度上自我“实现”。这令人难以置信，但仅仅是乍一看如此。书中提出的观点已获得实践验证。尝试过趋避法的人都感到惊讶，甚至欣喜若狂。趋避者周围的世界在我们眼前不可思议地发生着变化。






