- '### 第十六章 与阴影共舞


  ![74157.jpg](img/00033.jpeg)


  我的世界和我去散步。


  #### 意图的起源


  人们与外部世界关系的一个典型特征是，任何新事物最终都会被视为平常之物。如天空中的云，现实不断改变外观，但变化速度太慢，我们无法察觉。物质实现穿越替代空间的运动，如同云的形成运动。只有将其拍成胶片并加速播放，我们才能感知。


  即使照亮生活的短暂变化的新鲜感，也会同样迅速地变得迟钝。非同寻常变成寻常，盛宴的喜悦消融进日常惯例。生活变得枯燥……






  ##### 摘要


  正如一个反问句所问：什么是无聊？很难给出一个全面且易懂的无聊定义。描述如何对抗无聊会更容易一些。为了在日常生活的单调中生存下去，心灵和思想创造出各种玩具和游戏，帮助我们体验新奇事物。玩具是治疗无聊的良药，而游戏则是更好的良药。


  除溜冰外，捉迷藏、追逐游戏等极其有趣且广受欢迎。随着年龄增长，人们想出更复杂的娱乐方式，从体育竞赛到虚拟现实。许多职业本质上无非就是一种游戏。


  为什么说“许多”？试着说出一个不能被视为游戏的职业。无论一个人做什么，实际上都在玩耍。成年人以优越感称孩子的行为为游戏，但成年人也在玩耍。只是他们自命不凡地将自己的“玩耍”称为工作。


  双方都以非常负责的态度对待自己的活动。问孩子在做什么，他们会非常严肃、甚至认真地回答：“我在玩！”试着分散成年人的工作注意力，他们会愤愤不平地回应：“我在做重要的事。”


  所以游戏是一件严肃的事。孩子不玩游戏时做什么？通常只是胡闹。大人呢？他们赖着不动；这正是成年人所谓的“无所事事”。但无所事事很快就会变得无聊，于是你想玩个新游戏。


  那么我们为什么需要游戏？仅仅是为了缓解生活的无聊吗？换个问法：是什么导致无聊？刺激不足？


  这个问题并不像看起来那么微不足道。我们对游戏和玩耍的热情基础，古老如我们生存的世界。生物的根本需求是什么？生存和自我保存本能？这是公认的刻板印象，但不是正确答案。是繁衍欲望？也不是。那是什么呢？


  首要需求是能够独立管理自己的生活。这是所有生物行为的根本原则。其他一切，包括生存和繁衍本能，都是这一主导原则的后果。换言之，所有生物的目标和目的都是控制自己的现实。


  然而，如果外部世界独立于你存在，且以完全不可控甚至敌对的方式运行，就无法控制现实。总会有别人想偷你的食物、赶你出舒适的角落，甚至把你作为下一顿美餐吞噬。当你无法选择如何生活，感觉生活只是发生在你身上而你无能为力时，这很难、甚至可怕。这滋生了控制周围世界的执着且有时是无意识的渴望。


  这一结论会让许多人惊讶：“一直以来显然生存本能是首要的，现在你却说它其实只是更根本事物的后果？”


  乍看奇怪，细思之下，生物从事的任何活动（包括生存和繁衍）归根结底都是试图将世界的现实纳入掌控。这是生物活动背后所有意图的关键动机和主要起源。


  不活动即缺乏控制。因此，无聊本身并不存在。存在的是对控制自己现实、以某种方式将其置于自己意志之下的持续且永不满足的渴望。从这个意义上说，游戏是一种建模可控现实的方式。


  例如，某些鸟类喜欢玩松果。松果是独立、不可控现实的一个碎片。鸟一旦将松果纳入游戏，那个碎片乃至一定程度上的现实本身就变得可控了。


  溜冰或滑行也是一种控制。现实带着我前行，但方向由我决定。在某种程度上，任何其他类型的游戏遵循同一规则：“按我意愿行事”。游戏脚本或多或少是预设的，使局面相当可预测。当然也有更难主导的游戏，但所有游戏基本都可归结为同一件事：凭意志控制发生的一切。


  对观察者而言，任何可见的景象都代表一种游戏，它模拟对现实的控制。音乐、书籍、电影和表演都是心灵的秋千。紧绷思绪的疲惫洪流停止，化作在优雅旋律或扣人心弦故事翅膀上的飞翔。电影主角遭遇何事无关紧要，我们看到的是被驯服、训练过的现实版本，因此观察者能放松并享受表演。


  我们与现实玩耍的游戏永不停止，甚至在睡眠中也继续。心灵在梦境世界中取乐，在那里现实被微妙地塑造成意图的轻柔气息。


  最后，想象游戏是另一种塑造现实的可接受方式。一个人甚至会编造一个尚不存在的现实，只为玩一把掌控感。科幻小说很特别。只要它不真实、远离我们的生活，它就保持特别。现实因临近而平常，却因难以影响而保持着不可及的特质。


  总体而言，这些游戏并非在对抗无聊中编造出来的。日常现实不无聊；它因不可控而平庸。很难让日常现实遵循“按我意愿行事”这一规则。因此作为人类，我们努力躲进游戏里，在那里一切简单且可预测。


  尽管如此，无法躲避现实的必然性。任何个体的生活都受其环境和社会地位制约。现实多半不以个人意志为转移。每个“我想要”似乎都对应一个“你做不到”；每个“给我”都会听到“你得不到”。在这些条件下该怎么办？


  通常人们的行为相当直白。为得到想要的东西，他们试按“给我”的原则以线性、直接的方式影响环境。基于即时接触的直接影响是一种控制形式。但它不是唯一形式，且远非最高效。


  我们将换种方式。我们将双手藏在身后，让世界来半路迎合我们的欲望。接下来的一切都将关联如何做到这一点。`Transurfing` 是一种无需直接冲击即可控制现实的技术——不是像游戏那样为了取乐，而是为了真实。


  #### 糟糕运气法则


  为了学会控制现实，你至少必须理解现实是如何被创造的。每个个体都是自己世界层面的直接创造者，但大多数人不理解这个过程如何运作。


  人们试图让一切“变成我要的样子”，并将这条直截了当的原则套用到外部世界。“我转向哪个方向就朝哪个方向走”、“我按哪里哪里就塌陷”。但不知为何世界不愿服从，当你向一侧转，却发现自己朝相反方向走去。


  这让人深思。如果现实表现得如此古怪，或许我们塑造它的尝试需要不同的方法？或许现实并不按我们以为的法则运行？但人们不愿停下环顾、自问这些问题。相反，他们固执地坚持要按自己的方式行事。





  ##### 现实的扭曲与过剩潜能


  由于这种固执的“创造力”，人的个体层被创建出来，其中没有任何东西是“按我想要的方式存在的”。现实显得陌生、反复无常且强硬。


  有时你会感觉世界是在故意与你作对。仿佛问题和不想要的事件被某种不可解释的力量吸引过来。我们的恐惧变成了现实，最坏的预期得到了验证。我们不断被那些我们厌恶并想要避免的事物穷追不舍。那么，为什么会这样？


  在初学者的 Transurfing 课程中，我们已经讨论过为什么你经常“得到你不想要的东西”，特别是当厌恶感强烈时。当你全心全意地憎恨或恐惧某样东西时，外在意图会将它大量地送达给你。


  源于心智合一的思维能量体现了现实中的潜能。换句话说，如果内心的感受与头脑的思想合一，与你的思维能量特质相对应的替代空间领域将会流入物理现实。


  然而，这并不是我们最坏的预期实现的唯一原因。生活本应没有问题。那是常态。如果你不破坏平衡，顺应替代流，一切都应该非常顺利地展开。自然不喜欢浪费能量，也没有打算花费能量来密谋对付我们。


  不想要的环境和事件是由于过剩潜能在周围能量场中造成的扭曲而发生的，而依赖关系使情况变得更加恶化。


  当过度的意义被赋予某个特定品质时，过剩潜能就会出现。当人们开始拿自己与他人比较、对比，并给关系附加条件时（例如“如果你要那样，那我就要这样”），依赖关系就被创建了。


  当做出扭曲的评价时产生的过剩潜能，只要它仅相对于自身存在，就不会产生严重影响。然而，一旦对某一对象的夸大评价被置于与另一对象的比较关系中，极化就会发生，从而产生平衡力之风。


  平衡力致力于消除已发生的极化，它们的行动主要针对最初制造极化的个体。


  以下是非相对性潜能的例子：我爱你；我爱我自己；我恨你；我不喜欢我自己：我是个好人；你是个坏人。这些评价是自足的，因为它们不基于比较或对比。


  然而，以下是基于依赖关系的潜能例子：我爱你，条件是你爱我；我爱我自己，因为我比你们其他人都强；你是个坏人，因为我比你更好；我是个好人，因为你是个坏人；我不喜欢我自己，因为我没有别人有吸引力；我被你排斥，因为你和我不一样。


  第一组评价和第二组评价有巨大的区别。基于比较原则的评价产生极化。平衡力通过将相反的价值聚集在一起来消除异质性，就像两块磁铁的异极相互吸引一样。


  这就是为什么问题仿佛故意地、纠缠不休地闯入我们的生活。例如，已婚夫妇往往由两个看似完全不相容的性格组成，仿佛是对方必须承受的惩罚。在各种类型的群体中，总会至少有一个人让你的生活变得困难。墨菲定律，或者我们称之为“倒霉定律”，属于同一性质。而忍受讨厌的邻居似乎成了任何形式的紧密居住的必要条件。


  讨厌邻居的例子完美地说明了极化效应。尽管这个问题看似世俗，但它直接与形而上学领域相关。问题在于有些人阻止其他人继续他们的生活。但为什么？因为无论你在哪里，总会有“不好”的老太太和老头子，不让其他“好”人安生？


  所以我们得出结论，人们真的可以被分成两类吗？然而，如果你进行一项调查，问人们他们认为自己属于哪一类，只有极少数人会承认自己属于“坏”那一类。总的来说，你的邻居和你一样。


  歧视的倾向是由吹向你厌恶方向的平衡力之风造成的。风向的决定遵循那个同样的旧原则——“倒霉定律：你会经历任何你不喜欢的东西”。


  有人可能会抗议：“这与平衡力无关。有些人就是没有良知。为此进行哲学思考毫无意义”。我现在将向你证明，这些情况比复杂的推测更有深度。


  假设你的邻居在烦扰你。你也烦扰他们吗？可能不会，但为什么？“因为他们是这样那样，基本上是坏人，而我们是这样”，你会说。然而没有好人和坏人之分。任何判断都是相对的，因为它是由比较和对比产生的。


  那么，为什么你不烦扰你的邻居？我的回答可能会让你吃惊：你不烦扰邻居的原因是因为他们根本不在乎你。“正是如此”，你会说，“因为他们是坏人，没有羞耻心。”


  怀着这种对待邻居的态度，你开启了极化，就像一个电磁铁，会吸引越来越多与邻居相关的问题。对他们来说，这全像水滴在鸭背上，因为你对他们毫无兴趣。他们根本不会想到看你一眼并做比较歧视，即与你建立依赖关系。正是在这个意义上，他们不在乎你。他们不给你的存在附加任何重要性，也不允许你进入他们世界的层，因此他们没有与你相连的痛苦。


  当你的邻居忙于自己的生活、不关注你时，他们在与你的关系中不经历任何极化。然而，如果他们开始重视你的邻里存在，开始拿自己与你比较，会立刻发现你和他们不一样。如果这让他们烦恼或触动痛处，你无疑会开始烦扰他们，你将不再是一个好邻居，而变成一个坏邻居。


  情况会以更意想不到的方式发展。你将开始为邻居制造你做梦也想不到可能会困扰任何人的麻烦。你将开始在不知不觉中烦扰你的邻居，就像他们现在不知道自己在烦扰你一样。


  例如，合租房子时噪音污染是头号问题。你越讨厌噪音，它就会越强烈地追着你，尽管安静才是共同居住的理想状态，这不仅对你，对你的邻居也是如此。那样消耗的能量更少。任何对安静的干扰总是一种异常，不会无缘无故产生。那么，能量从何而来？





  #### Everything Happens "Deliberately"


  Noise from neighbors or roommates throws you off balance, and you begin to secretly
  (or openly) hate them. Your irritation becomes the energy source for the situation,
  establishing a dependency that gives rise to polarization. Intense, aggressive emotions
  like "I hate these noisy neighbors" form a powerful magnet attracting an endless
  stream of new, annoying provocations.


  New neighbors move in who just happen to love making noise, while old neighbors
  or roommates seem to buy new audio equipment specifically to spite you.


  You should also realize that the neighbors'' neighbors are pushing the situation
  along too; if everyone shares the same feeling about the noisy neighbors, the effect
  is amplified.


  Of course, neighbors aren''t just about noise. The key is what you feel aversion
  toward. They might flood you with garbage, suffocate you with foul odors, graffiti
  the hallway walls, etc. Disliking the "species" of neighbors as a whole can attract
  even more tangible consequences—like floods or fires.


  In any other situation, this "Sod''s Law" operates the same way. Objects or qualities
  endowed with excessive meaning attract objects with opposite qualities.


  Meaning is strengthened by contrast and opposition. Where there is one pole, the
  other is not far behind. Polarization creates problem magnets that attract everything
  you dislike. Whatever annoys you sticks to you; the most unwanted things all happen.
  There is nothing mystical about this; it is perfectly natural.


  Polarization distorts the energy field distribution, generating vortices of balancing
  forces that cause the reality mirror to warp like a curved mirror. Few people understand:
  any deformation is a consequence of broken balance; yet people try to fight the
  external world instead of eliminating the polarization effect.


  You simply need to follow the core rule of Transurfing: be yourself and let others
  be themselves. You must release your attachment and give the world the freedom to
  rule itself.


  The more you insist on your desires and rights, the stronger the magnet''s pull
  on the opposite pole. As an analogy, it is as if you are strangling the world, and
  the world fights desperately to resist and break free.


  Trying to pressure the situation or insist on your own way is futile and only worsens
  matters. Conversely, according to the laws of Transurfing, consciously change your
  relationship to the situation.


  For example, try forgetting the neighbors even temporarily, stop judging them, pretend
  they simply don''t exist. Say to yourself: "To hell with them!" Remove the neighbors
  from the level of your world.


  Once you remove the "suction cups" of the relationship, the neighbors'' polarization
  disappears, and they gradually cease to bother you. If you can break the dependency
  completely, you might even clear space for the incredible to happen: the toxic neighbor
  could turn into your best friend!


  ##### Why Does "Sod''s Law" Exist


  Find it strange? Why does Sod''s Law (Murphy''s Law) exist? Why is the world so
  cruel? Or is it not cruel, and Sod''s Law is merely conjecture and prejudice? Whatever
  the case, Sod''s Law exists as a definite tendency. Fortunately, the Transurfing
  model not only reveals its causes but also explains how to avoid falling into this
  depressing phenomenon.


  The laws of Transurfing have been proven time and again to free followers from all
  kinds of originally inexplicable problems. You just need to let go of the grip of
  control, stop "strangling the world," and life instantly becomes friendly and smooth.


  If you don''t "let go," you wander like a magnet attracting everything opposite.
  And it''s not just Sod''s Law. The collision of opposites generates conflict, and
  the situation escalates further.


  The Law of Unity and Struggle of Opposites (Law of Dialectics) is well known; its
  essence is embodied in its name. The Volga flows into the Caspian Sea, the Mississippi
  into the Gulf of Mexico. But it''s not that simple. Ask yourself first: why does
  this law exist?


  We have already explained why the unity of opposites is everywhere: balancing forces
  pull opposites together to restore equilibrium. But this doesn''t explain why opposing
  forces remain in a state of constant conflict.


  Logic would dictate the opposite: two opposites collide, neutralize, and calm down.
  But the fact is, opposing forces continuously provoke each other until they "come
  to blows." If not separated, they will fight forever.


  Examples are at hand. You will admit the world annoys you from time to time. Of
  course, the ways and degrees vary, but the essence is the same: once something throws
  you off balance, it always seems "specially" aimed at you.


  The process goes like this. You worry and fret over something, your nerves tense
  even slightly. Immediately, as if inevitably, a "clown" appears, jumping around
  and deliberately poking your raw nerves. You get angry, and the clown jumps even
  more joyfully.


  Many things tweak our nerves, making us increasingly irritable. When you''re in
  a hurry and afraid of being late, the clown applauds and shouts "Okay, let''s go!"


  From then on, everything seems to be against you. Crowds block the way or stroll
  slowly so you can''t pass. You need to go through a door, but the world''s laziest
  people are lined up in front of it, shuffling their feet with difficulty. Traffic
  is the same, as if all drivers secretly conspired against you.


  Some of this can be attributed to perception: when rushing, the world seems impossibly
  slow. But there are more obvious signs. Elevators or cars break down, buses are
  late, massive traffic jams. These bear a more malicious objectivity.


  Other examples can be cited. When you are stressed and anxious, people around you
  do exactly the things you find annoying, and right when you want to be alone.


  Children suddenly run wild, though they were quiet before. Someone nearby slurps
  and swallows loudly. All sorts of people get under your feet and pester you with
  troubles. Obstacles everywhere. You want to see someone, and they keep you waiting;
  you don''t want to see anyone, and someone shows up uninvited, and so on.


  External pressure escalates in proportion to the intensity of your irritation. The
  more tense you are, the more actively others annoy you. Interestingly, people are
  not doing it on purpose. They don''t even realize their behavior might annoy someone.


  There are many gray areas in subconscious psychology. As strange as it seems, people
  are largely driven by subconscious motives. Even stranger is that the driving force
  creating these subconscious motives originates outside the human psyche.






  尽管这种力量看不见摸不着，但它由真实的信息能量实体组生而成——这些实体诞生于生命体的思想能量之中，被称为“摆”。在《Transurfing》（意译：《现实趋避》/《空间变奏》）系列的第一部中，已经详细论述了摆的概念。凡是存在冲突能量潜力的地方，摆必然存在。


  认为这些实体能够密谋策划，或能将有意识的意念变为物理现实，那将是一个错误。就像水蛭一样，摆将极化感知为能量场中的异常，并试图以此为食。这本身并没有什么特别错的地方。


  噩梦在于：摆不仅吞噬冲突能量，还以某种方式让人们表现得会释放出更多此类能量。


  为了确保能量源源不断地充沛流动，摆会不择手段。摆用无形的丝线牵引着人们，而人们就像木偶一样顺从。摆究竟如何影响人们的动机尚不清楚，但它们在这方面极其擅长。


