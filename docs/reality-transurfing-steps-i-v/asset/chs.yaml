- '### 第十一章 能量


  ![05_7_2.tif](img/00022.jpeg)


  ![74143.jpg](img/00023.jpeg)


  你不必为健康而战，也不必储存能量。只需让它流入。


  #### 能量层级


  要有效地实践 Transurfing（空间穿梭/变现术），你必须处于良好的健康状态，并拥有相对强大的能量场。你可能认为你的健康状况已经不错了，但并不真正知道什么是真正的健康感。如果你早上起床很吃力，不想去上班或上大学；如果你午餐后感到迟钝，直打瞌睡，晚上只想瘫在电视机前，你就不能说自己健康。如果这描述了你的生活方式，你的能量层级显然仅足以维持一种平淡的生存。


  通过夺回原本消耗在过度潜能和摆动器负担上的活力，你已经获得了额外的能量。然而，能量永远不嫌多，因此在本章后面我将介绍一些建议，帮助你进一步提升能量层级。


  我们这里所说的“能量层级”，是指吸收和利用能量的能力。人体内基本上存在两种形式的能量：生理能量和自由能量。生理能量通过消化系统获取。自由能量是流经人体的宇宙能量。两者共同构成了我们的能量体。人体能量既消耗于维持各项生理机能，也向周围空间辐射。


  世界上存在无限的宇宙能量供应，但作为人类，我们只能吸收极小一部分。它以两个方向流经身体。第一股电流向上流动，在男性脊柱前一英寸处，在女性脊柱前两英寸处运行。第二股电流向下流动，紧贴脊柱运行。一个人拥有多少自由能量，取决于其中央经脉的宽度。经脉越宽，一个人的能量层级就越高。


  经络系统早已被发现。我们这里不打算深入详述人体能量体的结构。如果你对这个话题感兴趣，有大量相关文献可供参考。人体周围的能量循环是一个相对复杂的过程，但这不应让你过分担忧。为我们的目的而言，专注于这两条中央经脉就足够了。


  由于某处出现了“阻塞”和“漏洞”，导致正常能量流动受阻，这可能表现为身体疾病。反之亦然。受疾病影响的内脏器官也会扭曲能量体的整体图景。很难明确区分：究竟是生理症状（如体内毒素）导致了能量流动问题，还是能量流动紊乱导致了生理机能失调。针灸、按压疗法及其他许多方法，均可帮助恢复体内正常的能量循环，治愈因能量流动不畅引起的疾病。然而，这些方法只能保证短期效果。要维持良好的健康状态，必须同时照顾物质身体和微妙身体。


  人体能量层级与身体肌肉状况密切相关。肌肉紧张阻碍了无形电流的正常流动，干扰了能量在能量场中的传输。一个紧张的人走进一个放松的群体，不发一语就能改变群体的整体情绪：紧张感似乎就悬浮在空气中。群体中的其他人在不知不觉中吸收了负面能量。紧张在整体场中制造了不均匀性，从而招致平衡力的作用。平衡既可以通过将群体能量拉向共同分母来恢复，也可以通过压制相反符号的能量势来恢复。例如，群体可能会取笑新加入的过度拘谨者，以使其放松。


  情绪和活力与能量层级直接相关。抑郁、压力、厌倦、疲劳和冷漠，都表明体内缺乏足够的能量。仅靠生理能量不足以维持高水平的活力。一个人可能身体疲惫，却同时感到舒适和愉快。同样，一个饱餐一顿、休息好的人，也可能感到沮丧和无精打采。


  自由能量在保证一个人拥有积极进取的生活态度方面起着最重要的作用。当一个人完全不想做任何事时，显然缺乏自由能量。一个人或许能在自由能量赤字的背景下，强迫自己执行例行功能，但会发现很难进行创造性工作或体力活动。意图是任何积极行为的驱动力，而当一个人没有自由能量时，就无法拥有意图。


  生理能量消耗在行动的物理执行上。这里我们将主要关注第一种能量——即用于创造意图的能量。这实际上是意图的能量，正是得益于这种能量，我们才体验到拥有和行动的动力。


  #### 压力与放松


  当一个人沮丧或紧张时，其中央经脉会受阻。经脉变窄，自由能量的循环随之减缓甚至完全停止。在这种状态下，意图失去了能量供给。当意图受阻时，一个人通常无法有效应对压力情境。压力也可能对经脉产生相反效应，使其突然扩张。当这种情况发生时，一个人能做出平时绝对做不到的惊人之举。虽有此类事例，但极为罕见。在大多数情况下，当身体经历高强度压力时，一个人的能力和资源会严重下降。


  每天人们都会面对强度各异的无数压力情境，从通常很快被遗忘的小事，到能让人长时间失去平衡的极度压力情境。身体对压力的自然反应是绷紧某个或某组肌肉。这种紧绷已成为根深蒂固的习惯，以至于我们几乎察觉不到。例如，当你阅读这些文字时，你正在绷紧个别面部肌肉，但一旦你将注意力放到它们身上，它们就会放松。几分钟后，你会忘记自己的面部，它将再次冻结成一副反映你情绪状态的面具。


  有一种错误但广为流传的观点认为，压力可以通过放松来缓解。试图放松，实际上是在对抗症状而非消除病因。身体紧张是由心理紧张引起的。压抑、焦虑、恼怒和恐惧等状态导致肌肉痉挛性紧张。自然，有意识地放松肌肉会带来暂时的缓解，但除非化解心理紧张，否则身体会恢复原状。要消除心理紧张，降低重要性是必要且充分的条件。你之所以紧张，归根结底是因为你赋予了令你沮丧的事物过度的意义。





  压力是重要性的后果。通过降低重要性，压力可以瞬间得到缓解。制造持续的重要性是徒劳且有害的。如果你背负着沉重的重要性包袱，你永远无法成功地向好的方向改变局势并有效行动。当你承受严重压力时，只需醒来、睁开眼睛，并意识到一个摆锤已经钩住了你的重要性就足够了。在每个具体实例中，很容易看出重要性与什么相关。提醒自己：通过降低重要性，你从摆锤中解脱出来，并能有效行动。你必须意识到，赋予某事物夸大的意义总是对你不利。


  要改变任何困难局面，只需记住重要性，并有意识地降低你与之关联的任何过度意义即可。唯一的挑战在于及时记起。当你有压力时，你的觉知处于睡眠状态，因此你会忘记名为“趋势冲浪”的东西
  ever existed。要从生活中消除压力，你必须醒来并降低重要性。


  如果你养成了关注内在声音的习惯，在必要时刻记住重要性根本不难。每当你感到不安时，问问自己为什么。意义在哪里被夸大了？无论具体环境对你来说多么“重要”，都要有意识地放下对其重要性的执着。只有在意图净化之后，你才能有效行动。


  要对压力产生免疫力，你必须用保持放松状态的新习惯，取代对任何小事都压力重重的旧习惯。处于放松状态并不意味着无精打采或漠不关心。这是一种与外部世界和谐互动的状态：平衡。平衡预设了内在和外在重要性的缺失：我既不优秀也不低劣，世界既不坏也不善；我既不卑微渺小也不微不足道，世界也既不卑微渺小也不微不足道。


  重要性的缺失，或至少是低水平的重要性，是变得放松的主要必要条件。当重要性被夸大时，试图放松是毫无意义的。例如，如果你站在高高的屋顶边缘且恐高，你几乎不可能指望自己能保持极佳的放松。如果降低重要性不可行，你至少可以避免在试图放松上浪费能量。这只会增加你的能量消耗，因为除了试图控制危急局势，你还在强行压抑自己的感受，这完全是徒劳的。相反，放手去做，尽管担心去吧！


  为了实践趋势冲浪，你必须能够在任何情况下迅速诱导放松状态。这不需要任何语言性的自我暗示，因为肌肉由意图支配，而非语言。身体的大多数肌肉只需通过觉知它们就能有意识地放松。只需用内在之眼扫描你的身体，即足以释放任何收缩。我们通常不会将注意力集中在肌肉上，直到我们感到身体不适，因此也会有某些肌肉群忘记了如何服从意图。这与现代大多数人久坐的生活方式有关。例如，很难有意识地控制背部肌肉，因此人们随着年龄增长往往会患上背痛。然而听起来多么平常，定期拉伸和锻炼背部是绝对必要的。


  诱导放松状态的整个程序如下。不慌不忙地用内在之眼迅速扫描你的身体，并释放任何收缩。一次性将注意力集中在身体的整个表面上。想象你的皮肤是一层膜，突然并迅速地从内向外变暖。将注意力集中在身体表面。以任何你喜欢的方式想象这一阶段：你的皮肤在变暖，覆盖着刺痛感或电流放电。重要的是感受你的皮肤。现在想象能量像肥皂泡上的虹彩一样，在你身体表面的各处闪烁。在这一刻，你是宇宙的一部分，并与它处于完美的平衡。无需尝试模拟任何特殊感觉。每个人体验这些事物的方式都不同。事实上完全不需要“尝试”。像顺道做一下一样做这个练习，但要果断。当你感觉整个身体表面充满能量时，所体验到的整体感受等同于一种放松、平衡与世界合一的状态。练习几次后，你将开始瞬间达到这种状态，很快，诱导放松状态将像交叉双臂一样容易。


  ##### 能量吸血鬼


  我们都游泳在一个能量的海洋中。但获取这种能量并不简单，因为它并没有相对于人类进行差异化分布。要有意识地获取这种能量，一个人必须有意识地拓宽他们的经络，并有意识地将能量流引入体内。你有意识、有目的地喝水，却无法以同等清晰的感觉吸引能量。人们原则上有能力有意识地从“宇宙”中“充电”，但这种能力仍停留在胚胎阶段。


  吸收已经被人体同化的他人能量，比从宇宙汲取能量容易得多。所谓的能量吸血鬼利用了这一事实。人体形式的能量易于同化，因为它具有特定频率。要获取他人的能量，只需像振荡电路收音机那样调谐到他们的频率——它不会接收所有无线电波，只接收它调谐到的那些频率。吸血鬼以其他人已同化的能量为食，为此他们将自己调谐到受害者散发的能量频率。


  能量吸血鬼会下意识地寻找各种方式，调谐到受害者能量的频率。能量吸血鬼可能会用无辜的问题搭讪你，盯着你的眼睛看，试图触碰你，握住你的手，或用强行插入的对话纠缠你。能量吸血鬼懂得如何适应并回应性格和气质，寻找潜入受害者灵魂深处、触及其脆弱点的方法。这是“隐秘型”吸血鬼的行为。通常，能量吸血鬼是位优秀的心理学家，善于交际但无魅力，且顽固地爱打探。这通常一眼就能看出来，尽管意识到自己的行为令人恼火，能量吸血鬼仍会极力试图以不同的面目示人。


