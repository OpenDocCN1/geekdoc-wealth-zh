  心智将灵魂的感知感知为直觉知识与灵感，而后以普遍认同的观念与分类形式对其进行解读。


  心智永远无法凭空发明全新的事物。心智只能用旧积木搭建新房子。凡是全新的创造，皆源自心灵与心智的合一。要达成这种合一，有着简单、具体的步骤可循。


  接受这样一个事实：所有知识对你皆可及。向内寻找答案。走你自己的路。行使你的个性权利。运用你获取知识的通道。


  一旦你设法将意图力量的焦点从他人转移至自我，知识便会对你变得可及。你只需告诉自己：你是独一无二的个体，且无所不知。问自己一个问题，然后等待答案。答案终将来到你身边，或许瞬间降临，或许几日后，又或许几月后，视问题的复杂程度而定，但答案必定会来！


  每个人心灵与心智的连接方式各异，但无论连接呈何种形式，最关键的是要铭记于心，使意图的力量与心灵同在。全部奥秘在于：许多人从未想过要这样做，但那些照做的人，便开始有所发现、创造杰作。


  唯有内在与外在的重要性，会遮蔽心灵与心智的合一。重要性将创造的本质锁进了既定刻板印象的盒子里。这正是你写给读者们的问题：“若不让他们的忧虑触动你，就无法高效工作”。


  你不觉得这是一句盖着“正确”印章的口号吗？它仿佛在乞求紧接着这样一句话：“若不让他们的问题触动你，你怎能帮助他们？”这听起来很正确，但其下藏着由摆动子制造的虚假刻板印象。


  你之所以能帮忙解决他人的问题，不是因为你让它们触动了你，而是尽管你被触动了，你依然能做到。而且，一旦你在精神上深陷他人的问题，你就失去了客观解决它们的能力。


  人们之所以首当其冲地体验问题，是因为他们完全沉浸在自导自演的剧本中。生活“降临”在他们身上，而他们像在非清醒梦中一样，受制于环境的力量。一旦他们走下舞台来到观众席，从另一视角观察这出戏剧，许多事情便会看得更清楚。


  当你的心智沉浸在他人的问题中时，你与他们处于同一境地。为了理解并解决他人的问题，你必须超然行事。


  这并非意味着无情或漠不关心，而是保持超脱。这是“无重要性”与“无同情心”的区别。


  只有当你采取“参与的旁观者”角色时，才能找到解决问题的办法，无论是你自己的还是他人的。只要你在“经历”你的问题或他人的问题，你就依然无力。许多读者难以辨别超脱与冷酷的区别。无重要性关乎超脱，而非冷漠。像孩子一样“只为好玩”地演绎你的角色。那时你将成为提线木偶的操纵者、局势的主宰；而当你的心智沉浸在剧演中时，你就是线上的木偶。


  真没必要对遭遇的一切都投入情感认同。说到底，事物不像初看上去那样重要。你该帮助那些需要你帮助的人，但帮助应带着超脱给予，不让自己陷入痛苦，不在深层情感上产生共鸣，因为那只会造成更多伤害。此外，帮助只应在被请求时给予。


  针对你的提问：“……敏感的人该怎么办，比如那些每天施舍的人？有一个非常直白的答案，但可能出乎你的意料：放弃愧疚感。


  凡是经常施舍的人，都会感到一种责任感，而责任感源于愧疚感。怜悯贫困者与感到有责任帮助他们，是有区别的。责任感倒不如说是重要性的体现，而非怜悯的反映。


  如果你突然被一阵同情心淹没，针对某个特定的贫困老妇，这是怜悯。但如果你无法路过任何乞丐而不被良心折磨，这不是怜悯，而是责任感。那么，该怎么办？


  承认你的自由。你不欠任何人什么。主张你的获知权。你同样有能力创造并提供答案。然而，若你不摆脱重要性，你就会被疑虑折磨。若你摆脱了重要性，你就是对的；当你自由时，你可以允许自己同情与共情。


  ##### 如何挽回深爱之人


  “我求你告诉我，如何挽回我深爱的男人。”


  如果你深爱的男人是自行选择离开，那么你极大概率无法挽回他。至少你无法凭借内在意图的努力将他挽回生活，即通过任何直接旨在“挽回他”的行动。这包括任何试图直接影响当事人的企图。即使你侥幸有所成效，那个人也不会再是原先的模样。


  只有外在意图能将他挽回。内在意图试图直接影响世界以追求目标。外在意图的运作方式是：世界本身会走到你半路相迎。我可以简要解释外在意图如何运作。


  在关系中，伴侣由内在意图驱动，即他们想从对方那里得到什么，得不到便结束关系。


  每个人在关系中寻找满足的方式各异。他们可能需要爱、性、尊重、认可、对特定个人品质的肯定、亲密、相互理解、逃离孤独、快乐等。这些不同需求是否有个共同要素将它们联合？这个共同要素始终存在，且始终是对个体自我价值的保护与确证。无论何种指导原则主导一个人的行动，所有个人动机都与自我价值感相连。这是人性使然。


  人际关系中的内在意图，始终以一种或另一种形式，旨在保护并确证自己的自我价值。你所爱之人的内在意图正是指向此处——寻找一个能满足其自我价值感的伴侣。


  那么，你的内在意图指向何处？挽回挚爱，以此首先恢复你自己的自我价值感，其次重续一段曾给你带来满足感的关系。


  现在问问你自己：如果你仅允许内在意图引导，你能满足伴侣的需求吗？


  若你渴望挽回伴侣，你必须给予他其内在意图的焦点。不要因他想在你身上寻找价值确证而评判他，因为你也渴望从他那里得到什么。





  您可能还记得，Frailing 声音的第一原则是：放弃接受的意图，将其替换为给予的意图，然后您将得到您所放弃的那件事物。


  放弃内在的意图，无论它指向何界。确定您伴侣内在意图的焦点。将您的志向转向实现伴侣的意图。一旦您的行动转向满足伴侣的需求，您自己的内在意图将被转化为外在意图。


  您会发现，通过采用这种方法，您不仅会让伴侣感到快乐，还会从伴侣那里获得您所渴望的一切，甚至更多。如果您能放弃接受的意图并用给予的意图取而代之，您将立即得到您所放弃的东西。


  这一原则之所以如此有效，以至于它会让您感觉仿佛有一种神奇的力量在起作用。这是真正的魔法。不需要咒语或爱情药水。


  尽管我们已经说了这么多，但失去的东西要想追回，就像同一条河流想要踏两次，同样困难。在关系开始出现问题之前，尝试并坚持遵循 Frailing 的原则会更好。


  无论如何，在我处于你的位置时，在我采取任何行动之前，我会非常仔细地考虑您是否真的想重新赢回这个男人，或者您真正拥有的只是一种恢复失去的自尊心（被他抛弃后）的燃烧渴望。


  感到被拒绝或被忽视是非常痛苦的，我知道。但即便我知道您关系的所有细节和环境，我也无法提供更具体的建议。我所能做的只是给您工具。您如何选择使用它，只有您自己能决定。


  不要忘记，您世界的一层是您的镜子。如果您选择受苦，这就是将要发生的事情。如果您应用协调意图的原则，并将当前环境完全视为积极的，事情也会如此发展。


  您认为一切都出错了，但您是否曾想到，您与所爱之人的分离可能正在救您免于尚未看到的问题？告诉自己，一切都应有其发生的方式，因为是否选择欢欣或受苦取决于您自己。如果我是您，我会振作精神，为喜悦而跳舞，并为喜悦而鼓掌。让镜子带给您快乐。


  “我有同样的问题。我爱的女人要离开我——我的妻子（我们交往了三年，结婚已有四年）。


  分离的主要原因是我自身的财务不安全感。在许多方面，我太过软弱、胆怯和过度谨慎。我的妻子认为，凭借我的知识和经验，我应该创办自己的企业，因为像我这样性格温和的人想要晋升到职业阶梯的顶端是困难的。而且，建立事业对创造型人来说并不真正是合适的选择。


  在某种程度上，我同意我的妻子的看法。我倾向于过于彻底，总是寻找额外的信息或获取更多经验的方法。在我职业生涯中，我没有在任何一个岗位上工作超过两年（这使我在商业方面拥有了丰富的经验和知识）。我性格的一个强点是我很善于接受。这也是一个劣势，因为这种性格特质让我更难建立事业。


  我的妻子想要稳定、可靠和孩子。这些也是我的个人动机，但我不认为它们会在职业的背景下发展，而更多地体现在设计一个盈利系统（商业模式）的原则上。这需要知识和经验，而这些一直是我最高的优先事项之一。


  三个月前，我和妻子终于离婚了，而现在我的妻子正在租一套她工资负担得起的独立公寓。她正在寻找自己，但我们的关系变得越来越冷淡，她似乎不想见我。我怎样才能赢她回来？”


  我无法给出一个具体的配方来解决您的问题。我仅在情况非常清晰时才提供具体的解决方案。而且即便如此，我的观点也是纯粹主观的，因而易犯错误。如果我不知道一个问题的答案，我会询问我的直觉。如果我的直觉没有帮助，我建议应用
  Transurfing 的原则之一，因为我知道这不会造成任何伤害。


  在这种情况下，我的直觉与以下原则一致：您必须完全倾听自己内心的声音。其他人会说，成功在于良好的事业、稳定和高薪，但这些与我们的目标毫无关系。毫无疑问，一个人的人生真正道路不可能就是攀登职业阶梯？


  事业、稳定和高薪本身并不是目标。它们是目标的附属属性。只有通过实现目标，这些属性才会自然随之而来。例如，您成为所在领域的领先专家，就会因此获得生活的所有益处。


  为实现目标而努力，而不是为目标带来的益处而努力，这是合理的。这看起来很明显。任何人都能理解这一点，但悖论在于：这种观念在人们觉察中只是一个瞬间的闪现，随后就被属性的光泽所掩盖。


  人们就像飞蛾扑向灯泡般追逐属性，但这并不能让他们前进半步。如果你朝着目标的属性而不是目标本身努力，你怎能获得成功？正是在这里，“巨大的丰盛是少数特权者的享受”这一神话产生的。


  公众舆论强加其刻板印象，但刻板印象的形象 solely 来源于可见的终端结果，而成功则来源于朝着目标前进的过程。终端结果始终可见，而讲述目标如何实现的过程却始终笼罩在阴影之中。因此，刻板印象被创造出来：追逐事业和好钱，换句话说，“直奔灯泡！”


  人们看到的只是已经升起的星星的光泽。极少有人会把注意力放在将星星带到成功巅峰的道路上。所有明星都必须穿越一片由挫折和失败构成的密林。只有那些坚信自己走在真正道路上的人，才会得到成功的青睐。以不可动摇的精神朝着目标前进，并记住：无论发生什么，替代方案的展开都应朝着应有的方向进行。没有人能知道目标何时或如何实现。


  如果你跟随刻板印象的脚步前进，你肯定会成功，但你的成功程度将是平庸的，并且需要巨大的努力。要获得巨大的成功，你必须明确你的目标，并且不顾他人可能的阻扰，坚定不移地朝着目标前进。倾听他人的建议没有害处，但最终的决定必须由心做出。只有这样，你才能停止像黑暗中的飞蛾一样，反复撞击灯泡而疲惫不堪。


  恰当的决定总是来源于心与 mind 的统一。一个完全不恰当的决定是基于内心不适感做出的决定。如果一个决定让你在直觉上产生最轻微的不安，类似于义务感，那么你的心在说“不”。反之，如果你所做的决定没有让你产生任何内心的不适，那么你的心在说“是”或“我不知道”。在这种情况下，你的
  mind 进行最终选择。如果这个决定对你是正确的，你的心会歌唱，而你的 mind 会因欣喜而搓手。





  #### 意向与生命的流动


  另一方面，如果你无法确定你的目标，就不要折磨自己去尝试。这并不意味着没有目标你就无法生活。如果这正是你所想，为什么不只是随心所欲地生活，而不必为着某个目标而奋斗？如果是这种情况，我只能给出一条建议：顺应流动而行，而不仅仅是被流动裹挟着前行。换句话说，你需要遵守协调原则，如此生活便会走上平静、舒适的轨道。当你停止那断断续续、急躁的寻找目标的尝试时，你的目标无疑会自行显现。


  至于你关于如何挽回妻子的问题，恐怕我无法给你任何建议。这句话——“她在寻找自我，但我们的关系正变得冷淡，而且她似乎不想见我”——清楚地表明，问题不在于经济稳定或缺乏经济稳定。如果她不爱你，就不可能挽回她。


  ##### 意向


  > “我的问题是：Transurfing 的法则能否延伸应用到他人身上？例如，母亲想治愈孩子（我的孩子患有精神疾病），或者我有意向让俄罗斯成为富裕国家、让国民幸福。”


  意向无所不能。问题在于力量。如果你拥有像耶稣基督那样力量的意向，当然可以治愈，但意向的力量并非欲望的力量。如果你极其强烈地想要某样东西，反而不太可能得到它。这也不是信仰的问题，因为有信仰的地方总会有怀疑的空间。


  意向是不带激情的、无条件的决心，要看到你的意志在现实中显化，并笃定地知道事情必将如此。当意向摆脱了欲望、恐惧、怀疑和其他重要性势能时，它就是纯粹的。例如，从信箱取信件的意向就是纯粹的意向。


  如果你治愈孩子的意愿同样纯粹，那你就会治愈他们，但千万别落入以为靠付出努力就能达成结果的陷阱。无论瘫痪者付出多少努力，都永远无法站起来行走。但另一方面，如果他们恰巧能“回忆”起自己过去是如何行动的，就能轻易恢复行动能力。


  没有人能教授意向的力量——无论是我还是其他任何人——但 Transurfing 提供了方法，使意向能在不依赖你意志的情况下发挥作用。我说的是外在意向。


  在这种情况下，如果治疗无效，你必须停止试图治愈孩子。什么是心理障碍？那是灵魂调谐到了替代空间中尚未流入物质现实的某个区域。大多数健康的人调谐到了我们的物质世界，而精神病人并非真正意义上的“生病”；他们只是在场域的某个区域“翱翔”，从我们的角度来看似乎不正常，因为那里尚未转化为物质现实。


  接纳孩子原本的样子。他们没有病；只是和别人不同。一个人与众不同是件好事。这才应该是常态。不正常的是现状：每个人都以同样的方式思考和行动。


  试图让孩子变得“正常”，你什么也达不到。正如我所说，意向的力量无法强求。通过尝试、付出努力、感到沮丧，你只是制造了过剩势能，反而只会加剧事态。


  然而，如果你能接纳孩子原本的样子并承认他们的理智健全，意向的力量就会间接降临，你内在意向的力量将转化为外在意向。


  给予孩子你的关注、爱，并在力所能及的范围内给予他们自由。解放孩子，让他们不必“正常”；解放你自己，让你不必把他们变“正常”。那么也许不会立竿见影，但随着时间推移，你将开始看到成效。


  你也必须自己决定是否采纳我的建议。显然，我的建议不是专业精神科医生的建议。我甚至有资格给出这样的建议吗？


  你的心会为任何与你个人相关的问题提供答案。请信任你内心的声音，高于他人的意见，包括我自己的。


  我唯一的优势是我对你的孩子没有情感依恋。在这个意义上，我对他们没有过剩势能，因此我回答你问题的意向是纯粹的。


  但我无法理解，如果你自己的孩子生病了，为什么你却如此在意俄罗斯的命运。这对一个人的关切来说，规模不是太大了吗？我不是那种旨在让所有人都快乐的主张的拥趸。


  每个人只能创造自己世界的层面，因此不可能有哪一个单独的个人能赐予全俄罗斯幸福。只有当大家共同努力时，这才有可能实现。但被共同理念团结在一起的人们，最终会制造出一个摆，它迟早会诱使核心追随者偏离真实的道路，并对竞争对手发动战争。


  你和我一样清楚，旨在让所有人快乐的主张会导致什么后果。任何此类主张，哪怕是基于爱上帝的精神主张，都会产生一个摆。无数民族曾因上帝之名和人间幸福而被灭绝。


  没有任何摆能让所有人快乐，任何这类尝试只会带来巨大的痛苦和灾难。幸福不是可以共享的共同之物。幸福是一个极其个体化的概念。当一个民族采取行动为所有人建设幸福社会时，只能导致那种根据布尔加科夫的说法，“不在壁橱里，而在头脑里”肆虐的混乱。


  摆通过将关爱他人包装成大爱而获益，并拥有制造极具说服力的刻板印象的高超手段。然而，这只是漂亮的煽动辞令。只有当每个人都通过自己的门、走向自己内在的目标时，所有人才会幸福。在这个意义上，Transurfing
  是一种为个人主义者服务的摆，但它是通往真实而非昙花一现的幸福的唯一真正道路。


  你必须远离摆，让灵魂走出刻板印象的盒子，致力于你自己的幸福。在通往目标的路上，你将有机会做许多真正的善事，当然也能帮助穷人和有需要的人，因为你将拥有更多资源。


  > “你说当一个人乘上成功之浪时，他们在各方面都会快乐和幸运，关键是不屈服于破坏性摆的影响。可生活并不完美，很少有人能在所有方面都走运。要么你在工作和事业上有成长和成功，要么你幸运地拥有温馨、平静、充满爱的家庭。大多数人希望两者皆美。”


  是你自己在说没有人能在所有方面都走运。这是你个人的选择。如果你这样想，这对你来说就会成真。世界总是显化你为自己做出的选择。你写道：“大多数人希望两者皆美。”这里世界同样显化了你的选择。它完美地反映了这样一个事实：你想要两者皆美，但仅止于“想要”。你想要，不是吗？所以你将得到的正是：一个“想要”的自我。


  当你停止单纯地“想要”，转而“意向”去拥有，那时你才会得到。请留意 Transurfing 的座右铭：“我不想要或希望，我意向。”


  ##### 重要性势能






  #### 如何克服恐惧、焦虑与惊恐？


  ##### 恐惧的本质与机制


  > “请告诉我如何克服恐惧、焦虑和惊恐。在实际操作层面，如何避免被这些情绪击垮？当我亲近的人离开，比如女儿或儿子，恐惧如潮水般袭来吞噬我：他们降落平安吗？为什么不打电话报平安？”


  你触及的问题是有趣但相当复杂的。**不存在消除恐惧的通用秘方**。如果你找到了一种无需改变意识觉知就能简单有效地化解恐惧的方法，那将是有史以来最伟大的发现之一。


  在 **Transurfing（趋势冲浪）** 术语中，**恐惧是一种过剩能量势能**，当我们给恐惧对象赋予**过度意义**时，它便会产生。过剩势能会破坏场的平衡，从而引发旨在消除失衡的平衡力。


  假设你不得不沿着悬崖边缘行走，并极度恐惧跌落深渊。平衡力以何种方式消除过剩势能？**最省能量的方式是将你抛入深渊，一了百了**。自然总是选择阻力最小的路径。


  然而，既然这个选项不合你心意，你便对抗平衡力的阻力，即**控制你自己**。结果发现，为了平衡恐惧势能，你必须付出更多努力。结果是你的能量支出是双重的：既花在势能本身上，又花在维持它上。**几乎不剩什么自由能量，让人陷入一种发愣的状态**。


  如果恐惧势能力量足够大，将无法被控制，平衡力就会随心所欲地摆布你。换句话说，**惊恐感产生，你被旨在熄灭势能的力量卷走——即走向死亡**。如果你能有意识地降低围绕局势的重要性层级，恐惧就会消失。问题在于，在这样的局势中，**无法有意识地降低重要性**。因此，**唯一有效的方法是建立某种安全网或替代路线**。无论采取何种形式，都将因情况而异。


  ##### 实操策略：停止对抗，允许恐惧存在


  如果你没有安全网，唯一能做的就是**避免挣扎着去控制焦虑**。试图说服自己不害怕是徒劳的。**自我欺骗无济于事**。任何形式的内心抗争都只会耗尽你的能量，并加剧过剩势能的问题。**如果无法不感到恐惧，那就去感受恐惧**。在环境允许的范围内尽力而为，但**不要对抗恐惧本身**。


  **例如**，如果你在演讲前紧张，就**尽管去做**。**自然地、愉悦地紧张**。完全把自己交给这美妙的感觉。允许自己以最令你愉悦的方式“失去理智”。**一旦你允许自己这种自由，所有焦虑最终都会神奇地消散，化为乌有**。之所以发生这种情况，是因为你原本有相当一部分能量花在对抗焦虑上了。


  ##### 焦虑与担忧：较弱的恐惧表现


  **焦虑和担忧是恐惧力度较弱的表现**。这里的重要性源于对未知的预期。在这种情况下，**有可能降低重要性的门槛**。如果某事让你担忧，告诉自己：**为它担忧是自毁的，因为通常我们的猜疑和最坏的预期会变成现实**。


  **消除焦虑的一种途径是行动，无论何种行动**。由焦虑和担忧产生的势能会在行动中耗散。**无所事事的担忧会笼罩在你周围，直到你采取行动**。你采取的行动形式甚至**不必与焦虑对象有任何关联**。只要让自己忙碌起来，你会立刻看到焦虑强度已平息。


  ##### 协调意图原则：降低重要性的支点


  **协调意图原则（“一切正在按应有方式展开”）可作为降低重要性门槛的有用参考点**。允许自己**不知道事件该如何发展**。放开对局势的控制欲，给局势**自行成功化解的机会**。


  如果你有意识地**顺应潮流**，而不是在水中徒劳挥舞双手，环境将开始**以积极方式展开**。你可以确信协调意图原则行之有效。世界**无意给任何人制造麻烦**，并非因为有专门照顾你的力量存在，而是因为**这涉及更少的能量支出**。


  **自然不浪费能量，在你身上浪费能量对自然无利**。我们经历的困难**总与过度的能量支出相关**。反之，**繁荣是常态，只需最小能量支出**。头脑不理解阻力最小路径，却与替代流抗争，从而给自己招来障碍和问题。它们还能从哪来？**能量守恒定律无人能废除**。


  协调原则**不应按字面或绝对意义理解**。你不能径直闯入事物核心，同时跟自己保证一切都在按应有方式展开。但**总体上你可以依赖这一原则**。


