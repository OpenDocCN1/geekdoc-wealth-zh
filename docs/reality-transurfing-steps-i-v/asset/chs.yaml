  对性不可能持中立态度。人性终将显露。有些人对性的关系表现为恼怒、嘲笑和拒绝。在另一些人身上，它转化为意图。如果意图未实现或实现失败，各种情结（用 Transurfing
  术语说就是“负面滑动”）就会在人类心理中浮现。


