  他们能做什么？拒绝是一种选择。一个人往往用拒绝无法企及的成功模式筑起一堵墙围绕自己。或者，他们继续遵循摆动规则追逐模式，试图改变自己，将灵魂强塞进社会规训的盒子里。这条路只会导致不满和缺乏成就感，于是他们再次尝试改变。


